name: Build Frontend

on:
  push:
    branches: [main]
    paths: [frontend/**]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://portal.spacepoint.ae/api
          # Intercom/Fin workspace App ID for the student support messenger.
          # Inline rather than a secret on purpose: it ships inside the JS
          # bundle and is readable in devtools, so Intercom treats it as
          # public — same posture as VITE_API_URL above. The identity
          # verification secret is server-side and must never appear here.
          # Blank would silently ship a frontend with no messenger at all,
          # since Vite inlines this at build time.
          VITE_INTERCOM_APP_ID: hsw1zj8e
        run: npm run build

      - name: Package dist
        working-directory: frontend
        run: tar czf ../frontend-dist.tar.gz -C dist .

      # Publishes to a single, stable "frontend-latest" release tag so the VPS
      # always has one predictable URL to pull from (no need to know run IDs
      # or specific commit SHAs) — the action updates the existing release in
      # place on every push rather than creating a new one each time.
      - name: Publish as frontend-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frontend-latest
          name: "Frontend (latest build)"
          body: "Auto-built from commit ${{ github.sha }}. VITE_API_URL=https://portal.spacepoint.ae/api VITE_INTERCOM_APP_ID=hsw1zj8e"
          files: frontend-dist.tar.gz
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
