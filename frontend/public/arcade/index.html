          <div class="choice3" id="dt-pick">${shuffle([['mtq', 'Magnetorquer', 'coil that pushes on Earth’s field'], ['st', 'Star tracker', 'camera that reads star patterns'], ['rw', 'Reaction wheel', 'spinning flywheel'], ['ss', 'Sun sensor', 'measures Sun direction']]).map(([k, n, d]) => `<button data-a="${k}">${n}<small>${d}</small></button>`).join('')}</div><p class="feedback" id="dt-fb"></p>`;
      } else if (S.phase === 'spin') {
        ctl.innerHTML = E
          ? `<p class="lbl">Step 2 · detumble</p><p class="hint">Hold the button to fire. The coil grip bar shows how much push you get right now.</p>
             <div><p class="lbl">Coil grip</p><div class="gauge" style="margin-top:6px"><div class="fill" id="dt-grip" style="background:var(--amber)"></div></div></div>
             <button class="btn fire" id="dt-fire">Hold to fire magnetorquer</button>`
          : `<p class="lbl">Magnetorquer dipole command</p><div class="polarity" id="dt-pol">${[[-1, '− dipole'], [0, 'Off'], [1, '+ dipole']].map(([v, t]) => `<button data-s="${v}" aria-pressed="${v === 0}">${t}</button>`).join('')}</div>
             <p class="hint">Keyboard: ← for −, ↓ for off, → for +.</p>`;
        if (E) {
          const f = $('#dt-fire', ctl);
          const on = e => { e.preventDefault(); if (api.over() || S.phase !== 'spin') return; S.s = 1; f.classList.add('on'); };
          const off = () => { S.s = 0; f.classList.remove('on'); };
          f.addEventListener('pointerdown', on); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => f.addEventListener(t, off));
          f.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') on(e); });
          f.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') off(); });
          f.addEventListener('contextmenu', e => e.preventDefault());
        }
      } else if (S.phase === 'mode') {
        ctl.innerHTML = `<p class="lbl">Step ${E ? 3 : 2} · detumbled at ${Math.abs(S.w).toFixed(1)}°/s</p><p>${E ? 'The spin is under control and the battery is low. What should the satellite do next?' : 'Rates are nominal. Battery at ' + S.bat.toFixed(0) + '%. Which mode does the state machine command next?'}</p>
          <div class="choice3" id="dt-mode">${shuffle([['sun', E ? 'Point solar panels at the Sun' : 'Sun-pointing', E ? 'recharge the battery' : 'power-positive safe attitude'], ['nadir', E ? 'Point the camera at Earth' : 'Nadir pointing', E ? 'start taking photos' : 'payload operations'], ['tumble', E ? 'Keep firing the coil' : 'Stay in detumble', E ? 'spin even slower' : 'continue B-dot']]).map(([k, n, d]) => `<button data-m="${k}">${n}<small>${d}</small></button>`).join('')}</div>`;
      }
    }
    ctl.addEventListener('click', e => {
      if (api.over()) return;
      const a = e.target.closest('[data-a]');
      if (a && S.phase === 'pick') {
        S.pickOk = a.dataset.a === 'mtq';
        ctl.querySelectorAll('[data-a]').forEach(x => x.classList.add(x.dataset.a === 'mtq' ? 'right' : x === a ? 'wrong' : 'x'));
        const fbb = $('#dt-fb', ctl);
        fbb.className = 'feedback ' + (S.pickOk ? 'ok' : 'bad');
        fbb.textContent = S.pickOk ? 'Correct. Magnetorquers need no propellant and work at any spin rate.' : 'Star trackers and Sun sensors only measure. Reaction wheels can saturate at high spin rates. CubeSats detumble with magnetorquers.';
        if (!S.pickOk) api.mistake();
        setTimeout(() => { if (!api.over()) { S.phase = 'spin'; controls(); } }, S.pickOk ? 900 : 2200);
        return;
      }
      const p = e.target.closest('[data-s]');
      if (p && S.phase === 'spin') { S.s = +p.dataset.s; ctl.querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', x === p)); return; }
      const m = e.target.closest('[data-m]');
      if (m && S.phase === 'mode') { S.mode = m.dataset.m; api.finish(evaluate()); }
    });
    const onKey = e => {
      if (E || S.phase !== 'spin' || api.over()) return;
      const map = { ArrowLeft: -1, ArrowDown: 0, ArrowRight: 1 };
      if (!(e.key in map)) return; e.preventDefault();
      S.s = map[e.key]; ctl.querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.s === S.s));
    };
    document.addEventListener('keydown', onKey);
    function draw() {
      const r = cv.getBoundingClientRect(); if (!r.width) return;
      const dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(r.width * dpr)) { cv.width = r.width * dpr; cv.height = r.height * dpr; }
      const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = r.width, H = r.height, cx = W / 2, cy = H / 2;
      c.clearRect(0, 0, W, H);
      // field lines (inertial)
      c.save(); c.translate(cx, cy); c.rotate(rad(S.beta));
      c.strokeStyle = 'rgba(168,128,255,.22)'; c.lineWidth = 1;
      for (let y = -260; y <= 260; y += 28) { c.beginPath(); c.moveTo(-400, y); c.lineTo(400, y); c.stroke(); for (let x = -380; x < 400; x += 90) { c.beginPath(); c.moveTo(x + 6, y); c.lineTo(x, y - 4); c.lineTo(x, y + 4); c.closePath(); c.fillStyle = 'rgba(168,128,255,.35)'; c.fill(); } }
      c.restore();
      // spin arc
      const mag = clamp(Math.abs(S.w) / w0, 0, 1);
      c.strokeStyle = mag > 0.3 ? '#ff6b6b' : mag > 0.1 ? '#ffcf5c' : '#3fd3ad'; c.lineWidth = 4;
      c.beginPath(); const a0 = -Math.PI / 2; c.arc(cx, cy, 82, a0, a0 + Math.sign(S.w) * mag * Math.PI * 1.8, S.w < 0); c.stroke();
      // satellite
      c.save(); c.translate(cx, cy); c.rotate(rad(S.th));
      c.fillStyle = '#25143a'; c.strokeStyle = '#a880ff'; c.lineWidth = 2; c.fillRect(-34, -34, 68, 68); c.strokeRect(-34, -34, 68, 68);
      c.strokeStyle = '#27345a'; c.lineWidth = 1; for (let k = -24; k <= 24; k += 12) { c.beginPath(); c.moveTo(k, -34); c.lineTo(k, 34); c.stroke(); }
      const firing = S.s !== 0 && S.phase === 'spin' && S.bat > 0;
      c.shadowColor = '#ffb547'; c.shadowBlur = firing ? 18 : 0;
      c.fillStyle = firing ? (E || S.s > 0 ? '#ffb547' : '#ff8f6b') : '#7a6230'; c.fillRect(-46, -5, 92, 10);
      c.shadowBlur = 0; c.fillStyle = '#e8ecf6'; c.font = '600 9px Inter, sans-serif'; c.textAlign = 'center'; c.fillText('MTQ · X', 0, 22);
      c.beginPath(); c.moveTo(46, 0); c.lineTo(38, -6); c.lineTo(38, 6); c.closePath(); c.fillStyle = '#ffb547'; c.fill();
      c.restore();
      c.fillStyle = '#8b96b6'; c.font = '500 11px Inter, sans-serif'; c.textAlign = 'left'; c.fillText('B', 10, 18);
    }
    function readouts() {
      const p = phi(), Bx = Math.cos(p), dBx = Math.sin(p) * (S.w - ORB);
      $('#dt-ro', el).innerHTML = `<div class="ro"><span class="lbl">Spin rate${E ? '' : ' (gyro)'}</span><b style="color:${Math.abs(S.w) <= target ? 'var(--ok)' : 'var(--ink)'}">${Math.abs(S.w).toFixed(1)}°/s</b></div>
        <div class="ro"><span class="lbl">Battery</span><b style="color:${S.bat < 25 ? 'var(--crit)' : 'var(--ink)'}">${S.bat.toFixed(0)}%</b></div>` +
        (E ? `<div class="ro"><span class="lbl">Target</span><b>&lt; ${target}°/s</b></div>` :
          `<div class="ro"><span class="lbl">Magnetometer Bx</span><b>${Bx >= 0 ? '+' : ''}${Bx.toFixed(2)}</b></div><div class="ro"><span class="lbl">Bx trend</span><b style="color:${dBx > 0 ? 'var(--sig)' : 'var(--amber)'}">${Math.abs(dBx) < 0.02 ? '— steady' : dBx > 0 ? '▲ rising' : '▼ falling'}</b></div>`);
      const g = $('#dt-grip', el); if (g) g.style.width = (Math.abs(Math.sin(p)) * 100) + '%';
    }
    const DT = 0.05;
    const iv = setInterval(() => {
      if (api.over()) return;
      if (S.phase === 'spin') {
        const sp = Math.sin(phi());
        if (S.s !== 0 && S.bat > 0) {
          const wd = E ? -Math.sign(S.w) * A * Math.abs(sp) : S.s * A * sp;
          if (!E) { S.fireT += DT; if (S.s === -Math.sign(S.w * sp)) S.goodT += DT; }
          S.w = clamp(S.w + wd * DT, -60, 60);
          S.bat = Math.max(0, S.bat - drain * DT);
        }
        if (Math.abs(S.w) <= target) { S.detumbled = true; S.s = 0; S.phase = 'mode'; controls(); }
        else if (S.bat <= 0) { S.flat = true; S.s = 0; api.finish(evaluate()); return; }
      }
      S.th += S.w * DT; S.beta += ORB * DT;
      draw(); readouts();
    }, DT * 1000);
    function evaluate() {
      const notes = []; let acc = 0;
      const pol = S.fireT > 0 ? S.goodT / S.fireT : 0;
      if (E) {
        if (S.pickOk) acc += 0.2;
        notes.push({ ok: S.pickOk, t: S.pickOk ? 'Magnetorquer chosen: no moving parts or propellant, and effective at any spin rate.' : 'The detumbling actuator is the magnetorquer. Sensors only measure; reaction wheels saturate quickly at high spin.' });
      }
      if (S.detumbled) acc += E ? 0.5 : 0.55;
      notes.push({ ok: S.detumbled, t: S.detumbled ? `Spin reduced from ${w0.toFixed(0)}°/s to ${Math.abs(S.w).toFixed(1)}°/s.` : S.flat ? `Battery ran flat at ${Math.abs(S.w).toFixed(1)}°/s. Firing while the field runs along the coil wastes energy, because a coil only pushes on field that crosses it.` : `Still spinning at ${Math.abs(S.w).toFixed(1)}°/s when time ran out.` });
      if (!E) {
        acc += 0.15 * clamp((pol - 0.5) / 0.4, 0, 1);
        notes.push({ ok: pol >= 0.8, t: `${Math.round(pol * 100)}% of firing time used the correct polarity. B-dot: command the dipole opposite to the change in the field (m = −k·dB/dt).` });
      }
      const eOk = S.detumbled && S.bat >= 30; if (eOk) acc += 0.1;
      notes.push({ ok: eOk, t: `Battery left: ${S.bat.toFixed(0)}%. ${eOk ? 'Enough margin for the next mode.' : 'Aim to keep at least 30% for the next mode.'}` });
      const mOk = S.mode === 'sun'; if (mOk) acc += 0.2;
      if (S.detumbled) notes.push({ ok: mOk, t: mOk ? 'Sun-pointing next: after detumbling, a power-positive attitude recharges the battery before any payload work.' : S.mode === 'nadir' ? 'Nadir pointing comes later. With a drained battery the satellite first goes Sun-pointing to become power-positive.' : 'The spin is already low. Staying in detumble wastes energy; switch to Sun-pointing to recharge.' });
      return { acc: clamp(acc, 0, 1), notes, passed: S.detumbled };
    }
    controls(); draw(); readouts();
    const onR = () => draw(); window.addEventListener('resize', onR);
    return { stop: () => { clearInterval(iv); document.removeEventListener('keydown', onKey); window.removeEventListener('resize', onR); }, timeout: () => api.finish(evaluate()) };
  }
};

/* =====================================================================
   REUSABLE ENGINES · sort, sequence, scenario rounds, tune
   ===================================================================== */
const lbar = p => `<div class="lbl" style="display:flex;justify-content:space-between;gap:10px"><span id="${p}-k"></span><span id="${p}-s"></span></div>`;
function base(c, kind) {
  return { id: c.id, mod: c.mod, kind: c.kind || kind, title: c.title, covers: c.covers, blurb: c.blurb, lesson: c.lesson, time: c.time, brief: m => c.brief[m] };
}

/* SORT: tap an item, tap the bin it belongs to */
function mkSort(c) {
  const g = base(c, 'Checkpoint');
  g.engine = 'sort';
  g.time = c.time || { explorer: 45, engineer: 60 };
  g.mount = (el, api) => {
    const D = c.data[api.mode];
    const items = shuffle(D.items.map((it, i) => ({ ...it, id: 's' + i, name: it.t })));
    const place = {}; let sel = null;
    el.innerHTML = `<div class="split"><section class="panel" id="trayp"><h3 class="lbl">${esc(D.trayLabel || 'Items to sort')}</h3><div class="parts" id="tray"></div><p class="hint" style="margin-top:12px">Tap an item, then tap the group it belongs to. Tap a placed item to move it.</p></section>
      <section class="panel"><h3 class="lbl">${esc(D.binLabel || 'Groups')}</h3><div class="chipboard" id="bins" style="margin-top:10px"></div>
      <div class="actions"><span class="msg" id="msg"></span><button class="btn primary" id="verify">Check answers</button></div></section></div>`;
    const tray = $('#tray', el), bins = $('#bins', el), msg = $('#msg', el);
    function render() {
      tray.innerHTML = items.filter(p => !place[p.id]).map(p => partChip(p, sel)).join('') || '<span class="hint">Everything is sorted.</span>';
      bins.innerHTML = D.bins.map(b => `<div class="socket ${sel ? 'armed' : ''}" data-t="${b.id}" role="button" tabindex="0" aria-label="${esc(b.label)}"><span class="socket-k">${esc(b.label)}</span>${b.desc ? `<span class="socket-d">${esc(b.desc)}</span>` : ''}<span class="socket-in">${items.filter(p => place[p.id] === b.id).map(p => partChip(p, sel)).join('') || '<em>empty</em>'}</span></div>`).join('');
    }
    el.addEventListener('click', e => {
      if (api.over()) return;
      const pc = e.target.closest('[data-p]'), sk = e.target.closest('[data-t]');
      if (pc && !(sk && sel && sel !== pc.dataset.p)) { sel = sel === pc.dataset.p ? null : pc.dataset.p; render(); return; }
      if (sk && sel) { place[sel] = sk.dataset.t; sel = null; msg.textContent = ''; render(); return; }
      if (e.target.closest('#trayp') && sel) { delete place[sel]; sel = null; render(); }
    });
    const binName = id => (D.bins.find(b => b.id === id) || {}).label;
    function evaluate(timedOut) {
      let ok = 0; const notes = [];
      items.forEach(it => { if (place[it.id] === it.bin) ok++; else notes.push({ ok: false, t: `${it.t} → ${binName(it.bin)}. ${it.why || ''}` }); });
      notes.unshift({ ok: ok === items.length, t: `${ok} of ${items.length} sorted correctly.${timedOut ? ' Time ran out; unplaced items count as wrong.' : ''}` });
      if (c.tip && c.tip[api.mode]) notes.push({ ok: true, t: c.tip[api.mode] });
      return { acc: ok / items.length, notes };
    }
    $('#verify', el).onclick = () => {
      if (api.over()) return;
      const n = Object.keys(place).length;
      if (n < items.length) { msg.textContent = `Sort everything first (${n}/${items.length}).`; return; }
      api.finish(evaluate(false));
    };
    render();
    return { timeout: () => api.finish(evaluate(true)) };
  };
  return g;
}

/* SEQUENCE: tap items in the right order */
function lis(a) { const t = []; a.forEach(x => { let lo = 0, hi = t.length; while (lo < hi) { const m = (lo + hi) >> 1; if (t[m] < x) lo = m + 1; else hi = m; } t[lo] = x; }); return t.length; }
function mkSeq(c) {
  const g = base(c, 'Checkpoint');
  g.engine = 'seq';
  g.time = c.time || { explorer: 45, engineer: 60 };
  g.mount = (el, api) => {
    const D = c.data[api.mode];
    const items = D.items.map((it, i) => ({ ...(typeof it === 'string' ? { t: it } : it), k: i }));
    const pool = shuffle(items); const order = [];
    el.innerHTML = `<div class="split"><section class="panel"><h3 class="lbl">${esc(D.poolLabel || 'Steps')}</h3><div class="parts" id="pool"></div><p class="hint" style="margin-top:12px">Tap the steps in order. Tap a step in your list to send it back.</p></section>
      <section class="panel"><h3 class="lbl">${esc(D.listLabel || 'Your order')}</h3><ol class="seq" id="ord"></ol>
      <div class="actions"><span class="msg" id="msg"></span><button class="btn primary" id="verify">Check order</button></div></section></div>`;
    const poolEl = $('#pool', el), ordEl = $('#ord', el), msg = $('#msg', el);
    function render() {
      poolEl.innerHTML = pool.filter(p => !order.includes(p)).map(p => `<span class="part" role="button" tabindex="0" data-k="${p.k}">${esc(p.t)}</span>`).join('') || '<span class="hint">All steps placed.</span>';
      ordEl.innerHTML = order.map(p => `<li><span class="part" role="button" tabindex="0" data-o="${p.k}">${esc(p.t)}</span></li>`).join('') || '<li class="hint" style="list-style:none">Nothing placed yet.</li>';
    }
    el.addEventListener('click', e => {
      if (api.over()) return;
      const a = e.target.closest('[data-k]'); if (a) { order.push(items[+a.dataset.k]); msg.textContent = ''; render(); return; }
      const b = e.target.closest('[data-o]'); if (b) { const i = order.findIndex(p => p.k === +b.dataset.o); order.splice(i, 1); render(); }
    });
    function evaluate(timedOut) {
      const seq = order.map(p => p.k);
      const score = lis(seq) / items.length;
      const notes = [{ ok: score === 1, t: `${lis(seq)} of ${items.length} steps in the right relative order.${timedOut ? ' Time ran out.' : ''}` }];
      if (score < 1) notes.push({ ok: false, t: 'Correct order: ' + items.map((p, i) => `${i + 1}. ${p.t}${p.d ? ` (${p.d})` : ''}`).join(' · ') });
      items.forEach((p, i) => { if (p.why && order[i] !== p) notes.push({ ok: false, t: `${p.t}: ${p.why}` }); });
      if (c.tip && c.tip[api.mode]) notes.push({ ok: true, t: c.tip[api.mode] });
      return { acc: score, notes: notes.slice(0, 8) };
    }
    $('#verify', el).onclick = () => {
      if (api.over()) return;
      if (order.length < items.length) { msg.textContent = `Place every step first (${order.length}/${items.length}).`; return; }
      api.finish(evaluate(false));
    };
    render();
    return { timeout: () => api.finish(evaluate(true)) };
  };
  return g;
}

/* ROUNDS: scenario + visual + multiple choice, with explanations */
function mkRounds(c) {
  const g = base(c, 'Checkpoint');
  g.engine = 'rounds';
  const n = m => Math.min(c.data[m].length, (c.n || {})[m] || 99);
  g.time = c.time || { explorer: n('explorer') * 11 + 8, engineer: n('engineer') * 15 + 10 };
  g.mount = (el, api) => {
    const all = c.data[api.mode];
    const R = (c.keepOrder ? all : shuffle(all)).slice(0, n(api.mode));
    let i = -1, hits = 0, lock = true, tmo = 0; const miss = [];
    el.innerHTML = `<section class="panel">${lbar('rd')}<div id="rd-b"></div><p class="feedback" id="rd-fb"></p></section>`;
    const fb = $('#rd-fb', el);
    function next() {
      i++; if (i >= R.length) return api.finish(evaluate());
      const r = R[i]; fb.textContent = ''; fb.className = 'feedback';
      $('#rd-k', el).textContent = `${c.roundWord || 'Question'} ${i + 1}/${R.length}`;
      $('#rd-s', el).textContent = `Correct ${hits}`;
      const opts = r.keep ? r.opts : shuffle(r.opts);
      $('#rd-b', el).innerHTML = `${r.vis ? `<div style="margin-top:12px">${r.vis}</div>` : ''}<p style="margin-top:12px;font-size:17px;max-width:70ch">${r.q}</p>
        <div class="${r.wide ? 'choice3 wide' : 'choice3'}" id="rd-o">${opts.map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      lock = false;
    }
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-o]'); if (!b || lock || api.over()) return;
      lock = true; const r = R[i], ok = b.dataset.o === r.ans;
      el.querySelectorAll('#rd-o button').forEach(x => { if (x.dataset.o === r.ans) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
      if (ok) hits++; else miss.push(r);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
      fb.textContent = (ok ? 'Correct. ' : `Answer: ${r.ans}. `) + r.why;
      tmo = setTimeout(() => { if (!api.over()) next(); }, ok ? 1500 : 2800);
    });
    function evaluate() {
      const answered = Math.max(0, lock ? i + 1 : i);
      R.slice(answered).forEach(r => miss.push(r));
      const notes = [{ ok: hits === R.length, t: `${hits} of ${R.length} correct.` }];
      miss.slice(0, 6).forEach(r => notes.push({ ok: false, t: `${r.short || r.ans}: ${r.why}` }));
      return { acc: hits / R.length, notes };
    }
    next();
    return { stop: () => clearTimeout(tmo), timeout: () => api.finish(evaluate()) };
  };
  return g;
}

/* TUNE: set controls, run a model, meet a requirement */
function mkTune(c) {
  const g = base(c, 'Mission');
  g.engine = 'tune';
  g.time = c.time || { explorer: 60, engineer: 75 };
  g.mount = (el, api) => {
    const R = c.data[api.mode];
    let i = -1, pts = 0, lock = true, tmo = 0, st = {}; const notes = [];
    el.innerHTML = `<div class="split" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)">
      <section class="panel stack-v">${lbar('tn')}<div id="tn-txt"></div><div id="tn-ctl" class="stack-v"></div>
        <div class="actions" style="margin-top:0"><span class="msg" id="msg"></span><button class="btn primary" id="tn-go">${esc(c.apply || 'Apply')}</button></div></section>
      <section class="panel stack-v"><div id="tn-vis"></div><div id="tn-live"></div><p class="feedback" id="tn-fb"></p></section></div>`;
    const fb = $('#tn-fb', el);
    const ctlHtml = k => {
      const id = 'tn-' + k.id;
      if (k.type === 'range') return `<div class="range"><label class="lbl" for="${id}">${k.label}</label><output class="v" id="${id}-v">${k.fmt ? k.fmt(k.val) : k.val}</output><input type="range" id="${id}" data-c="${k.id}" min="${k.min}" max="${k.max}" step="${k.step}" value="${k.val}"></div>`;
      return `<div class="field"><label for="${id}">${k.label}</label><select id="${id}" data-c="${k.id}">${k.opts.map(([v, t]) => `<option value="${v}" ${String(v) === String(k.val) ? 'selected' : ''}>${t}</option>`).join('')}</select></div>`;
    };
    function live() { const r = R[i]; if (r.live) $('#tn-live', el).innerHTML = r.live(st); if (r.draw) r.draw($('#tn-cv', el), st, false); }
    function next() {
      i++; if (i >= R.length) return api.finish(evaluate());
      const r = R[i]; st = {}; r.controls.forEach(k => st[k.id] = k.type === 'range' ? +k.val : k.val);
      fb.textContent = ''; fb.className = 'feedback';
      $('#tn-k', el).textContent = `${c.roundWord || 'Scenario'} ${i + 1}/${R.length}`;
      $('#tn-s', el).textContent = `Score ${Math.round(pts * 10) / 10}`;
      $('#tn-txt', el).innerHTML = `<p style="font-size:16px;font-weight:600">${r.title}</p><p class="hint" style="margin-top:4px;font-size:14px">${r.text}</p>`;
      $('#tn-ctl', el).innerHTML = r.controls.map(ctlHtml).join('');

    }
    el.addEventListener('input', e => {

      el.querySelectorAll('#tn-ctl input,#tn-ctl select').forEach(x => x.disabled = true);

      if (c.tip && c.tip[api.mode]) n.push({ ok: true, t: c.tip[api.mode] });

function pvI(V, G, T) { const Voc = 5.0 * (1 - 0.0035 * (T - 25)) + 0.04 * Math.log(Math.max(G, 0.05)); const Isc = 0.5 * G * (1 + 0.0006 * (T - 25)); const a = 0.27 * Voc / 5; return { I: Math.max(0, Isc * (1 - Math.exp((V - Voc) / a))), Voc, Isc }; }
function pvMpp(G, T) { let best = { P: 0, V: 0 }; const { Voc } = pvI(0, G, T); for (let V = 0; V <= Voc; V += 0.002) { const P = V * pvI(V, G, T).I; if (P > best.P) best = { P, V }; } return best; }
function pvDraw(E) {
  return (cv, st, done) => {
    if (!cv) return; const sc = st._sc; const { c, W, H } = canvas2d(cv);
    const pl = 36, pb = 20, pt = 10, pr = 10, VM = 6.2, IM = 0.55, PM = 2.4;
    const X = v => pl + v / VM * (W - pl - pr), Yi = i => pt + (1 - i / IM) * (H - pt - pb), Yp = p => pt + (1 - p / PM) * (H - pt - pb);
    c.strokeStyle = '#27345a'; c.fillStyle = '#8b96b6';
    for (let v = 0; v <= 6; v++) { c.beginPath(); c.moveTo(X(v), pt); c.lineTo(X(v), H - pb); c.stroke(); c.fillText(v + ' V', X(v) - 8, H - 6); }
    const { Voc } = pvI(0, sc.G, sc.T);
    if (!E || done) { c.strokeStyle = '#a880ff'; c.lineWidth = 2; c.beginPath(); for (let v = 0; v <= Voc; v += 0.02) { const y = Yi(pvI(v, sc.G, sc.T).I); v ? c.lineTo(X(v), y) : c.moveTo(X(v), y); } c.stroke(); c.fillStyle = '#a880ff'; c.fillText('current (I)', W - 80, pt + 10); }
    if (E || done) { c.strokeStyle = '#ffb547'; c.lineWidth = 2; c.beginPath(); for (let v = 0; v <= Voc; v += 0.02) { const y = Yp(v * pvI(v, sc.G, sc.T).I); v ? c.lineTo(X(v), y) : c.moveTo(X(v), y); } c.stroke(); c.fillStyle = '#ffb547'; c.fillText('power (P)', W - 80, pt + 24); }
    const op = pvI(st.v, sc.G, sc.T); c.fillStyle = '#e8ecf6'; c.beginPath(); c.arc(X(st.v), E ? Yp(st.v * op.I) : Yi(op.I), 5, 0, 7); c.fill();
    if (done) { const m = pvMpp(sc.G, sc.T); c.strokeStyle = '#3fd3ad'; c.setLineDash([4, 3]); c.beginPath(); c.moveTo(X(m.V), pt); c.lineTo(X(m.V), H - pb); c.stroke(); c.setLineDash([]); c.fillStyle = '#3fd3ad'; c.fillText('MPP', X(m.V) + 4, pt + 38); }
  };
}
function pvRound(E, title, text, G, T) {
  const sc = { G, T };
  return {
    title, text, controls: [{ id: 'v', type: 'range', label: 'Operating voltage', min: 0, max: 6.0, step: 0.01, val: 1.0, fmt: v => v.toFixed(2) + ' V' }],
    draw: (cv, st, done) => { st._sc = sc; pvDraw(E)(cv, st, done); },
    live: st => { const op = pvI(st.v, G, T); return E ? `<div class="readouts"><div class="ro"><span class="lbl">Power out</span><b>${(st.v * op.I).toFixed(2)} W</b></div></div>` : `<div class="readouts"><div class="ro"><span class="lbl">Voltage</span><b>${st.v.toFixed(2)} V</b></div><div class="ro"><span class="lbl">Current</span><b>${(op.I * 1000).toFixed(0)} mA</b></div></div>`; },
    check: st => { const m = pvMpp(G, T), P = st.v * pvI(st.v, G, T).I, r = P / m.P, need = E ? 0.97 : 0.98; const score = r >= need ? 1 : clamp((r - 0.6) / (need - 0.6), 0, 0.9) * 0.9; return { score, reveal: `<div class="readouts"><div class="ro"><span class="lbl">Your power</span><b>${P.toFixed(2)} W</b></div><div class="ro"><span class="lbl">Maximum</span><b>${m.P.toFixed(2)} W @ ${m.V.toFixed(2)} V</b></div><div class="ro"><span class="lbl">Efficiency</span><b>${(r * 100).toFixed(1)}%</b></div></div>`, msg: r >= need ? `On the maximum power point: ${(r * 100).toFixed(1)}% of the available ${m.P.toFixed(2)} W.` : `You extracted ${(r * 100).toFixed(0)}% of what the panel can give. The MPP here is ${m.V.toFixed(2)} V. ${T > 40 ? 'Hot panels have a lower voltage, so the MPP moves left.' : T < 0 ? 'Cold panels have a higher voltage, so the MPP moves right.' : 'Less light mostly lowers the current; the MPP voltage moves only a little.'}` }; }
  };
}

const wheel = {
  id: 'wheel', mod: 'adcs', kind: 'Mission', title: 'Reaction Wheel Rescue',
  covers: { adcs: ['6', '6.1', '7', '8'] },
  blurb: 'Disturbance torques keep spinning up the reaction wheel. Dump momentum with the magnetorquer before the wheel saturates.', fixed: true,
  lesson: { explorer: 'ADCS › 6.1 Examples of actuators · 7 Satellite motion', engineer: 'ADCS › 6.1 Examples of actuators · 7 Satellite motion · 8 The control process' },
  time: { explorer: 45, engineer: 60 },
  brief(m) {
    return m === 'explorer' ? {
      scenario: 'The satellite is pointing its camera with a reaction wheel. Air drag and other small pushes keep making the wheel spin faster. If it reaches its top speed, the satellite loses control.',
      goals: ['Hold Dump to use the magnetorquer to slow the wheel', 'Dumping works best when the field crosses the coil (watch the grip bar)', 'Finish with the wheel in the green zone (1,000–3,000 rpm)']
    } : {
      scenario: 'Momentum management for 60 s. Disturbance torque spins the wheel up. Command magnetorquer polarity to unload it. The torque available depends on the field component across the coil (B⊥).',
      goals: ['Dump with + when B⊥ is positive and − when it is negative; the wrong sign adds momentum', 'Never reach 6,000 rpm (saturation)', 'Never drop below 500 rpm (zero-crossing friction)', 'Finish between 1,000 and 3,000 rpm']
    };
  },
  mount(el, api) {
    const E = api.mode === 'explorer', dur = wheel.time[api.mode];
    const S = { rpm: 3600, beta: Math.random() * 360, s: 0, bat: 100, t: 0, sat: false, zero: false, maxR: 0, minR: 9999, good: 0, fire: 0 };
    const DIST = E ? 70 : 85, DUMP = E ? 260 : 300;
    el.innerHTML = `<div class="split"><section class="panel stack-v"><p class="lbl">Reaction wheel speed</p>
        <div class="rpm"><div class="rz" style="left:0;width:${500 / 6500 * 100}%;background:rgba(255,107,107,.25)"></div><div class="rz" style="left:${1000 / 6500 * 100}%;width:${2000 / 6500 * 100}%;background:rgba(63,211,173,.22)"></div><div class="rz" style="left:${6000 / 6500 * 100}%;right:0;background:rgba(255,107,107,.35)"></div><div class="mk" id="rw-mk"></div></div>
        <p class="hint mono">0 · green 1,000–3,000 · saturation 6,000 rpm</p>
        <div class="readouts" id="rw-ro"></div></section>
      <section class="panel stack-v"><div><p class="lbl">${E ? 'Coil grip' : 'Field across coil, B⊥'}</p><div class="gauge" style="margin-top:6px">${E ? '<div class="fill" id="rw-g" style="background:var(--amber)"></div>' : '<div class="fill" id="rw-g" style="background:var(--sig)"></div><div class="line" style="left:50%;background:var(--faint)"></div>'}</div></div>
        ${E ? '<button class="btn fire" id="rw-fire">Hold to dump momentum</button>' : `<div class="polarity" id="rw-pol">${[[-1, '− dipole'], [0, 'Off'], [1, '+ dipole']].map(([v, t]) => `<button data-s="${v}" aria-pressed="${v === 0}">${t}</button>`).join('')}</div><p class="hint">Keyboard: ← −, ↓ off, → +.</p>`}
        <p class="hint">${E ? 'Every second of dumping uses battery.' : 'Disturbance torque adds about 85 rpm/s. Firing costs 2 % battery per second.'}</p></section></div>`;
    if (E) {
      const f = $('#rw-fire', el);
      const on = e => { e.preventDefault(); if (!api.over()) { S.s = 1; f.classList.add('on'); } };
      const off = () => { S.s = 0; f.classList.remove('on'); };
      f.addEventListener('pointerdown', on); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => f.addEventListener(t, off));
      f.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') on(e); }); f.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') off(); });
      f.addEventListener('contextmenu', e => e.preventDefault());
    } else {
      $('#rw-pol', el).addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b || api.over()) return; S.s = +b.dataset.s; el.querySelectorAll('#rw-pol button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    }
    const onKey = e => { if (E || api.over()) return; const map = { ArrowLeft: -1, ArrowDown: 0, ArrowRight: 1 }; if (!(e.key in map)) return; e.preventDefault(); S.s = map[e.key]; el.querySelectorAll('#rw-pol button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.s === S.s)); };
    document.addEventListener('keydown', onKey);
    const DT = 0.05;
    function draw() {
      const b = Math.sin(S.beta * Math.PI / 180);
      $('#rw-mk', el).style.left = `calc(${clamp(S.rpm / 6500, 0, 1) * 100}% - 1px)`;
      const g = $('#rw-g', el);
      if (E) g.style.width = Math.abs(b) * 100 + '%'; else { g.style.left = (b >= 0 ? 50 : 50 + b * 50) + '%'; g.style.width = Math.abs(b) * 50 + '%'; }
      $('#rw-ro', el).innerHTML = `<div class="ro"><span class="lbl">Wheel</span><b style="color:${S.rpm > 5200 || S.rpm < 700 ? 'var(--crit)' : S.rpm >= 1000 && S.rpm <= 3000 ? 'var(--ok)' : 'var(--ink)'}">${S.rpm.toFixed(0)} rpm</b></div><div class="ro"><span class="lbl">Battery</span><b>${S.bat.toFixed(0)}%</b></div>${E ? '' : `<div class="ro"><span class="lbl">B⊥</span><b>${b >= 0 ? '+' : ''}${b.toFixed(2)}</b></div>`}<div class="ro"><span class="lbl">Time left</span><b>${Math.max(0, dur - S.t).toFixed(0)} s</b></div>`;
    }
    const iv = setInterval(() => {
      if (api.over()) return;
      S.t += DT; S.beta += 9 * DT;
      const b = Math.sin(S.beta * Math.PI / 180);
      let d = DIST;
      if (S.s !== 0 && S.bat > 0) {
        S.fire += DT; S.bat = Math.max(0, S.bat - 2 * DT);
        if (E) d -= DUMP * Math.abs(b); else { d -= S.s * DUMP * b; if (S.s === Math.sign(b)) S.good += DT; }
      }
      S.rpm = Math.max(0, S.rpm + d * DT);
      S.maxR = Math.max(S.maxR, S.rpm); S.minR = Math.min(S.minR, S.rpm);
      if (S.rpm >= 6000) { S.sat = true; draw(); return api.finish(evaluate()); }
      if (!E && S.rpm < 500) S.zero = true;
      draw();
      if (S.t >= dur) api.finish(evaluate());
    }, DT * 1000);
    function evaluate() {
      const notes = []; let acc = 0;
      notes.push({ ok: !S.sat, t: S.sat ? 'The wheel saturated at 6,000 rpm and could no longer absorb disturbance torque, so pointing was lost. Dump earlier, especially when the field crosses the coil.' : `No saturation. Peak speed ${S.maxR.toFixed(0)} rpm.` });
      if (!S.sat) acc += 0.5;
      const band = S.rpm >= 1000 && S.rpm <= 3000 && !S.sat;
      notes.push({ ok: band, t: band ? `Finished at ${S.rpm.toFixed(0)} rpm, inside the healthy band.` : `Finished at ${S.rpm.toFixed(0)} rpm. Aim for 1,000–3,000 rpm so the wheel has room to absorb torque in both directions.` });
      if (band) acc += E ? 0.3 : 0.2;
      if (!E) {
        const pol = S.fire ? S.good / S.fire : 0;
        acc += 0.1 * clamp((pol - 0.5) / 0.4, 0, 1) + (S.zero ? 0 : 0.1);
        notes.push({ ok: pol >= 0.8, t: `${Math.round(pol * 100)}% of dumping used the correct polarity.` });
        notes.push({ ok: !S.zero, t: S.zero ? `Wheel dropped to ${S.minR.toFixed(0)} rpm. Near zero, bearing friction makes the torque jerky and spoils pointing.` : 'Wheel never approached zero speed.' });
      }
      const eOk = S.bat >= 40; if (eOk) acc += E ? 0.2 : 0.1;
      notes.push({ ok: eOk, t: `Battery left ${S.bat.toFixed(0)}%. ${eOk ? '' : 'Dumping when the field runs along the coil wastes energy.'}` });
      return { acc: clamp(acc, 0, 1), notes, timeFactor: S.sat ? 0 : 1, passed: !S.sat };
    }
    draw();
    return { stop: () => { clearInterval(iv); document.removeEventListener('keydown', onKey); }, timeout: () => api.finish(evaluate()) };
  }
};

function linkEbN0(P, R, d, f, Gt, GT) { const fspl = 20 * Math.log10(d) + 20 * Math.log10(f) + 32.44; return { fspl, eb: 10 * Math.log10(P) + Gt - 6 - fspl + GT + 228.6 - 10 * Math.log10(R * 1000) }; }

function sigRound(E, title, text, d, f, budget, opts = {}) {

  let best = 0; pw.filter(p => p <= budget).forEach(P => RATES2.forEach(R => ants.forEach(([g]) => gts.forEach(([t]) => { if (linkEbN0(P, R, d, f, g, t).eb - 9.6 >= 3) best = Math.max(best, R); }))));
  const controls = [{ id: 'P', type: 'select', label: 'Transmit power', val: '0.5', opts: pw.map(p => [p, p + ' W']) }, { id: 'R', type: 'select', label: 'Data rate', val: '1.2', opts: RATES2.map(r => [r, r + ' kbps']) }];

  const get = st => ({ P: +st.P, R: +st.R, G: +(st.G || 2), T: +(st.T || -15) });
  return {

    live: st => { const s = get(st), L = linkEbN0(s.P, s.R, d, f, s.G, s.T), m = L.eb - 9.6; if (E) { const w = clamp((m + 10) / 30, 0, 1) * 100; return `<p class="lbl">Signal strength vs noise</p><div class="gauge" style="margin-top:6px;height:30px"><div class="fill" style="width:${w}%;background:${m >= 3 ? 'var(--ok)' : 'var(--crit)'}"></div><div class="line" style="left:${13 / 30 * 100}%"></div></div><p class="hint mono" style="margin-top:4px">Red line = minimum for a clean link</p><div class="readouts" style="margin-top:10px"><div class="ro"><span class="lbl">Link</span><b style="color:${m >= 3 ? 'var(--ok)' : 'var(--crit)'}">${m >= 3 ? 'Clear' : 'Too noisy'}</b></div><div class="ro"><span class="lbl">Power</span><b style="color:${s.P > budget ? 'var(--crit)' : 'var(--ink)'}">${s.P} W</b></div></div>`; }
      return `<p class="lbl">Link budget</p>` + sheet([['Transmit power', (10 * Math.log10(s.P)).toFixed(1) + ' dBW'], ['Satellite antenna gain', '+' + s.G + ' dBi'], ['Losses (cable, pointing, atmosphere, polarisation)', '−6.0 dB'], [`Free-space loss, ${d} km at ${f} MHz`, '−' + L.fspl.toFixed(1) + ' dB'], ['Ground G/T', s.T + ' dB/K'], ['−k (Boltzmann)', '+228.6 dBW/K/Hz'], [`−10 log₁₀(R), R = ${s.R} kbps`, '−' + (10 * Math.log10(s.R * 1000)).toFixed(1) + ' dB'], ['Required Eb/N0 (BPSK, BER 10⁻⁵)', '9.6 dB'], ['Margin', '<b>apply to compute</b>']]); },

      side.innerHTML = `${lbar('e3')}<div><p class="lbl">Attitude mode</p><div class="choice3" id="e3-mode"><button data-md="sun" aria-pressed="true">Sun-pointing<small>panel faces the Sun</small></button><button data-md="nadir" aria-pressed="false">Earth-pointing<small>${E ? 'camera faces Earth' : 'camera and patch antenna face Earth'}</small></button></div></div>

        <div><p class="lbl">Battery</p><div class="gauge" style="margin-top:6px"><div class="fill" id="e3-bat"></div><div class="line" style="left:30%"></div></div></div>
        <div class="readouts" id="e3-ro"></div><ul class="objs" id="e3-obj"></ul>`;
      side.addEventListener('click', e => {
        if (api.over()) return;

        $('#e3-ro', side).innerHTML = `<div class="ro"><span class="lbl">Solar in</span><b>${solar.toFixed(1)} W</b></div><div class="ro"><span class="lbl">Demand</span><b>${demand} W</b></div><div class="ro"><span class="lbl">Charge</span><b>${(soc * 100).toFixed(0)}%</b></div>${E ? '' : `<div class="ro"><span class="lbl">Batt temp</span><b style="color:${S.temp < 2 ? 'var(--crit)' : 'var(--ink)'}">${S.temp.toFixed(1)} °C</b></div>`}`;

      }
      return { stop: () => v.stop(), timeout: () => { if (!done) { done = true; api.finish(evaluate()); } } };

  }
};

   CURRICULUM MAP (from the Elements folder)
   ===================================================================== */
const MODS = [
  { id: 'intro', no: '1', name: 'Introduction', lessons: ['1 Intro', '2 What is a satellite', '3 Types of satellites', '4 Orbits', '5 Components', '6 Satellite stories', '7 Process of building a satellite', '8 Environmental testing of the satellite', '9 Challenges and future'] },
  { id: 'cdhs', no: '2', name: 'CDHS', lessons: ['1 CDHS and its examples', '2 CDHS components', '3 Types of memory', '4 CDHS in SatKit', '5 MCU-MPU-FPGA-GPU', '6 Communication interfaces', '6.1 CAN bus', '6.2 UART', '6.3 I2C', '6.4 SPI', '7 CDHS in small and large sats', '8 Redundancy in CDHS', '9 CDHS and subsystems', '10 How CDHS works', '11 Real-world examples', '12 Types of data handled by CDHS', '13 Challenges of CDHS'] },
  { id: 'sw', no: '2.1', name: 'CDHS Software', lessons: ['1 Intro to software', '2 Binary to hex', '3 Binary to decimal', '4 Intro to programming', '5 Loops', '6 Float and print', '7 Addresses', '8 Functions', '9 IF statements', '10 Baud rate', '11 Calc delays', '12 Read and write', '13 Conclusion'] },
  { id: 'eps', no: '3', name: 'EPS', lessons: ['1 Intro to EPS', '2 AC-DC', '3 Power on CubeSat & MPPT', '4 Types of batteries', '5 How lithium-ion batteries work', '6 Converters and boost'] },
  { id: 'adcs', no: '4', name: 'ADCS', lessons: ['1 Intro to ADCS', '2 Types of control of ADCS', '3 Subsystems overview', '4 Operational modes', '5 ADCS sensors', '5.1 Types of data by ADCS sensors', '6 ADCS actuators', '6.1 Examples of actuators', '7 Satellite motion', '8 The control process of spacecraft', '9 Types of attitude control', '10 TLE'] },
  { id: 'comms', no: '5', name: 'Communication System', lessons: ['1 What is a communication system', '2 Why it is important', '3 Uses in space', '4 Communication bands', '5 What are radio waves', '6 What does antenna mean', '7 Types of antennas', '8 Major characteristics of antennas', '9 TX-RX', '10 Important considerations', '11 Communication challenges', '12 Signal processing and software'] },
  { id: 'mech', no: '6', name: 'Mechanical', lessons: ['1 CubeSats and materials', '2 Structural analysis', '3 Mass budget', '4 CubeSat configuration', '5 Center of gravity', '6 CAD tools', '7 Deployment mechanism', '8 Thermal control', '10 Internal heat generation', '11 External heat sources', '12 Heat sinks and insulation', '13 Passive thermal control', '14 Active thermal control'] },
  { id: 'env', no: '7', name: 'Environmental Testing', lessons: ['1 Intro to environmental testing', '2 Testing and analysis requirements', '3 Vibration testing', '3.1 Vibration examples', '3.2 Apollo 12', '4 Acoustic testing', '5 Shock testing', '6 Thermal vacuum testing', '6.1 TVT in detail', '7 Types of thermal testing', '8 HST thermal challenges', '9 Radiation testing', '10 EMC testing'] },
  { id: 'ops', no: '8', name: 'Launch & Operations', lessons: ['1 Why start with mission concept', '2 Mission objectives', '3 Preliminary orbit selection', '4 Orbit decision matrix', '5 ConOps', '6 Launch and operations overview', '7 Launch brokers and integrators', '7.1 Identifying and booking a ride', '8 Licensing and regulations', '9 Do-no-harm rules', '10 Satellite deployment', '11 Rail-type dispensers', '12 Tab-type dispensers', '13 Separation system', '14 SpaceX rideshare', '14.1 Mounting on SpaceX rockets', '15 OTV / OMV', '16 Phase 1 · Pre-launch', '17 Phase 2 · LEOP', '18 Phase 3–4 · Commissioning and operations', '19 Phase 5 · End of life', '20–26 Checkout process'] }
];
const PLANNED = {};

/* =====================================================================
   SHELL
   ===================================================================== */
const GAMES = [orbitArch, orbit3d, junk, buildOrder, stories, brain, memMatch, procPick, redundancy, triage, binary, codefix, serialDet, funcBuild, eclipse, eclipse3d, conv, solarOpt, battDoc, acdc, detumble, detumble3d, sensDet, sensors3d, pointIt, wheel, passive, tlePass, tle3d, downlink, groundpass3d, bands, antMatch, antenna3d, sigNoise, assembly, assembly3d, massBudget, thermal, thermal3d, deployIt, deploy3d, tvac, vibSurv, vibration3d, testPick, firstContact, rideshare, rideshare3d, matrix, noHarm];
const bestKey = (g, m) => `best:${g.id}:${m}`;

let TAB = store.get('tab') || 'all';
const passedG = g => ['explorer', 'engineer'].some(m => (store.get(bestKey(g, m)) || {}).pass);
const modOf = id => MODS.find(m => m.id === id);
function card(g) {
  const b = store.get(bestKey(g, MODE)); const m = modOf(g.mod);
  return `<button class="card" data-g="${g.id}">
    <div class="card-top"><span class="tag">${m.no} · ${m.name}</span><span class="prio">${g.three ? '<span class="tag3d">3D</span> ' : ''}${g.kind}</span></div>
    <h2>${g.title}</h2><p>${g.blurb}</p>
    <p class="lsn">${g.lesson[MODE]}</p>
    <div class="card-foot"><span>${g.time[MODE]} s · ${MODE === 'explorer' ? 'Explorer' : 'Engineer'}</span><span class="best ${b && b.pass ? 'pass' : ''}">${b ? `Best <b>${b.score}</b>/100` : 'Not played'}</span></div>
  </button>`;
}
function hub() {
  stopRun();
  const online = MODS.filter(m => GAMES.some(g => g.mod === m.id && passedG(g)));
  const cur = TAB === 'all' ? null : modOf(TAB);
  const touches = (g, id) => g.mod === id || (g.covers && g.covers[id]);
  const games = cur ? GAMES.filter(g => touches(g, cur.id)).sort((a, b) => (a.mod === cur.id ? 0 : 1) - (b.mod === cur.id ? 0 : 1)) : GAMES;
  const covered = cur ? new Set(GAMES.flatMap(g => (g.covers && g.covers[cur.id]) || [])) : null;
  const tabs = `<div class="tabs" role="tablist" aria-label="Curriculum modules">
    <button class="tab" role="tab" data-tab="all" aria-selected="${!cur}"><b>ALL</b><span>Playable games</span><small>${GAMES.length} games</small></button>
    ${MODS.map(m => { const n = GAMES.filter(g => touches(g, m.id)).length, pl = (PLANNED[m.id] || []).length;
      return `<button class="tab ${online.includes(m) ? 'lit' : ''}" role="tab" data-tab="${m.id}" aria-selected="${cur === m}"><b>MODULE ${m.no}</b><span>${m.name}</span><small>${n} game${n === 1 ? '' : 's'}</small></button>`; }).join('')}</div>`;
  const head = cur ? `<div class="modhead"><h2>${cur.no} · ${cur.name}</h2><span class="hint mono">${covered.size}/${cur.lessons.length} lessons practised in a game</span></div>
    <div class="lesson-list">${cur.lessons.map(l => { const id = l.split(' ')[0]; return `<span class="${covered.has(id) ? 'hit' : ''}">${esc(l)}</span>`; }).join('')}</div>` : '';
  const planned = cur ? (PLANNED[cur.id] || []) : [];
  app.innerHTML = `<header class="hero">
      <p class="lbl">SpacePoint · SatKit learning platform</p>
      <h1>Mission <span>Arcade</span></h1>
      <p class="sub">Short engineering challenges tied to the lessons of each SatKit module. Checkpoint games test one idea after a lesson group; missions combine several at the end of a module.</p>
      <div class="controls">
        <div class="seg" role="group" aria-label="Difficulty">
          <button data-mode="explorer" aria-pressed="${MODE === 'explorer'}"><span class="dot"></span>Explorer · middle school</button>
          <button data-mode="engineer" aria-pressed="${MODE === 'engineer'}"><span class="dot"></span>Engineer · university</button>
        </div>
        <label class="toggle"><input type="checkbox" id="untimed" ${UNTIMED ? 'checked' : ''}> Untimed practice (no clock pressure, time scored in full)</label>
      </div>
      <div class="build"><p class="lbl">SatKit-1 virtual build · ${online.length}/${MODS.length} modules online</p>
        <div class="build-row">${MODS.map(m => `<span class="sys ${online.includes(m) ? 'on' : ''}"><i></i>${m.name}</span>`).join('')}</div></div>
    </header>
    ${tabs}${head}
    ${games.length ? `<div class="cards">${games.map(card).join('')}</div>` : '<p class="hint">No playable game for this module yet. The planned games are below.</p>'}
    ${planned.length ? `<p class="lbl sechead">Planned for this module</p><div class="cards">${planned.map(([t, l, d]) => `<div class="card planned"><div class="card-top"><span class="tag">${cur.no} · ${cur.name}</span><span class="prio" style="color:var(--faint)">Planned</span></div><h2>${t}</h2><p>${d}</p><p class="lsn">Lessons ${l}</p><div class="card-foot"><span>Not built yet</span></div></div>`).join('')}</div>` : ''}
    <p class="foot-note">Prototype for the SatKit LMS. Lesson numbers follow the video files in the Elements curriculum folder. Power, link and thermal numbers are simplified training values, not SatKit hardware specifications. Best scores are kept in this browser only.</p>`;
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { MODE = b.dataset.mode; store.set('mode', MODE); hub(); });
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; store.set('tab', TAB); hub(); const t = app.querySelector(`[data-tab="${TAB}"]`); t && t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); t && t.focus(); });
  $('#untimed').onchange = e => { UNTIMED = e.target.checked; store.set('untimed', UNTIMED); };
  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => brief(GAMES.find(g => g.id === b.dataset.g)));
}

function bar(g, extra = '') {
  return `<div class="stagebar"><button class="btn sm" id="back">‹ Arcade</button><h2>${g.title}</h2>
    <span class="tag">${modOf(g.mod).name} · ${MODE === 'explorer' ? 'Explorer' : 'Engineer'}</span>${extra}</div>`;
}

function brief(g) {
  stopRun();
  if (g.three) loadThree().catch(() => {});
  const b = g.brief(MODE), hw = howTo(g, MODE);
  app.innerHTML = bar(g) + `<div class="brief">
    <section class="panel stack-v"><p class="lbl">Mission brief</p><p class="scenario">${b.scenario}</p>
      <div class="meta"><span class="tag">${g.time[MODE]} s ${g.fixed ? 'simulation' : UNTIMED ? '· untimed' : 'limit'}</span><span class="tag">${g.lesson[MODE]}</span></div>
      <div><button class="btn primary" id="go">Start mission</button></div></section>
    <section class="panel"><p class="lbl">Objectives</p><ol style="margin-top:10px">${b.goals.map(x => `<li>${x}</li>`).join('')}</ol></section>
    <section class="panel how" style="grid-column:1/-1"><h3 class="howtitle">How to play</h3><div class="howgrid">
      <div><p class="lbl">Controls</p><ol>${hw.controls.map(x => `<li>${x}</li>`).join('')}</ol></div>
      <div><p class="lbl">What to watch</p><ul>${hw.watch.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div><p class="lbl">Scoring</p><ul>${hw.scoring.map(x => `<li>${x}</li>`).join('')}</ul></div></div></section></div>`;
  $('#back').onclick = hub; $('#go').onclick = () => start(g);
  window.scrollTo(0, 0);
}

function stopRun() {
  if (!run) return;
  clearInterval(run.iv); run.ended = true; run.ctl && run.ctl.stop && run.ctl.stop(); run = null;
}

function start(g) {
  stopRun();
  const key = g.id + ':' + MODE;
  attempts[key] = (attempts[key] || 0) + 1;
  const limit = g.time[MODE];
  const timed = !UNTIMED || g.fixed;
  app.innerHTML = bar(g, `<div class="clock" id="clock"><span class="lbl">${g.fixed ? 'Sim' : 'T−'}</span><b id="clk">${limit.toFixed(1)}</b></div>`) + `<div id="play"></div>`;
  $('#back').onclick = hub;
  if (UNTIMED && !g.fixed) $('#clock').innerHTML = '<span class="lbl">Untimed</span><b id="clk">0.0</b>';
  const r = run = { g, limit, t0: performance.now(), ended: false, mistakes: 0, attempt: attempts[key], timed };
  const api = {
    mode: MODE,
    over: () => r.ended,
    mistake: () => { r.mistakes++; },
    mistakes: () => r.mistakes,
    finish: res => finish(r, res)
  };
  r.ctl = g.mount($('#play'), api) || {};
  r.iv = setInterval(() => {
    if (r.ended) return;
    const el = (performance.now() - r.t0) / 1000;
    const clk = $('#clk'); if (!clk) return;
    if (UNTIMED && !g.fixed) { clk.textContent = el.toFixed(1); return; }
    const left = Math.max(0, limit - el);
    clk.textContent = g.fixed ? `${Math.min(el, limit).toFixed(1)}/${limit}` : left.toFixed(1);
    $('#clock').classList.toggle('low', !g.fixed && left < 10);
    if (el >= limit + (g.fixed ? 0.6 : 0)) r.ctl.timeout && r.ctl.timeout();
  }, 100);
  window.scrollTo(0, 0);
}

function finish(r, res) {
  if (r.ended) return;
  r.ended = true; clearInterval(r.iv); r.ctl && r.ctl.stop && r.ctl.stop();
  const g = r.g;
  const el = Math.min((performance.now() - r.t0) / 1000, r.limit);
  const acc = clamp(res.acc, 0, 1);
  const timeF = res.timeFactor != null ? res.timeFactor : (UNTIMED ? 1 : clamp((r.limit - el) / (0.4 * r.limit), 0, 1));
  const first = r.attempt === 1 ? 1 : 0;
  const pen = Math.min(20, 5 * (r.attempt - 1));
  const score = Math.max(0, Math.round(70 * acc + 20 * timeF + 10 * first - pen));
  const pass = acc >= 0.7 && res.passed !== false;
  const k = bestKey(g, MODE); const prev = store.get(k);
  if (!prev || score > prev.score || (pass && !prev.pass)) store.set(k, { score: Math.max(score, prev ? prev.score : 0), pass: pass || !!(prev && prev.pass) });
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'SPMA_GAME_FINISHED',
        gameKey: g.id,
        mode: MODE,
        score,
        passed: pass,
        accuracy: Math.round(acc * 100),
        elapsedSeconds: Math.round(el),
        attemptNo: r.attempt,
        notes: res.notes || [],
      }, window.location.origin);
    }
  } catch (e) {}
  const play = $('#play'); if (!play) return;
  const next = GAMES[(GAMES.indexOf(g) + 1) % GAMES.length];
  const wrong = res.notes.filter(n => !n.ok).length;
  play.insertAdjacentHTML('afterbegin', `<section class="panel result" style="margin-bottom:16px;border-color:${pass ? 'rgba(63,211,173,.45)' : 'rgba(255,107,107,.45)'}">
    <div><p class="lbl">Mission score</p><p class="score mono">${score}<small>/100</small></p><span class="verdict ${pass ? 'pass' : 'fail'}">${pass ? 'Mission passed' : 'Mission failed'}</span>
      <div class="stats"><div class="ro"><span class="lbl">Accuracy</span><b>${Math.round(acc * 100)}%</b></div><div class="ro"><span class="lbl">Time</span><b>${el.toFixed(0)} s</b></div><div class="ro"><span class="lbl">Attempt</span><b>${r.attempt}</b></div></div>
      <p class="formula">70% accuracy + 20% time + 10% first-try bonus − 5 per retry${g.fixed ? ' · fixed-length sim: full time credit if the spacecraft survives' : ''}</p>
      <div class="actions" style="justify-content:flex-start"><button class="btn primary" id="retry">Retry</button><button class="btn" id="nxt">Next: ${next.title}</button><button class="btn" id="home">Arcade</button></div></div>
    <div><p class="lbl">Debrief</p><ul class="notes">${res.notes.map(n => `<li class="${n.ok ? 'ok' : ''}">${n.t}</li>`).join('')}</ul>
      ${wrong ? `<p class="review">Review in the LMS: <b>${g.lesson[MODE]}</b></p>` : ''}</div></section>`);
  play.querySelectorAll('button,select,input,[role=button]').forEach(x => { if (!x.closest('.result')) { x.disabled = true; x.tabIndex = -1; } });
  $('#retry').onclick = () => start(g); $('#nxt').onclick = () => brief(next); $('#home').onclick = hub;
  $('#retry').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('unhandledrejection', e => {
  const msg = (e.reason && (e.reason.message || e.reason)) || '';
  if (typeof msg === 'string' && msg.includes('message channel closed')) {
    e.preventDefault();
  }
});

const params = new URLSearchParams(window.location.search);
const lockedGameKey = params.get('game');
const lockedMode = params.get('mode');
const isLockedSingle = params.get('locked') === '1';

if (lockedMode === 'explorer' || lockedMode === 'engineer') {
  MODE = lockedMode;
  store.set('mode', MODE);
}

if (isLockedSingle) {
  const style = document.createElement('style');
  style.textContent = '#back, #nxt, #home { display: none !important; }';
  document.head.appendChild(style);
}

// Allow parent React page to hydrate DB best scores into localStorage
window.addEventListener('message', e => {
  if (e.origin !== window.location.origin || !e.data) return;
  if (e.data.type === 'SPMA_HYDRATE_SCORES' && Array.isArray(e.data.games)) {
    e.data.games.forEach(g => {
      if (g.explorer && g.explorer.attempts_count > 0) {
        store.set('best:' + (g.game_key || g.id) + ':explorer', { score: g.explorer.best_score, pass: g.explorer.passed });
      }
      if (g.engineer && g.engineer.attempts_count > 0) {
        store.set('best:' + (g.game_key || g.id) + ':engineer', { score: g.engineer.best_score, pass: g.engineer.passed });
      }
    });
    if (!lockedGameKey && !run) hub();
  }
});

const initialGame = lockedGameKey ? GAMES.find(g => g.id === lockedGameKey) : null;
if (initialGame) {
  brief(initialGame);
} else {
  hub();
}
})();
</script>

</body></html>
