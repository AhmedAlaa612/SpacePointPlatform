<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px "Inter",sans-serif;background:#05030a;color:#f8fafc}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SpacePoint Mission Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* SpacePoint LMS Styled Arcade Simulator Surface */
:root{
  --void:#05030a; --panel:#1a0f26; --panel2:#231534; --line:#2e1b48; --line2:#3d2460;
  --ink:#f8fafc; --dim:#a79fb8; --faint:#6b5d82;
  --amber:#a880ff; --amber-ink:#0e071a;
  --ok:#34d399; --warn:#f59e0b; --crit:#ef4444; --sig:#c7aaff; --sun:#fbbf24;
  --display:'Outfit',system-ui,-apple-system,sans-serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--void);color:var(--ink);font:15px/1.5 var(--sans);min-height:100%;
  background-image:radial-gradient(circle at 15% 50%, rgba(168,128,255,0.06) 0%, transparent 50%), radial-gradient(circle at 85% 30%, rgba(26,15,38,0.5) 0%, transparent 50%);
}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.lbl{font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{color:var(--dim);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;font-size:14px;transition:all .15s}
.btn:hover{border-color:var(--sig);background:#2f1d47}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.primary:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.panel{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:18px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:3px;background:var(--panel)}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button[aria-pressed="true"] .dot{background:var(--amber)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--dim)}
.toggle input{accent-color:var(--amber);width:16px;height:16px}

/* HUB */
.hero{display:grid;gap:22px;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero h1{font:800 clamp(52px,11vw,112px)/.86 var(--display);letter-spacing:.01em;text-transform:uppercase}
.hero h1 span{color:var(--amber)}
.hero .sub{max-width:62ch;color:var(--dim);font-size:16px}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.build{display:grid;gap:10px}
.build-row{display:flex;flex-wrap:wrap;gap:8px}
.sys{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px dashed var(--line2);border-radius:999px;font:500 12px var(--mono);color:var(--faint)}
.sys i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.sys.on{border-style:solid;border-color:rgba(63,211,173,.5);color:var(--ink)}
.sys.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:18px;border-radius:10px;background:var(--panel);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--amber);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--panel2);color:var(--sig)}
.prio{font:600 11px var(--mono);color:var(--amber)}
.card h2{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.card p{color:var(--dim);font-size:14px}
.card-foot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--line);font:500 12px var(--mono);color:var(--dim)}
.best b{color:var(--ink)}
.best.pass b{color:var(--ok)}
.foot-note{margin-top:28px;color:var(--faint);font-size:12px;max-width:80ch}

/* STAGE */
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.stagebar h2{font:800 clamp(28px,5vw,40px)/1 var(--display);text-transform:uppercase;flex:1 1 260px;min-width:0}
.clock{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.clock b{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.clock.low b{color:var(--crit)}
.brief{display:grid;gap:18px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.brief .scenario{font-size:18px;line-height:1.5;max-width:56ch}
.brief ol{margin:0;padding-left:20px;display:grid;gap:6px}
.brief .meta{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:760px){.brief{grid-template-columns:1fr}}
.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.stack-v{display:grid;gap:14px;align-content:start}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:14px}
.msg{min-height:20px;font-size:13px;color:var(--warn)}
.msg.ok{color:var(--ok)}

/* parts + sockets */
.parts{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin-top:10px}
.part{display:inline-flex;flex-direction:column;gap:1px;padding:8px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;font-size:14px;user-select:none;-webkit-user-select:none}
.part small{font:400 11px var(--mono);color:var(--dim)}
.part:hover{border-color:var(--sig)}
.part.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,181,71,.35);background:#2a2412}
.sockets{display:grid;gap:10px;margin-top:10px}
.socket{display:grid;gap:6px;padding:12px;border-radius:8px;border:1px dashed var(--line2);background:rgba(18,9,33,.5);cursor:pointer}
.socket.armed:hover,.socket.armed{border-color:var(--amber)}
.socket-k{font:600 12px var(--mono);letter-spacing:.08em;color:var(--sig);text-transform:uppercase}
.socket-d{font-size:13px;color:var(--dim)}
.socket-in{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;align-items:center}
.socket-in em{color:var(--faint);font-size:12px;font-style:normal;font-family:var(--mono)}
.chipboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.esp{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--panel2) 0 6px,var(--panel) 6px 12px);border:1px solid var(--line2);font:600 14px var(--mono);color:var(--ink);margin-top:10px}
.esp i{width:28px;height:28px;border-radius:4px;background:#160c26;border:1px solid var(--line2)}
.cfg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--dim)}
select,.num{font:500 14px var(--mono);color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;min-height:38px;padding:0 10px}

/* eclipse */
.orbit{position:relative;height:30px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line2)}
.orbit .seg-sun{background:linear-gradient(180deg,#3d3417,#2a2410)}
.orbit .seg-ecl{background:#0c0617}
.orbit .pass{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(168,128,255,.28) 0 6px,transparent 6px 12px);border-inline:1px solid var(--sig)}
.orbit .cursor{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.orbit-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font:500 12px var(--mono);color:var(--dim)}
.orbit-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.phase{font:800 34px/1 var(--display);text-transform:uppercase}
.phase.sun{color:var(--sun)} .phase.ecl{color:var(--sig)}
.gauge{height:22px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);position:relative;overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--ok);transition:width .1s linear}
.gauge .line{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--crit)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px}
.ro{padding:10px;border:1px solid var(--line);border-radius:8px;background:rgba(18,9,33,.5)}
.ro b{display:block;font:600 22px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.loads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.load{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer}
.load .nm{font-weight:600}
.load .w{font:500 12px var(--mono);color:var(--dim)}
.load .sw{grid-row:span 2;width:44px;height:24px;border-radius:12px;background:var(--line2);position:relative;transition:background .15s}
.load .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s}
.load[aria-pressed="true"]{border-color:rgba(63,211,173,.55)}
.load[aria-pressed="true"] .sw{background:var(--ok)}
.load[aria-pressed="true"] .sw::after{transform:translateX(20px)}
.load:disabled{cursor:not-allowed;opacity:.8}
.objs{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:13px}
.objs li{display:flex;gap:8px;align-items:baseline}
.objs li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--faint)}
.objs li.ok::before{background:var(--ok)} .objs li.bad::before{background:var(--crit)} .objs li.live::before{background:var(--warn)}

/* assembly */
.cube{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;gap:6px;margin-top:10px}
.cube .slot{display:grid;gap:4px;align-content:center;justify-items:center;text-align:center;min-height:56px;padding:8px;border-radius:6px;border:1px dashed var(--line2);background:rgba(18,9,33,.55);cursor:pointer}
.cube .slot.armed{border-color:var(--amber)}
.cube .slot .k{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--sig)}
.cube .slot.fixed{cursor:default;border-style:solid;border-color:var(--line);color:var(--dim)}
.cube .side{grid-row:2 / span 5;writing-mode:vertical-rl}
.cube .face{grid-column:2}
.cube .face .part,.cube .lvl .part{font-size:13px}
.cogbar{position:relative;height:16px;border-radius:4px;background:var(--panel2);border:1px solid var(--line2);margin-top:6px}
.cogbar .zone{position:absolute;top:0;bottom:0;background:rgba(63,211,173,.18);border-inline:1px solid var(--ok)}
.cogbar .mk{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--amber);transition:left .2s}

/* downlink */
.sky{width:100%;height:auto;display:block;max-width:100%}
.queue{display:grid;gap:8px;margin-top:10px}
.pk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2)}
.pk .nm{font-weight:600;font-size:14px;min-width:0}
.pk .nm small{display:block;font:400 11px var(--mono);color:var(--dim)}
.pk .ctl{display:flex;gap:4px}
.pk .ctl button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);cursor:pointer}
.pk .bar{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
.pk .bar i{display:block;height:100%;width:0;background:var(--sig)}
.pk.done{border-color:rgba(63,211,173,.5)} .pk.done .bar i{background:var(--ok)}
.pk.sending{border-color:var(--sig)}
.pk.crit .nm::after{content:"critical";margin-left:8px;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--crit)}
.rates{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rates button{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font:500 13px var(--mono)}
.rates button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}

/* tvac */
.chamber{position:relative;height:150px;border-radius:12px;border:2px solid var(--line2);background:radial-gradient(circle at 50% 50%,#1f1233,#10081d);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:10px}
.chamber .sat{width:56px;height:56px;border-radius:4px;background:linear-gradient(135deg,#341b57,#1e0f33);border:2px solid var(--sig);display:none;box-shadow:0 0 14px rgba(168,128,255,.35)}
.chamber.loaded .sat{display:block}
.chamber .door{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(0deg,#2b1747 0 8px,#1c0d30 8px 16px);border-right:3px solid var(--amber);transition:width .5s}
.chamber.closed .door{width:100%}
.chamber .door span{position:absolute;inset:auto 0 10px 0;text-align:center;font:600 11px var(--mono);letter-spacing:.12em;color:var(--dim);opacity:0}
.chamber.closed .door span{opacity:1}
.proc{display:grid;gap:8px;margin-top:10px}
.proc button{justify-content:flex-start;text-align:left}
.proc button.done{border-color:rgba(63,211,173,.55);color:var(--ok)}
.spec{border:1px solid var(--line2);border-left:3px solid var(--sig);border-radius:6px;padding:10px 12px;font-size:13px;background:rgba(18,9,33,.5)}
.spec table{border-collapse:collapse;width:100%;font:500 12px var(--mono)}
.spec td{padding:3px 4px;border-bottom:1px solid var(--line)}
.range{display:grid;gap:4px}
.range input{width:100%;accent-color:var(--amber)}
.range .v{font:600 22px var(--mono)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font:600 16px var(--mono)}
.stepper output{min-width:72px;text-align:center;font:600 20px var(--mono)}
canvas.chart{width:100%;height:190px;display:block;border-radius:8px;background:rgba(18,9,33,.6);border:1px solid var(--line)}

/* result */
.result{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
@media (max-width:760px){.result{grid-template-columns:1fr}}
.score{font:800 clamp(72px,14vw,120px)/.9 var(--display)}
.score small{font-size:.35em;color:var(--dim)}
.verdict{display:inline-block;margin-top:10px;font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:4px}
.verdict.pass{background:rgba(63,211,173,.15);color:var(--ok)}
.verdict.fail{background:rgba(255,107,107,.15);color:var(--crit)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.formula{margin-top:12px;font:400 12px var(--mono);color:var(--dim)}
.notes{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.notes li{padding:10px 12px;border-radius:6px;background:var(--panel2);border-left:3px solid var(--crit);font-size:14px}
.notes li.ok{border-left-color:var(--ok)}
.review{margin-top:12px;font-size:13px;color:var(--dim)}
.review b{color:var(--sig);font-weight:600}
/* module tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;scrollbar-width:thin}
.tab{flex:none;display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-width:118px}
.tab b{font:600 11px var(--mono);color:var(--sig)}
.tab span{font-weight:600;font-size:13px;white-space:nowrap}
.tab small{font:500 11px var(--mono);color:var(--dim)}
.tab[aria-selected="true"]{border-color:var(--amber);background:var(--panel2)}
.tab.lit b{color:var(--ok)}
.modhead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.modhead h2{font:800 clamp(30px,6vw,42px)/1 var(--display);text-transform:uppercase}
.lesson-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.lesson-list span{font:500 12px var(--mono);padding:4px 8px;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--faint)}
.lesson-list span.hit{color:var(--ink);border-color:rgba(168,128,255,.55)}
.sechead{margin:24px 0 10px}
.card{grid-template-rows:auto auto 1fr auto auto}
.card .lsn{font:500 11px/1.5 var(--mono);color:var(--faint)}
.card.planned{cursor:default;border-style:dashed;background:transparent}
.card.planned:hover{transform:none;border-color:var(--line)}
.card.planned h2{font-size:24px;color:var(--dim)}
/* binary blaster */
.lane{position:relative;height:250px;border-radius:8px;background:linear-gradient(180deg,rgba(168,128,255,.06),transparent);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.drop{position:absolute;left:50%;top:0;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--sig);text-align:center;white-space:nowrap;transition:border-color .15s}
.drop .cap{font:500 11px var(--mono);color:var(--dim)}
.drop .big{font:600 clamp(22px,5vw,30px)/1.2 var(--mono);letter-spacing:.06em}
.drop.ok{border-color:var(--ok)} .drop.bad{border-color:var(--crit)}
.pv{display:flex;gap:2px;justify-content:center}
.pv span{display:grid;justify-items:center;min-width:28px}
.pv i{font:500 10px var(--mono);font-style:normal;color:var(--dim)}
.ground{position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,var(--panel2) 0 8px,var(--panel) 8px 16px);border-top:1px solid var(--line2);font:600 10px var(--mono);color:var(--dim);display:flex;align-items:center;justify-content:center;letter-spacing:.12em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.opts button{min-height:54px;font:600 18px var(--mono);border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;padding:6px;overflow-wrap:anywhere}
.opts button:hover{border-color:var(--sig)}
.opts button.right{border-color:var(--ok);color:var(--ok)} .opts button.wrong{border-color:var(--crit);color:var(--crit)}
.feedback{min-height:44px;margin-top:12px;font-size:14px}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--crit)}
/* code */
.code{margin:10px 0 0;padding:10px 0;border-radius:8px;background:#070d1a;border:1px solid var(--line);font:500 14px/1.65 var(--mono);overflow-x:auto}
.code .ln{display:grid;grid-template-columns:36px max-content;width:100%;text-align:left;border:0;background:transparent;padding:0 12px 0 0;font:inherit;color:var(--ink);white-space:pre;min-height:0;border-radius:0}
.code button.ln{cursor:pointer} .code button.ln:hover{background:rgba(168,128,255,.09)}

<div class="wrap" id="app"></div>

<script>
(() => {
'use strict';
/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('spma:' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('spma:' + k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = $('#app');
let MODE = store.get('mode') || 'explorer';
let UNTIMED = !!store.get('untimed');
const attempts = {};
let run = null;

/* keyboard: role=button elements respond to Enter/Space */
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button') { e.preventDefault(); t.click(); }
});

const partChip = (p, sel) => `<span class="part ${sel === p.id ? 'sel' : ''}" data-p="${p.id}" role="button" tabindex="0" aria-pressed="${sel === p.id}">${esc(p.name)}${p.sub ? `<small>${esc(p.sub)}</small>` : ''}</span>`;

/* =====================================================================
   GAME 1 · CONNECT THE SATELLITE BRAIN (CDHS)
   ===================================================================== */
const brain = {
  id: 'brain', mod: 'cdhs', kind: 'Mission', title: 'Connect the Satellite Brain', module: 'CDHS',
  covers: { cdhs: ['2', '3', '4', '6', '6.2', '6.3', '6.4'], sw: ['7'] },
  blurb: 'Plug storage, sensors and the radio into the flight computer. Engineers wire the buses and fix address and chip-select clashes.',
  lesson: { explorer: 'CDHS › 2 CDHS components · 3 Types of memory · 4 CDHS in SatKit', engineer: 'CDHS › 6.2 UART · 6.3 I2C · 6.4 SPI · CDHS Software › 7 Addresses' },
  time: { explorer: 45, engineer: 60 },
  brief(m) {
    return m === 'explorer' ? {
      scenario: 'The ESP32 flight computer is on the bench with five empty sockets. Each socket is labelled with a job. Plug in the part that does that job.',
      goals: ['Tap a part, then tap the socket whose job it does', 'Tap a placed part to pick it up again', 'Fill all five sockets, then press Verify wiring']
    } : {
      scenario: 'Six peripherals need to reach the ESP32 over its SPI, I²C and UART buses. The default configuration has two clashes that will stop the board from booting cleanly.',
      goals: ['Put each part on the bus it actually speaks', 'Give every device on the I²C bus a unique address', 'Give each SPI device its own free chip-select pin', 'Press Verify wiring']
    };
  },
  mount(el, api) {
    const E = api.mode === 'explorer';
    const parts = E ? shuffle([
      { id: 'sd', name: 'SD card', why: 'The SD card holds large files: images and long logs. It has lots of space but wears out with constant small rewrites.' },
      { id: 'fram', name: 'FRAM chip', why: 'FRAM is small, keeps data with no power, and survives billions of rewrites, so it suits boot counters and mode flags.' },
      { id: 'temp', name: 'Temperature sensor', why: 'The temperature sensor tells the computer how hot the boards are.' },
      { id: 'cur', name: 'Current sensor', why: 'The current sensor measures how much power each subsystem draws.' },
      { id: 'radio', name: 'Radio transceiver', why: 'The radio is the only part that can talk to the ground station.' }
    ]) : shuffle([
      { id: 'sd', name: 'microSD card', sub: 'SPI mode storage', bus: 'spi', why: 'SD cards in embedded systems run in SPI mode.' },
      { id: 'fram', name: 'FRAM, I²C variant', sub: 'address 0x50', bus: 'i2c', why: 'This FRAM part is the I²C variant, so it sits on the two-wire bus at 0x50.' },
      { id: 'temp', name: 'Temp/humidity sensor', sub: 'fixed address 0x40', bus: 'i2c', why: 'The temperature sensor is an I²C device with a fixed address.' },
      { id: 'cur', name: 'Current sensor', sub: 'INA219-type, default 0x40', bus: 'i2c', why: 'INA219-type current monitors are I²C devices with selectable addresses.' },
      { id: 'radio', name: 'LoRa transceiver', sub: 'SX127x-type module', bus: 'spi', why: 'SX127x-type radio modules are controlled over SPI.' },
      { id: 'gps', name: 'GPS receiver', sub: 'streams NMEA sentences', bus: 'uart', why: 'GPS receivers stream NMEA text over a serial UART link.' }
    ]);
    const targets = E ? shuffle([
      { id: 'sd', label: 'Socket A', desc: 'Stores large files such as images and long data logs' },
      { id: 'fram', label: 'Socket B', desc: 'Keeps small critical values (boot count, current mode) through power loss and endless rewrites' },
      { id: 'temp', label: 'Socket C', desc: 'Reports how hot the boards are getting' },
      { id: 'cur', label: 'Socket D', desc: 'Reports how much power each subsystem draws' },
      { id: 'radio', label: 'Socket E', desc: 'Sends telemetry down to the ground station' }
    ]).map((t, i) => ({ ...t, label: 'Socket ' + 'ABCDE'[i] })) : [
      { id: 'spi', label: 'SPI bus', desc: 'GPIO 18 SCK · 19 MISO · 23 MOSI. Fast; every device needs its own chip-select line.' },
      { id: 'i2c', label: 'I²C bus', desc: 'GPIO 21 SDA · 22 SCL. Two shared wires; every device needs a unique 7-bit address.' },
      { id: 'uart', label: 'UART2', desc: 'GPIO 16 RX · 17 TX. One device streaming serial data.' }
    ];
    const place = {};
    let sel = null;
    const cfg = { addr: '0x40', sdcs: 'GPIO 5', rcs: 'GPIO 5' };
    const pins = ['GPIO 5', 'GPIO 15', 'GPIO 6', 'GPIO 21'];
    el.innerHTML = `<div class="split">
      <section class="panel" id="trayp"><h3 class="lbl">Parts tray</h3><div class="parts" id="tray"></div><p class="hint" style="margin-top:12px">Tap a part to pick it up. With a part selected, tap here to put it back.</p></section>
      <section class="panel"><h3 class="lbl">${E ? 'Flight computer board' : 'ESP32 bus map'}</h3>
        <div class="esp"><i></i>ESP32 flight computer<i></i></div>
        <div class="${E ? 'chipboard' : 'sockets'}" id="sockets" style="margin-top:10px"></div>
        ${E ? '' : `<div class="cfg">
          <div class="field"><label for="b-addr">Current sensor I²C address</label><select id="b-addr">${['0x40', '0x41', '0x44', '0x45'].map(a => `<option>${a}</option>`).join('')}</select></div>
          <div class="field"><label for="b-sdcs">SD card chip-select</label><select id="b-sdcs">${pins.map(a => `<option>${a}</option>`).join('')}</select></div>
          <div class="field"><label for="b-rcs">Radio chip-select</label><select id="b-rcs">${pins.map(a => `<option>${a}</option>`).join('')}</select></div>
        </div><p class="hint" style="margin-top:8px">ESP32 note: GPIO 6–11 are wired to the onboard flash chip.</p>`}
        <div class="actions"><span class="msg" id="msg"></span><button class="btn primary" id="verify">Verify wiring</button></div>
      </section></div>`;
    const tray = $('#tray', el), sockets = $('#sockets', el), msg = $('#msg', el);
    function render() {
      const free = parts.filter(p => !place[p.id]);
      tray.innerHTML = free.map(p => partChip(p, sel)).join('') || '<span class="hint">All parts placed.</span>';
      sockets.innerHTML = targets.map(t => `<div class="socket ${sel ? 'armed' : ''}" data-t="${t.id}" role="button" tabindex="0" aria-label="${esc(t.label)}: ${esc(t.desc)}">
        <span class="socket-k">${esc(t.label)}</span><span class="socket-d">${esc(t.desc)}</span>
        <span class="socket-in">${parts.filter(p => place[p.id] === t.id).map(p => partChip(p, sel)).join('') || '<em>empty</em>'}</span></div>`).join('');
    }
    el.addEventListener('click', e => {
      if (api.over()) return;
      const pc = e.target.closest('[data-p]');
      const sk = e.target.closest('[data-t]');
      if (pc && !(sk && sel && sel !== pc.dataset.p)) { sel = sel === pc.dataset.p ? null : pc.dataset.p; render(); return; }
      if (sk && sel) {
        if (E) for (const k in place) if (place[k] === sk.dataset.t) delete place[k];
        place[sel] = sk.dataset.t; sel = null; msg.textContent = ''; render(); return;
      }
      if (e.target.closest('#trayp') && sel) { delete place[sel]; sel = null; render(); }
    });
    if (!E) {
      $('#b-addr', el).onchange = e => cfg.addr = e.target.value;
      $('#b-sdcs', el).onchange = e => cfg.sdcs = e.target.value;
      $('#b-rcs', el).onchange = e => cfg.rcs = e.target.value;
    }
    function evaluate(timedOut) {
      const notes = [];
      let pts = 0, max = 0;
      if (E) {
        parts.forEach(p => { max++; const ok = place[p.id] === p.id; if (ok) pts++; else notes.push({ ok: false, t: (place[p.id] ? `${p.name} was in the wrong socket. ` : `${p.name} was never plugged in. `) + p.why }); });
      } else {
        parts.forEach(p => { max++; const ok = place[p.id] === p.bus; if (ok) pts++; else notes.push({ ok: false, t: `${p.name} belongs on ${p.bus === 'i2c' ? 'I²C' : p.bus.toUpperCase()}. ${p.why}` }); });
        max += 3;
        if (cfg.addr !== '0x40') pts++; else notes.push({ ok: false, t: 'Address clash: the current sensor and the temperature sensor both answered at 0x40. Strap the current sensor to 0x41, 0x44 or 0x45.' });
        const bad = p => p === 'GPIO 6' || p === 'GPIO 21';
        if (!bad(cfg.sdcs)) pts++; else notes.push({ ok: false, t: `SD chip-select on ${cfg.sdcs} is not free: ${cfg.sdcs === 'GPIO 6' ? 'GPIO 6 drives the onboard flash' : 'GPIO 21 is already the I²C data line'}.` });
        if (!bad(cfg.rcs) && cfg.rcs !== cfg.sdcs) pts++; else notes.push({ ok: false, t: cfg.rcs === cfg.sdcs ? 'Both SPI devices shared one chip-select pin, so the SD card and radio would answer at the same time.' : `Radio chip-select on ${cfg.rcs} is not a free pin.` });
      }
      if (timedOut) notes.unshift({ ok: false, t: 'Time ran out before the wiring was verified. Unplaced parts counted as wrong.' });
      if (pts === max) notes.push({ ok: true, t: E ? 'Every part is doing its job. Data can now flow from sensors to storage and the radio.' : 'Clean bus map: unique I²C addresses, separate chip-selects, and the GPS on its own UART.' });
      return { acc: pts / max, notes };
    }
    $('#verify', el).onclick = () => {
      if (api.over()) return;
      const placed = Object.keys(place).length;
      if (placed < parts.length) { msg.textContent = `Place all parts first (${placed}/${parts.length}).`; return; }
      api.finish(evaluate(false));
    };
    render();
    return { timeout: () => api.finish(evaluate(true)) };
  }
};

/* =====================================================================
   GAME 2 · SURVIVE THE ECLIPSE (EPS)
   ===================================================================== */
const eclipse = {
  id: 'eclipse', mod: 'eps', kind: 'Mission', title: 'Survive the Eclipse', module: 'EPS',
  covers: { eps: ['1', '3', '4', '5'], adcs: ['3'] },
  blurb: 'Your CubeSat drops into Earth’s shadow. Switch loads to keep the battery alive, still take your photos and catch the ground pass.',
  lesson: { explorer: 'EPS › 1 Intro to EPS · 3 Power on CubeSat & MPPT · 5 How lithium-ion batteries work', engineer: 'EPS › 3 Power on CubeSat & MPPT · 4 Types of batteries · 5 How lithium-ion batteries work · ADCS › 3 Subsystems overview' },
  time: { explorer: 45, engineer: 60 }, fixed: true,
  brief(m) {
    const E = m === 'explorer';
    return {
      scenario: E ? 'The simulation covers one hour of orbit. You start in sunlight, then spend most of the hour in eclipse with only the battery for power. The flight computer must stay on.'
        : 'One hour of orbit compressed into a minute. 10 Wh battery at 80% charge, 10 W solar array in sunlight. The battery cools fast in shadow and must not drop below 0 °C.',
      goals: E ? ['Take photos in sunlight (camera on, attitude control on)', 'Keep the battery above the red safety line', 'Have the radio on while the ground station is overhead']
        : ['Image for at least 12 minutes in sunlight with attitude control on', 'Keep state of charge at or above 30%', 'Radio on for at least 70% of the ground pass', 'Keep battery temperature at or above 0 °C using the heater']
    };
  },
  mount(el, api) {
    const E = api.mode === 'explorer';
    const dur = eclipse.time[api.mode];
    const CAP = 10, MIN = 0.3;
    const SUN1 = 0.2, SUN2 = 0.85, P0 = 0.55, P1 = 0.68;
    const loads = [
      { id: 'obc', nm: 'Flight computer', w: 2, on: true, lock: true, note: 'essential' },
      { id: 'radio', nm: 'Radio transmitter', w: 4, on: true },
      { id: 'cam', nm: 'Payload camera', w: 5, on: true },
      { id: 'adcs', nm: 'Attitude control', w: 2, on: true, note: 'points panels & camera' },
      ...(E ? [] : [{ id: 'heat', nm: 'Battery heater', w: 3, on: false }])
    ];
    const S = { t: 0, wh: CAP * (E ? 0.7 : 0.8), temp: 10, imgMin: 0, passOn: 0, passTot: 0, minSoc: 1, minTemp: 10, safe: false };
    const imgNeed = E ? 8 : 12; // simulated minutes
    const legend = `<div class="orbit-legend"><span><i style="background:#3d3417"></i>Sunlight</span><span><i style="background:#0c0617;border:1px solid var(--line2)"></i>Eclipse</span><span><i style="background:repeating-linear-gradient(45deg,rgba(168,128,255,.5) 0 3px,transparent 3px 6px)"></i>Ground pass</span></div>`;
    el.innerHTML = `<div class="stack-v">
      <section class="panel"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:10px"><div><p class="lbl">Orbit phase</p><p class="phase sun" id="e-phase">Sunlight</p></div><p class="mono hint" id="e-next"></p></div>
        <div class="orbit"><div class="seg-sun" style="width:${SUN1 * 100}%"></div><div class="seg-ecl" style="width:${(SUN2 - SUN1) * 100}%"></div><div class="seg-sun" style="flex:1"></div>
        <div class="pass" style="left:${P0 * 100}%;width:${(P1 - P0) * 100}%"></div><div class="cursor" id="e-cur" style="left:0"></div></div>${legend}</section>
      <div class="split">
        <section class="panel stack-v">
          <div><p class="lbl">Battery${E ? '' : ' state of charge'}</p><div class="gauge" style="margin-top:8px"><div class="fill" id="e-bat"></div><div class="line" style="left:${MIN * 100}%"></div></div></div>
          <div class="readouts" id="e-ro"></div>
          <ul class="objs" id="e-obj"></ul>
        </section>
        <section class="panel"><h3 class="lbl">Power switches</h3><div class="loads" id="e-loads" style="margin-top:10px"></div>
          <p class="hint" style="margin-top:12px">${E ? 'Every switch you turn on drains the battery in the dark.' : 'Watts shown are steady-state draw. Solar output halves if attitude control is off.'}</p></section>
      </div></div>`;
    const loadsEl = $('#e-loads', el);
    loadsEl.innerHTML = loads.map(l => `<button class="load" data-l="${l.id}" aria-pressed="${l.on}" ${l.lock ? 'disabled' : ''}><span class="nm">${l.nm}</span><span class="sw" aria-hidden="true"></span><span class="w">${E ? (l.note || '&nbsp;') : l.w + ' W' + (l.note ? ' · ' + l.note : '')}</span></button>`).join('');
    loadsEl.addEventListener('click', e => {
      const b = e.target.closest('[data-l]'); if (!b || api.over()) return;
      const l = loads.find(x => x.id === b.dataset.l); if (l.lock) return;
      l.on = !l.on; b.setAttribute('aria-pressed', l.on);
    });
    const on = id => { const l = loads.find(x => x.id === id); return !!(l && l.on); };
    const f = () => S.t / dur;
    const isSun = () => f() < SUN1 || f() >= SUN2;
    const inPass = () => f() >= P0 && f() < P1;
    function objectives(final) {
      const o = [];
      const img = S.imgMin >= imgNeed;
      o.push({ k: 'img', ok: img, live: !final && !img, t: `Imaging ${S.imgMin.toFixed(0)}/${imgNeed} min in sunlight` });
      o.push({ k: 'bat', ok: !S.safe && S.minSoc >= MIN - 1e-6, t: E ? 'Battery stayed above the red line' : `Lowest charge ${(S.minSoc * 100).toFixed(0)}% (limit 30%)` });
      const pr = S.passTot ? S.passOn / S.passTot : 0;
      const passDone = f() >= P1 || final;
      o.push({ k: 'pass', ok: passDone && pr >= 0.7, live: !passDone, t: `Radio on during pass ${S.passTot ? Math.round(pr * 100) : 0}%${passDone ? '' : ' (pass ' + (f() < P0 ? 'upcoming' : 'in progress') + ')'}` });
      if (!E) o.push({ k: 'temp', ok: S.minTemp >= 0, t: `Lowest battery temperature ${S.minTemp.toFixed(1)} °C (limit 0 °C)` });
      return o;
    }
    function draw() {
      const soc = S.wh / CAP;
      $('#e-cur', el).style.left = `calc(${f() * 100}% - 1px)`;
      const ph = $('#e-phase', el); const sun = isSun();
      ph.textContent = sun ? 'Sunlight' : 'Eclipse'; ph.className = 'phase ' + (sun ? 'sun' : 'ecl');
      const next = f() < SUN1 ? `Eclipse in ${((SUN1 - f()) * 60).toFixed(0)} min` : f() < P0 ? `Ground pass in ${((P0 - f()) * 60).toFixed(0)} min` : f() < P1 ? 'Ground station overhead' : f() < SUN2 ? `Sunrise in ${((SUN2 - f()) * 60).toFixed(0)} min` : 'Back in sunlight';
      $('#e-next', el).textContent = `T+${(f() * 60).toFixed(0)} min · ${next}`;
      const bat = $('#e-bat', el); bat.style.width = (soc * 100) + '%';
      bat.style.background = soc < MIN + 0.08 ? 'var(--crit)' : soc < 0.5 ? 'var(--warn)' : 'var(--ok)';
      const solar = sun ? 10 * (on('adcs') ? 1 : 0.5) : 0;
      const demand = loads.reduce((s, l) => s + (l.on ? l.w : 0), 0);
      $('#e-ro', el).innerHTML = E
        ? `<div class="ro"><span class="lbl">Power in</span><b style="color:var(--sun)">${solar ? '☀ ' + (solar >= 10 ? 'Full' : 'Half') : 'None'}</b></div><div class="ro"><span class="lbl">Power use</span><b>${demand <= 4 ? 'Low' : demand <= 8 ? 'Medium' : 'High'}</b></div><div class="ro"><span class="lbl">Battery</span><b>${(soc * 100).toFixed(0)}%</b></div>`
        : `<div class="ro"><span class="lbl">Solar in</span><b>${solar.toFixed(1)} W</b></div><div class="ro"><span class="lbl">Demand</span><b>${demand.toFixed(1)} W</b></div><div class="ro"><span class="lbl">Net</span><b style="color:${solar - demand >= 0 ? 'var(--ok)' : 'var(--crit)'}">${(solar - demand >= 0 ? '+' : '') + (solar - demand).toFixed(1)} W</b></div><div class="ro"><span class="lbl">Energy</span><b>${S.wh.toFixed(2)} Wh</b></div><div class="ro"><span class="lbl">SoC</span><b>${(soc * 100).toFixed(0)}%</b></div><div class="ro"><span class="lbl">Batt temp</span><b style="color:${S.temp < 2 ? 'var(--crit)' : 'var(--ink)'}">${S.temp.toFixed(1)} °C</b></div>`;
      $('#e-obj', el).innerHTML = objectives(false).map(o => `<li class="${o.ok ? 'ok' : o.live ? 'live' : 'bad'}">${o.t}</li>`).join('');
    }
    function evaluate() {
      const o = objectives(true);
      const w = E ? { img: 0.2, bat: 0.5, pass: 0.3 } : { img: 0.15, bat: 0.4, pass: 0.2, temp: 0.25 };
      const acc = o.reduce((s, x) => s + (x.ok ? w[x.k] : 0), 0);
      const why = {
        img: 'Photos need sunlight, the camera on, and attitude control on so the lens faces Earth. Image early, before the eclipse.',
        bat: S.safe ? 'The battery fell below the safety limit and the satellite dropped into safe mode. In shadow, switch off every load the mission does not need right now.' : 'Charge dipped below the limit.',
        pass: 'The radio only matters while the ground station can hear you. Switch it on for the pass and off again afterwards.',
        temp: 'Lithium cells must stay above 0 °C. Run the heater in bursts during eclipse: 3 W for about 60% of the shadow keeps the cell warm.'
      };
      const notes = o.map(x => ({ ok: x.ok, t: x.ok ? x.t + '.' : x.t + '. ' + why[x.k] }));
      return { acc: clamp(acc, 0, 1), notes, timeFactor: S.safe ? 0 : 1, passed: !S.safe };
    }
    const DT = 0.1;
    const iv = setInterval(() => {
      if (api.over()) return;
      S.t += DT;
      const minPer = 60 / dur * DT; // simulated minutes this tick
      const sun = isSun();
      const solar = sun ? 10 * (on('adcs') ? 1 : 0.5) : 0;
      const demand = loads.reduce((s, l) => s + (l.on ? l.w : 0), 0);
      S.wh = clamp(S.wh + (solar - demand) * minPer / 60, 0, CAP);
      if (sun && on('cam') && on('adcs')) S.imgMin += minPer;
      if (inPass()) { S.passTot += minPer; if (on('radio')) S.passOn += minPer; }
      if (!E) {
        const dT = sun ? 0.4 : on('heat') ? 0.5 : -1.3;
        S.temp = clamp(S.temp + dT * minPer + (on('heat') && sun ? 0.3 * minPer : 0), -40, 25);
        S.minTemp = Math.min(S.minTemp, S.temp);
      }
      S.minSoc = Math.min(S.minSoc, S.wh / CAP);
      if (S.wh / CAP < MIN - 1e-6) { S.safe = true; draw(); api.finish(evaluate()); return; }
      draw();
      if (S.t >= dur - 1e-6) api.finish(evaluate());
    }, DT * 1000);
    draw();
    return { stop: () => clearInterval(iv), timeout: () => api.finish(evaluate()) };
  }
};

/* =====================================================================
   GAME 3 · CUBESAT ASSEMBLY RUSH (Mechanical)
   ===================================================================== */
const assembly = {
  id: 'assembly', mod: 'mech', kind: 'Mission', title: 'CubeSat Assembly Rush', module: 'Mechanical',
  covers: { mech: ['3', '4', '5'] },
  blurb: 'Fit boards, panels, camera and antenna into a 1U frame. Engineers balance the stack so the centre of gravity stays on target.',
  lesson: { explorer: 'Mechanical › 4 CubeSat configuration', engineer: 'Mechanical › 3 Mass budget · 4 CubeSat configuration · 5 Center of gravity' },
  time: { explorer: 45, engineer: 60 },
  brief(m) {
    return m === 'explorer' ? {
      scenario: 'A 1U CubeSat frame is waiting on the bench. Put every part where it can do its job and keep the satellite balanced.',
      goals: ['The camera must look at Earth', 'The antenna deploys from the top face', 'Solar panels go on the sides to catch sunlight', 'Heavy parts go in the middle of the stack', 'The radio sits close to the antenna']
    } : {
      scenario: 'Integrate five modules into the 1U stack (levels at −4, −2, 0, +2 and +4 cm from the geometric centre). The structure, solar panels and antenna are already fitted.',
      goals: ['Camera at the Earth-facing −Z end', 'Radio on the level next to the antenna', 'EPS board adjacent to the battery (short power harness)', 'Centre of gravity within ±0.3 cm of centre along Z (this mission’s requirement)']
    };
  },
  mount(el, api) {
    const E = api.mode === 'explorer';
    let sel = null; const place = {};
    let parts, slots;
    if (E) {
      parts = shuffle([
        { id: 'cam', name: 'Camera' }, { id: 'ant', name: 'Antenna' }, { id: 'sol', name: 'Solar panels' },
        { id: 'bat', name: 'Battery pack', sub: 'heaviest' }, { id: 'obc', name: 'Flight computer' }, { id: 'rad', name: 'Radio board' }
      ]);
      slots = [
        { id: 'top', k: '+Z top face', cls: 'face', want: 'ant' },
        { id: 's3', k: 'Stack · upper', cls: 'face lvl', want: 'rad' },
        { id: 's2', k: 'Stack · middle', cls: 'face lvl', want: 'bat' },
        { id: 's1', k: 'Stack · lower', cls: 'face lvl', want: 'obc' },
        { id: 'bot', k: '−Z face · faces Earth', cls: 'face', want: 'cam' },
        { id: 'side', k: 'Side faces', cls: 'side', want: 'sol' }
      ];
    } else {
      parts = shuffle([
        { id: 'cam', name: 'Camera payload', sub: '0.30 kg', m: 0.30 }, { id: 'rad', name: 'Radio board', sub: '0.10 kg', m: 0.10 },
        { id: 'bat', name: 'Battery pack', sub: '0.35 kg', m: 0.35 }, { id: 'eps', name: 'EPS board', sub: '0.12 kg', m: 0.12 },
        { id: 'obc', name: 'OBC board', sub: '0.08 kg', m: 0.08 }
      ]);
      slots = [5, 4, 3, 2, 1].map(n => ({ id: 'L' + n, k: `L${n} · z ${(n - 3) * 2 > 0 ? '+' : ''}${(n - 3) * 2} cm`, cls: 'face lvl', z: (n - 3) * 2 }));
    }
    const fixed = E ? [] : [{ nm: 'Structure + side panels', m: 0.45, z: 0 }, { nm: 'Antenna (+Z face)', m: 0.05, z: 5 }];
    const LIM = 0.3;
    function cog() {
      let m = 0, mz = 0;
      fixed.forEach(f => { m += f.m; mz += f.m * f.z; });
      parts.forEach(p => { if (place[p.id]) { const s = slots.find(x => x.id === place[p.id]); m += p.m; mz += p.m * s.z; } });
      return { m, z: m ? mz / m : 0 };
    }
    el.innerHTML = `<div class="split">
      <section class="panel stack-v" id="trayp"><div><h3 class="lbl">Parts tray</h3><div class="parts" id="tray"></div></div>
        ${E ? '<p class="hint">Tap a part, then tap where it goes. Tap a fitted part to move it.</p>' : `<div><p class="lbl">Live mass properties</p><div class="readouts" id="a-ro" style="margin-top:8px"></div>
        <div class="cogbar" aria-hidden="true"><div class="zone" style="left:${50 - LIM / 3 * 50}%;width:${LIM / 3 * 100}%"></div><div class="mk" id="a-mk"></div></div><p class="hint mono" style="margin-top:4px">bar spans −3 cm … +3 cm along Z</p></div>
        <div class="spec">Fixed: structure and body-mounted panels 0.45 kg at z 0, antenna 0.05 kg at z +5 cm.</div>`}
      </section>
      <section class="panel"><h3 class="lbl">${E ? '1U CubeSat · side view' : '1U stack · side view'}</h3><div class="cube" id="cube"></div>
        <div class="actions"><span class="msg" id="msg"></span><button class="btn primary" id="verify">Verify assembly</button></div></section></div>`;
    const tray = $('#tray', el), cube = $('#cube', el), msg = $('#msg', el);
    function slotHtml(s) {
      const inside = parts.filter(p => place[p.id] === s.id).map(p => partChip(p, sel)).join('');
      return `<div class="slot ${s.cls} ${sel ? 'armed' : ''}" data-t="${s.id}" role="button" tabindex="0"><span class="k">${s.k}</span>${inside || ''}</div>`;
    }
    function render() {
      tray.innerHTML = parts.filter(p => !place[p.id]).map(p => partChip(p, sel)).join('') || '<span class="hint">All parts fitted.</span>';
      if (E) {
        const side = slots.find(s => s.id === 'side');
        cube.innerHTML = `<div style="grid-column:1/-1">${slotHtml(slots[0])}</div>` +
          `<div class="slot side ${sel ? 'armed' : ''}" data-t="side" role="button" tabindex="0" style="grid-column:1;grid-row:2/span 3"><span class="k">Side faces</span>${parts.filter(p => place[p.id] === 'side').map(p => partChip(p, sel)).join('')}</div>` +
          slots.slice(1, 4).map((s, i) => `<div style="grid-column:2;grid-row:${i + 2}">${slotHtml(s)}</div>`).join('') +
          `<div class="slot side fixed" style="grid-column:3;grid-row:2/span 3" aria-hidden="true"><span class="k">${place.sol ? 'panels' : 'side'}</span></div>` +
          `<div style="grid-column:1/-1">${slotHtml(slots[4])}</div>`;
      } else {
        cube.innerHTML = `<div class="slot fixed" style="grid-column:1/-1"><span class="k">+Z face · antenna (fixed)</span></div>` +
          `<div class="slot side fixed" style="grid-column:1;grid-row:2/span 5"><span class="k">panel</span></div>` +
          slots.map((s, i) => `<div style="grid-column:2;grid-row:${i + 2}">${slotHtml(s)}</div>`).join('') +
          `<div class="slot side fixed" style="grid-column:3;grid-row:2/span 5"><span class="k">panel</span></div>` +
          `<div class="slot fixed" style="grid-column:1/-1"><span class="k">−Z face · Earth-facing aperture</span></div>`;
        const c = cog();
        $('#a-ro', el).innerHTML = `<div class="ro"><span class="lbl">Mass</span><b>${c.m.toFixed(2)} kg</b></div><div class="ro"><span class="lbl">CoG z</span><b style="color:${Math.abs(c.z) <= LIM ? 'var(--ok)' : 'var(--warn)'}">${(c.z >= 0 ? '+' : '') + c.z.toFixed(2)} cm</b></div>`;
        $('#a-mk', el).style.left = `calc(${clamp(50 + c.z / 3 * 50, 0, 100)}% - 1px)`;
      }
    }
    el.addEventListener('click', e => {
      if (api.over()) return;
      const pc = e.target.closest('[data-p]'); const sk = e.target.closest('[data-t]');
      if (pc && !(sk && sel && sel !== pc.dataset.p)) { sel = sel === pc.dataset.p ? null : pc.dataset.p; render(); return; }
      if (sk && sel) { for (const k in place) if (place[k] === sk.dataset.t) delete place[k]; place[sel] = sk.dataset.t; sel = null; msg.textContent = ''; render(); return; }
      if (e.target.closest('#trayp') && sel) { delete place[sel]; sel = null; render(); }
    });
    function evaluate(timedOut) {
      const notes = []; let pts = 0, max;
      if (E) {
        const why = { cam: 'The camera goes on the −Z face so its lens looks down at Earth.', ant: 'The antenna deploys from the +Z top face, clear of the panels.', sol: 'Solar panels cover the side faces so some always see the Sun.', bat: 'The battery is the heaviest part. In the middle of the stack it keeps the centre of gravity near the centre of the cube.', obc: 'The flight computer fills the lower stack slot, between camera and battery, close to the camera it controls.', rad: 'The radio sits in the upper slot so its cable to the antenna stays short.' };
        max = parts.length;
        parts.forEach(p => { const s = slots.find(x => x.id === place[p.id]); if (s && s.want === p.id) pts++; else notes.push({ ok: false, t: why[p.id] }); });
      } else {
        max = 4;
        const lv = id => place[id] ? +place[id].slice(1) : 0;
        if (lv('cam') === 1) pts++; else notes.push({ ok: false, t: 'The camera must sit at L1, behind the Earth-facing −Z aperture.' });
        if (lv('rad') === 5) pts++; else notes.push({ ok: false, t: 'The radio belongs at L5, next to the antenna on the +Z face, to keep RF cable loss low.' });
        if (Math.abs(lv('eps') - lv('bat')) === 1) pts++; else notes.push({ ok: false, t: 'The EPS board must be on a level touching the battery for a short, low-resistance power harness.' });
        const c = cog();
        if (Object.keys(place).length === parts.length && Math.abs(c.z) <= LIM) pts++; else notes.push({ ok: false, t: `Centre of gravity ended at ${(c.z >= 0 ? '+' : '') + c.z.toFixed(2)} cm. The heavy camera pulls it toward −Z, so the 0.35 kg battery has to sit above centre (L4) to balance it.` });
        notes.push({ ok: true, t: 'Real CubeSat Design Specification limit for a 1U is ±2 cm. This mission sets a tighter ±0.3 cm to keep the attitude controller’s job easy.' });
      }
      if (timedOut) notes.unshift({ ok: false, t: 'Time ran out before the assembly was verified.' });
      if (pts === max) notes.unshift({ ok: true, t: E ? 'Assembly complete and balanced. Ready for integration testing.' : 'All four integration rules met. The stack is balanced and serviceable.' });
      return { acc: pts / max, notes };
    }
    $('#verify', el).onclick = () => {
      if (api.over()) return;
      const n = Object.keys(place).length;
      if (n < parts.length) { msg.textContent = `Fit every part first (${n}/${parts.length}).`; return; }
      api.finish(evaluate(false));
    };
    render();
    return { timeout: () => api.finish(evaluate(true)) };
  }
};

/* =====================================================================
   GAME 4 · DOWNLINK DASH (Communications)
   ===================================================================== */
const downlink = {
  id: 'downlink', mod: 'comms', kind: 'Mission', title: 'Downlink Dash', module: 'Communication System',
  covers: { comms: ['3', '9', '10', '11'], adcs: ['10'] },
  blurb: 'A ground station pass lasts minutes. Acquire the signal, order the data queue, and engineers pick the data rate the link can actually close.',
  lesson: { explorer: 'Communication System › 3 Uses in space · 9 TX-RX', engineer: 'Communication System › 9 TX-RX · 10 Important considerations · 11 Communication challenges · ADCS › 10 TLE' },
  time: { explorer: 45, engineer: 55 }, fixed: true,
  brief(m) {
    return m === 'explorer' ? {
      scenario: 'Your satellite is about to rise over the ground station. You will not have time to send everything, so choose what matters most.',
      goals: ['Press Acquire signal once the satellite climbs above the horizon', 'Use the arrows to put the most important data first', 'Get both critical packets down before the satellite sets']
    } : {
      scenario: 'A 9-minute pass at 500 km altitude, shown in 55 seconds. Link margin rises with elevation and falls 3 dB each time you double the data rate. Below 3 dB margin, frames fail their CRC and the current packet restarts.',
      goals: ['Acquire signal after AOS (elevation above 5°)', 'Raise the data rate as the satellite climbs; lower it as it sets', 'Order the queue so the critical packets go first', 'Maximise the value of what reaches the ground']
    };
  },
  mount(el, api) {
    const E = api.mode === 'explorer';
    const dur = downlink.time[api.mode];
    const MAXEL = 55, RE = 6371, H = 500, SCALE = 12; // 1 game second = 12 real seconds
    const sc = E ? 1 : 3;
    const pk = shuffle([
      { id: 'hk', nm: 'Housekeeping telemetry', kb: 24, v: 30, crit: true },
      { id: 'fault', nm: 'Battery fault log', kb: 10, v: 25, crit: true },
      { id: 'sci', nm: 'Science sensor log', kb: 140, v: 20 },
      { id: 'img1', nm: 'Earth image, tile 1', kb: 380, v: 15 },
      { id: 'img2', nm: 'Earth image, tile 2', kb: 380, v: 10 },
      { id: 'dbg', nm: 'Debug memory dump', kb: 260, v: 3 }
    ]).map(p => ({ ...p, kb: p.kb * sc, sent: 0, done: false }));
    const RATES = [1.2, 4.8, 9.6, 19.2, 38.4];
    let rate = E ? 9.6 : 1.2, acquired = false, t = 0, errors = 0, lostKb = 0;
    const elev = tt => MAXEL * Math.sin(Math.PI * clamp(tt / dur, 0, 1));
    const range = e => { const r = e * Math.PI / 180; return Math.sqrt((RE + H) ** 2 - (RE * Math.cos(r)) ** 2) - RE * Math.sin(r); };
    const margin = (e, r) => 22 - 20 * Math.log10(range(e) / H) - 10 * Math.log10(r / 1.2);
    const linkOk = (e, r) => E ? e >= 10 : (e >= 5 && margin(e, r) >= 3);
    const kbps = r => r * SCALE / 8; // kB delivered per game second
    // best achievable value (for scoring)
    let cap = 0; for (let x = 0; x < dur; x += 0.1) { const e = elev(x); if (e < 5) continue; if (E) { if (e >= 10) cap += kbps(9.6) * 0.1; } else { const best = RATES.filter(r => margin(e, r) >= 3).pop(); if (best) cap += kbps(best) * 0.1; } }
    cap *= 0.94; // allow for human reaction time
    let bestV = 0; for (let mask = 0; mask < 64; mask++) { let s = 0, v = 0; pk.forEach((p, i) => { if (mask >> i & 1) { s += p.kb; v += p.v; } }); if (s <= cap) bestV = Math.max(bestV, v); }
    // sky path
    const pts = []; for (let i = 0; i <= 60; i++) { const x = i / 60; pts.push(`${10 + x * 280},${110 - elev(x * dur) / 90 * 100}`); }
    el.innerHTML = `<div class="split">
      <section class="panel stack-v"><div><p class="lbl">Sky view from ground station</p>
        <svg class="sky" viewBox="0 0 300 120" role="img" aria-label="Satellite track across the sky">
          <line x1="10" y1="110" x2="290" y2="110" stroke="#34446f" stroke-width="1.5"/>
          <line x1="10" y1="${110 - 10 / 90 * 100}" x2="290" y2="${110 - 10 / 90 * 100}" stroke="#27345a" stroke-dasharray="3 4"/>
          <text x="292" y="${108 - 10 / 90 * 100}" fill="#8b96b6" font-size="8" text-anchor="end" font-family="Inter, sans-serif">10°</text>
          <polyline points="${pts.join(' ')}" fill="none" stroke="#a880ff" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>
          <path d="M150 110 l-8 0 l8 -12 l8 12 z" fill="#ffb547"/>
          <circle id="d-sat" r="5" fill="#ffd76a"/>
          <line id="d-beam" stroke="#3fd3ad" stroke-width="1.2" opacity="0"/>
        </svg></div>
        <div class="readouts" id="d-ro"></div>
        ${E ? '' : `<div><p class="lbl">Downlink data rate (kbps)</p><div class="rates" id="d-rates">${RATES.map(r => `<button data-r="${r}" aria-pressed="${r === rate}">${r}</button>`).join('')}</div></div>`}
        <button class="btn primary" id="d-acq">Acquire signal</button><span class="msg" id="msg"></span>
      </section>
      <section class="panel"><h3 class="lbl">Downlink queue · top sends first</h3><div class="queue" id="d-q"></div></section></div>`;
    const q = $('#d-q', el), msg = $('#msg', el);
    function renderQ() {
      q.innerHTML = pk.map((p, i) => `<div class="pk ${p.done ? 'done' : ''} ${p.crit ? 'crit' : ''}" data-i="${i}">
        <span class="nm">${p.nm}<small>${p.kb} kB${p.done ? ' · delivered' : p.sent ? ` · ${Math.round(p.sent / p.kb * 100)}%` : ''}</small></span>
        <span class="ctl"><button data-mv="-1" aria-label="Move ${p.nm} up" ${i === 0 || p.done ? 'disabled' : ''}>↑</button><button data-mv="1" aria-label="Move ${p.nm} down" ${i === pk.length - 1 || p.done ? 'disabled' : ''}>↓</button></span>
        <span class="bar"><i style="width:${p.sent / p.kb * 100}%"></i></span></div>`).join('');
    }
    q.addEventListener('click', e => {
      const b = e.target.closest('[data-mv]'); if (!b || api.over()) return;
      const i = +b.closest('[data-i]').dataset.i, j = i + +b.dataset.mv;
      if (j < 0 || j >= pk.length || pk[j].done) return;
      [pk[i], pk[j]] = [pk[j], pk[i]]; renderQ();
    });
    if (!E) $('#d-rates', el).addEventListener('click', e => {
      const b = e.target.closest('[data-r]'); if (!b || api.over()) return;
      rate = +b.dataset.r; [...el.querySelectorAll('#d-rates button')].forEach(x => x.setAttribute('aria-pressed', +x.dataset.r === rate));
    });
    $('#d-acq', el).onclick = () => {
      if (api.over() || acquired) return;
      if (elev(t) < 5) { api.mistake(); msg.className = 'msg'; msg.textContent = 'No carrier yet. The satellite is still below the horizon.'; return; }
      acquired = true; msg.className = 'msg ok'; msg.textContent = 'Signal locked. Downlink running.'; $('#d-acq', el).disabled = true;
    };
    function draw() {
      const e = elev(t), x = 10 + t / dur * 280, y = 110 - e / 90 * 100;
      const sat = $('#d-sat', el); sat.setAttribute('cx', x); sat.setAttribute('cy', y);
      const beam = $('#d-beam', el); const live = acquired && linkOk(e, rate);
      beam.setAttribute('x1', 150); beam.setAttribute('y1', 100); beam.setAttribute('x2', x); beam.setAttribute('y2', y); beam.setAttribute('opacity', live ? .9 : 0);
      const m = margin(Math.max(e, 0.5), rate);
      const status = !acquired ? (e < 5 ? 'Waiting for AOS' : 'Not acquired') : e < 5 ? 'Loss of signal' : live ? 'Link up' : E ? 'Weak signal' : 'CRC errors';
      $('#d-ro', el).innerHTML = `<div class="ro"><span class="lbl">Elevation</span><b>${e.toFixed(0)}°</b></div>` +
        (E ? '' : `<div class="ro"><span class="lbl">Range</span><b>${range(Math.max(e, 0)).toFixed(0)} km</b></div><div class="ro"><span class="lbl">Margin</span><b style="color:${e < 5 ? 'var(--faint)' : m >= 3 ? 'var(--ok)' : 'var(--crit)'}">${e < 5 ? '—' : m.toFixed(1) + ' dB'}</b></div>`) +
        `<div class="ro"><span class="lbl">Link</span><b style="font-size:16px;color:${live ? 'var(--ok)' : 'var(--dim)'}">${status}</b></div>` +
        `<div class="ro"><span class="lbl">Pass left</span><b>${Math.max(0, (dur - t) * SCALE / 60).toFixed(1)} min</b></div>`;
    }
    function evaluate() {
      const got = pk.filter(p => p.done);
      const v = got.reduce((s, p) => s + p.v, 0);
      const critOk = pk.filter(p => p.crit).every(p => p.done);
      let acc = clamp(v / bestV, 0, 1); if (!critOk) acc *= 0.5;

      notes.push({ ok: acc >= 0.9, t: `Delivered ${got.length} of ${pk.length} packets, ${v} value points (best possible this pass ≈ ${bestV}).` });
      if (pk.find(p => p.id === 'dbg' && p.done) && pk.some(p => !p.done && p.v > 3)) notes.push({ ok: false, t: 'The debug dump used airtime that a more valuable packet needed. Low-value bulk data can wait for a later pass.' });
      if (!E) notes.push({ ok: errors < 3, t: errors ? `${errors} seconds of CRC errors wasted about ${lostKb.toFixed(0)} kB of partial packets. At low elevation the slant range is up to 4× longer, so the rate has to drop.` : 'No CRC errors. Your rate choices kept the margin above 3 dB.' });
      if (!acquired) notes.push({ ok: false, t: 'The signal was never acquired, so nothing could be downlinked.' });
      return { acc, notes, timeFactor: 1, passed: critOk };
    }
    const DT = 0.1;
    let errAcc = 0;
    const iv = setInterval(() => {
      if (api.over()) return;
      t += DT;
      const e = elev(t);
      if (acquired && e >= 5) {
        const cur = pk.find(p => !p.done);
        if (cur) {
          if (linkOk(e, rate)) {
            cur.sent += kbps(rate) * DT;
            if (cur.sent >= cur.kb) { cur.sent = cur.kb; cur.done = true; }
          } else if (!E) {
            errAcc += DT; if (errAcc >= 1) { errors++; errAcc = 0; }
            if (cur.sent > 0) { lostKb += cur.sent; cur.sent = 0; }
          }
        }
      }
      renderQ(); draw();
      if (t >= dur) api.finish(evaluate());
    }, DT * 1000);
    renderQ(); draw();
    return { stop: () => clearInterval(iv), timeout: () => api.finish(evaluate()) };
  }
};

        if (!E && !S.type) return say('Choose a test type first.');

    const fmtP = p => p >= 1 ? p.toFixed(0) + ' mbar' : (() => { const ex = Math.floor(Math.log10(p)); return (p / 10 ** ex).toFixed(1) + '×10' + String(ex).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]) + ' mbar'; })();
    const piv = setInterval(() => {

    }, 100);
    /* chart */
    const cv = $('#t-chart', el);
    function profile() {
      const cyc = E ? 2 : S.cyc, dw = E ? 2 : S.dwell, ramp = 1.5, segs = [[0, 22]];
      let t = ramp;
      for (let i = 0; i < cyc; i++) { segs.push([t, S.hot]); t += dw; segs.push([t, S.hot]); t += ramp * 2; segs.push([t, S.cold]); t += dw; segs.push([t, S.cold]); t += ramp * 2; }
      segs[segs.length - 1] = segs[segs.length - 1]; segs.push([t - ramp, 22]);

    }
    function drawChart(prog) {
      const r = cv.getBoundingClientRect(); if (!r.width) return;
      const dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr;
      const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = r.width, Hh = r.height, padL = 40, padR = 10, padT = 12, padB = 22;
      const segs = profile(); const tMax = segs[segs.length - 1][0];

      const X = t => padL + t / tMax * (W - padL - padR), Y = v => padT + (hi - v) / (hi - lo) * (Hh - padT - padB);

      if (E) { c.fillStyle = 'rgba(255,107,107,.12)'; c.fillRect(padL, Y(hi), W - padL - padR, Y(60) - Y(hi)); c.fillRect(padL, Y(-30), W - padL - padR, Y(lo) - Y(-30)); }
      c.fillStyle = '#8b96b6'; c.fillText('0 h', padL, Hh - 6); c.textAlign = 'right'; c.fillText(tMax.toFixed(0) + ' h', W - padR, Hh - 6); c.textAlign = 'left';
      c.strokeStyle = '#ffb547'; c.lineWidth = 1.5; c.setLineDash([4, 3]); c.beginPath(); segs.forEach(([t, v], i) => i ? c.lineTo(X(t), Y(v)) : c.moveTo(X(t), Y(v))); c.stroke(); c.setLineDash([]);

        c.strokeStyle = '#a880ff'; c.lineWidth = 2; c.beginPath(); let tc = 22; const tEnd = tMax * prog; const dt = tMax / 400;

        c.stroke(); $('#t-tc', el).textContent = (tc > 0 ? '+' : '') + tc.toFixed(1) + ' °C';

      notes.push({ ok: okProc, t: okProc ? 'Procedure in order: load, seal, pump down, then test only once at vacuum.' : `Procedure had ${api.mistakes()} out-of-order step${api.mistakes() === 1 ? '' : 's'}. Air in the chamber carries heat by convection, so a test before vacuum does not represent space.` });
      const pt = (ok, good, bad) => { max++; if (ok) pts++; notes.push({ ok, t: ok ? good : bad }); };

      }

      return { acc, notes };
    }
    requestAnimationFrame(() => drawChart(0));
    const onR = () => drawChart(S.running ? 1 : 0); window.addEventListener('resize', onR);
    return { stop: () => { clearInterval(piv); cancelAnimationFrame(raf); window.removeEventListener('resize', onR); }, timeout: () => api.finish(evaluate(true)) };
  }
};

/* =====================================================================
   GAME 6 · BINARY BLASTER (CDHS Software)
   ===================================================================== */
const hex2 = n => '0x' + n.toString(16).toUpperCase().padStart(2, '0');
const bin = (n, w) => n.toString(2).padStart(w, '0').replace(/\B(?=(\d{4})+$)/g, ' ');
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const binary = {
  id: 'binary', mod: 'sw', kind: 'Checkpoint', title: 'Binary Blaster', module: 'CDHS Software',
  covers: { sw: ['2', '3', '7'] },
  blurb: 'Numbers fall toward the flight computer. Convert binary to decimal before they land. Engineers add hex and real I²C addresses.',
  lesson: { explorer: 'CDHS Software › 3 Binary to decimal', engineer: 'CDHS Software › 2 Binary to hex · 3 Binary to decimal · 7 Addresses' },
  time: { explorer: 45, engineer: 60 },
  brief(m) {
    return m === 'explorer' ? {
      scenario: 'Binary numbers are dropping toward the flight computer. Each bit is worth a power of two. Add up the place values of the bits that are 1, then tap the matching decimal before the number lands.',
      goals: ['8 numbers, growing from 4 bits to 8 bits', 'Use the place values printed under each number (… 8 4 2 1)', 'A number that reaches the computer counts as a miss']
    } : {
      scenario: 'The flight computer works in binary, while datasheets and code use hex. Convert quickly and accurately: one wrong I²C address and the sensor never answers.',
      goals: ['10 numbers: binary → decimal, binary → hex, hex → binary and 7-bit I²C addresses', 'For hex, group the bits in fours starting from the right', 'For a 7-bit address, add a leading 0 to make 8 bits, then convert']
    };
  },
  mount(el, api) {
    const E = api.mode === 'explorer';
    const FALL = E ? 5.5 : 7;
    const ADDR = [[0x68, 'IMU (MPU-6050)'], [0x40, 'current sensor (INA219)'], [0x76, 'pressure sensor (BME280)'], [0x1E, 'magnetometer (HMC5883L)'], [0x3C, 'OLED display'], [0x50, 'FRAM chip']];
    const R = [];
    if (E) [4, 4, 4, 6, 6, 6, 8, 8].forEach(w => R.push({ type: 'b2d', w, n: rnd(w === 4 ? 3 : 1 << (w - 2), (1 << w) - 1) }));
    else {
      const ad = shuffle(ADDR); let ai = 0;
      shuffle(['b2d', 'b2d', 'b2d', 'b2h', 'b2h', 'b2h', 'h2b', 'h2b', 'addr', 'addr']).forEach(t => {
        if (t === 'addr') { const [n, nm] = ad[ai++]; R.push({ type: t, w: 7, n, nm }); } else R.push({ type: t, w: 8, n: rnd(17, 254) });
      });
    }
    const fmt = (r, v) => r.type === 'b2d' ? String(v) : r.type === 'h2b' ? bin(v, 8) : hex2(v);
    const prompt = r => r.type === 'h2b' ? hex2(r.n) : bin(r.n, r.w);
    const ask = r => ({ b2d: 'What is it in decimal?', b2h: 'What is it in hex?', h2b: 'What is it in binary?', addr: `The ${r.nm} datasheet gives this 7-bit address. What do you write in Wire.beginTransmission()?` })[r.type];
    const cap = r => ({ b2d: 'binary', b2h: 'binary', h2b: 'hex', addr: '7-bit I²C address' })[r.type];
    function options(r) {
      const max = (1 << Math.max(r.w, 8)) - 1, s = new Set([r.n]), c = [];
      for (let k = 0; k < r.w; k++) c.push(r.n ^ (1 << k));
      if (r.type !== 'b2d') c.push(((r.n & 15) << 4) | (r.n >> 4), ((r.n & 15) << 4) | (r.n >> 4));
      else c.push(r.n + 1, r.n - 1, r.n + 2);
      for (const v of shuffle(c)) { if (s.size >= 4) break; if (v >= 0 && v <= max) s.add(v); }
      while (s.size < 4) s.add(rnd(1, max));
      return shuffle([...s]);
    }
    function explain(r) {
      if (r.type === 'b2d') { const p = []; for (let k = r.w - 1; k >= 0; k--) if (r.n >> k & 1) p.push(1 << k); return `${bin(r.n, r.w)} → ${p.join(' + ')} = ${r.n}`; }
      const H = (r.n >> 4).toString(16).toUpperCase(), L = (r.n & 15).toString(16).toUpperCase();
      if (r.type === 'b2h') return `${bin(r.n >> 4, 4)} = ${H}, ${bin(r.n & 15, 4)} = ${L} → ${hex2(r.n)}`;
      if (r.type === 'h2b') return `${H} = ${bin(r.n >> 4, 4)}, ${L} = ${bin(r.n & 15, 4)} → ${bin(r.n, 8)}`;
      return `${bin(r.n, 7)} → pad to 8 bits: ${bin(r.n, 8)} → ${hex2(r.n)}`;
    }
