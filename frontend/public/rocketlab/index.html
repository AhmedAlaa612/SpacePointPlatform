  s_hazards() { const n = R2S_HAZ.filter((h, i) => this.st.hz[i] === 0).length; return `<p class="lede">For each hazard, choose the mitigation a review board would accept. You need 5 of 6.</p>${this.mcq(R2S_HAZ, this.st.hz, 'hz')}<p class="muted" style="font-size:11.5px">${n} of ${R2S_HAZ.length} accepted.</p><div class="btnrow"><button class="btn primary" data-r2sub="calc">Calculations ›</button></div>`; },
  calcQs() {

      { k: 'sf', q: `Burst safety factor of the run tank: burst pressure ÷ MEOP (${D.tankMEOP} bar). The requirement is ≥ ${this.Q.sfBurst}.`, u: '', ans: tk.burst / 1e5 / D.tankMEOP, f: 'SF = P_b / MEOP' },
      { k: 'hoop', q: `Hoop stress in the motor case at its MEOP (${D.chMEOP} bar): ${D.caseD} mm outer diameter, ${D.caseT} mm wall. σ = P · r / t, in MPa.`, u: 'MPa', ans: D.chMEOP * 1e5 * (r / 1000) / (t / 1000) / 1e6, f: 'σ = P · r / t' }

  s_calc() {

      ${this.calcQs().map((c) => { const a = this.st.calc[c.k] || {}; return `<div class="card"><p class="bq" style="margin:0 0 6px">${esc(c.q)}</p><div class="r2ans"><input type="number" step="any" data-r2calc="${c.k}" value="${a.v ?? ''}" ${a.ok ? 'disabled' : ''} placeholder="answer"> <span class="muted">${c.u}</span><button class="btn small" data-r2calcgo="${c.k}" ${a.ok ? 'disabled' : ''}>Check</button></div>

  s_gate() {

    return `<p class="lede">The range safety officer will only allow a hot fire when every item is green. Changing the design or the stand after approval cancels it.</p>
      <div class="r2gate">${G.items.map((i) => `<div class="${i.ok ? 'ok' : 'bad'}"><i></i><b>${i.n}</b><span>${i.v}</span></div>`).join('')}</div>

  },
  coldPanel() {
    const C = this.st.cold, cf = R2S_COLD.data(), a = C.ans;
    const row = (k, l, u, hint) => { const s = a[k] || {}; return `<div class="card"><p class="bq" style="margin:0 0 6px">${l}</p><div class="r2ans"><input type="number" step="any" data-r2cold="${k}" value="${s.v ?? ''}" ${s.ok ? 'disabled' : ''}> <span class="muted">${u}</span><button class="btn small" data-r2coldgo="${k}" ${s.ok ? 'disabled' : ''}>Check</button></div>${s.ok ? `<div class="note good" style="font-size:11.6px">✓ ${fmt(R2S_COLD.answer(k), k === 'Cd' ? 3 : 3)} ${u}</div>` : s.tries ? `<div class="note warn" style="font-size:11.6px">Not within 4 %. ${hint}${s.tries >= 3 ? ` <button class="linkbtn" data-r2coldshow="${k}">Show the answer</button>` : ''}</div>` : ''}</div>`; };

    const uc = $('[data-r2usecd]'); if (uc) uc.onclick = () => { st.cold.assumed = D.Cd; D.Cd = +R2S_COLD.answer('Cd').toFixed(3); st.cold.used = true; this.save(); this.keep(); toast('Design updated with the measured Cd'); };

      <h3>Formula sheet</h3><div class="beq sm">ṁ_ox = N·C_d·A·√(2ρΔP)</div><div class="beq sm">r = a·G_ox^n,  G_ox = ṁ_ox / A_port</div><div class="beq sm">Pc = ṁ·c* / A_t</div><div class="beq sm">F = C_F·Pc·A_t</div><div class="beq sm">I_sp = I / (m_prop·g₀)</div><div class="beq sm">P_burst = σ_UTS·t / r</div>`;
  }
};
/* =====================================================================
   Race 2 Space — 2-D stage (cutaway, charts, P&ID, gate), cold flow,
   data analysis and report generation
   ===================================================================== */
function r2sNice(v) { if (!(v > 0)) return 1; const e = 10 ** Math.floor(Math.log10(v)), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function r2sPlot(c, X, Y, W, H, o) {
  c.save(); c.fillStyle = '#0f161e'; c.fillRect(X, Y, W, H); c.strokeStyle = '#233242'; c.lineWidth = 1; c.strokeRect(X + 0.5, Y + 0.5, W - 1, H - 1);
  const pl = X + 46, pr = X + W - 10, pt = Y + 24, pb = Y + H - 22;
  let ymax = o.ymax, xmax = o.xmax;
  if (ymax == null) { ymax = 0; o.series.forEach((s) => s.y.forEach((v, i) => { if (s.t[i] <= (xmax ?? 1e9) && isFinite(v)) ymax = Math.max(ymax, v); })); (o.hl || []).forEach((h) => ymax = Math.max(ymax, h.y)); ymax = r2sNice(ymax * 1.08 || 1); }
  if (xmax == null) { xmax = 0; o.series.forEach((s) => { if (s.t.length) xmax = Math.max(xmax, s.t[s.t.length - 1]); }); xmax = r2sNice(xmax || 1); }
  const ystep = r2sNice(ymax / 4.2); ymax = Math.ceil(ymax / ystep - 1e-9) * ystep;
  const xs = (t) => pl + (t / xmax) * (pr - pl), ys = (v) => pb - (v / ymax) * (pb - pt);
  c.font = '10px "IBM Plex Mono", monospace'; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let v = 0; v <= ymax + 1e-9; v += ystep) { const y = ys(v); c.strokeStyle = '#1a2633'; c.beginPath(); c.moveTo(pl, y); c.lineTo(pr, y); c.stroke(); c.fillStyle = '#5a6b7d'; c.fillText(v.toFixed(ystep < 1 ? (ystep < 0.1 ? 2 : 1) : 0), pl - 5, y); }
  c.textAlign = 'center'; c.textBaseline = 'top'; const xstep = r2sNice(xmax / 6);
  for (let t = 0; t <= xmax + 1e-9; t += xstep) { const x = xs(t); c.strokeStyle = '#1a2633'; c.beginPath(); c.moveTo(x, pt); c.lineTo(x, pb); c.stroke(); c.fillStyle = '#5a6b7d'; c.fillText(t.toFixed(xstep < 1 ? 1 : 0), x, pb + 5); }
  (o.band || []).forEach((b) => { c.fillStyle = b.col || 'rgba(104,195,230,0.08)'; c.fillRect(xs(b.a), pt, xs(b.b) - xs(b.a), pb - pt); });
  (o.hl || []).forEach((h) => { const y = ys(h.y); c.strokeStyle = h.col; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(pl, y); c.lineTo(pr, y); c.stroke(); c.setLineDash([]); c.fillStyle = h.col; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText(h.lab, pr - 2, y - 2); });

  c.restore();
  c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = '#d8e1ea'; c.font = '600 11px "IBM Plex Sans", sans-serif'; c.fillText(o.title, X + 10, Y + 15);
  c.font = '10px "IBM Plex Mono", monospace'; c.fillStyle = '#8193a6'; c.fillText(o.unit, X + 10 + c.measureText(o.title).width * 1.08 + 6, Y + 15);
  let lx = pr; c.textAlign = 'right'; o.series.slice().reverse().forEach((s) => { if (!s.lab) return; c.fillStyle = s.col; c.fillText(s.lab, lx, Y + 15); lx -= c.measureText(s.lab).width + 14; });

/* ---------------- motor + tank cutaway (to scale) ---------------- */
function r2sDrawMotor(c, X, Y, W, H, D, sim) {
  const tankID = D.tankD - 2 * D.tankT, Lt = (D.Vt / 1e3) / (Math.PI * (tankID / 2e3) ** 2) * 1e3;
  const cid = D.caseD - 2 * D.caseT, pre = D.prepost ? 0.5 * D.Dg : 8, post = D.prepost ? 0.8 * D.Dg : 8, conv = Math.max(4, (cid / 2 - D.Dt / 2)), div = Math.max(3, (D.De - D.Dt) / 2 / Math.tan(15 * Math.PI / 180));
  const Lm = 25 + pre + D.Lg + post + conv + div, gap = 0.5 * Math.max(D.tankD, D.caseD) + 160;
  const tot = Lt + D.tankD * 0.5 + gap + Lm, hmax = Math.max(D.tankD, D.caseD, D.De);
  const k = Math.min((W - 40) / tot, (H - 46) / hmax), cy = Y + H / 2 + 6; let x = X + 20 + (W - 40 - tot * k) / 2;
  c.save(); c.lineWidth = 1;
  // tank (horizontal capsule)
  const tr = D.tankD / 2 * k, tl = (Lt + D.tankD * 0.5) * k;
  const capsule = (x0, len, r) => { c.beginPath(); c.moveTo(x0 + r, cy - r); c.lineTo(x0 + len - r, cy - r); c.arc(x0 + len - r, cy, r, -Math.PI / 2, Math.PI / 2); c.lineTo(x0 + r, cy + r); c.arc(x0 + r, cy, r, Math.PI / 2, Math.PI * 1.5); c.closePath(); };
  capsule(x, tl, tr); c.fillStyle = '#3a4756'; c.fill(); capsule(x + D.tankT * k, tl - 2 * D.tankT * k, tr - D.tankT * k); c.fillStyle = '#121b25'; c.fill();
  c.save(); capsule(x + D.tankT * k, tl - 2 * D.tankT * k, tr - D.tankT * k); c.clip(); const fl = Math.max(0, Math.min(1, 1 - sim.ull)); const lvl = cy + (tr - D.tankT * k) - fl * 2 * (tr - D.tankT * k);
  c.fillStyle = 'rgba(104,195,230,0.55)'; c.fillRect(x, lvl, tl, cy + tr - lvl); c.fillStyle = 'rgba(200,225,240,0.10)'; c.fillRect(x, cy - tr, tl, lvl - cy + tr); c.restore();
  c.fillStyle = '#d8e1ea'; c.font = '10.5px "IBM Plex Mono", monospace'; c.textAlign = 'center'; c.fillText(`RUN TANK · ${fmt(D.Vt, 1)} L · ${fmt(D.mox, 1)} kg N₂O · ullage ${fmt(sim.ull * 100, 0)} %`, x + tl / 2, cy - tr - 8);
  x += tl;
  // feed line with valve
  const lx = x + gap * k; c.strokeStyle = '#8193a6'; c.lineWidth = Math.max(2, 8 * k); c.beginPath(); c.moveTo(x, cy); c.lineTo(lx, cy); c.stroke(); c.lineWidth = 1;
  const vx = x + gap * k / 2, vs = Math.max(6, 14 * k); c.fillStyle = '#f0a23b'; c.beginPath(); c.moveTo(vx - vs, cy - vs * 0.7); c.lineTo(vx + vs, cy + vs * 0.7); c.lineTo(vx + vs, cy - vs * 0.7); c.lineTo(vx - vs, cy + vs * 0.7); c.closePath(); c.fill();
  c.fillStyle = '#8193a6'; c.fillText('main valve', vx, cy - vs - 6);
  x = lx;
  // motor case
  const cr = D.caseD / 2 * k, ir = cid / 2 * k, caseL = (25 + pre + D.Lg + post) * k;
  c.fillStyle = '#4a5866'; c.fillRect(x, cy - cr, caseL, 2 * cr); c.fillStyle = '#1b130c'; c.fillRect(x + 25 * k, cy - ir, caseL - 25 * k, 2 * ir);
  c.fillStyle = '#6d7b88'; c.fillRect(x, cy - ir, 25 * k, 2 * ir); // injector bulkhead
  c.strokeStyle = '#c7aaff'; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(x + 25 * k, cy + i * ir * 0.25); c.lineTo(x + 25 * k + 14 * k + 6, cy + i * ir * 0.3); c.stroke(); }
  const gx = x + (25 + pre) * k, gr = D.Dg / 2 * k, pr0 = D.Dp0 / 2 * k, prf = Math.min(gr, (sim.Dp.length ? sim.Dp[sim.Dp.length - 1] : D.Dp0) / 2 * k);
  c.fillStyle = '#c58b3c'; c.fillRect(gx, cy - gr, D.Lg * k, 2 * gr); c.fillStyle = '#e1a85a'; c.fillRect(gx, cy - gr, D.Lg * k, (gr - pr0) * 0.25);
  c.fillStyle = '#1b130c'; c.fillRect(gx, cy - pr0, D.Lg * k, 2 * pr0);
  c.strokeStyle = 'rgba(240,162,59,0.9)'; c.setLineDash([4, 3]); c.strokeRect(gx, cy - prf, D.Lg * k, 2 * prf); c.setLineDash([]);
  c.fillStyle = '#d8e1ea'; c.fillText(`${R2S_FUELS[D.fuel].n.toUpperCase()} GRAIN · ${D.Lg} mm · port ${D.Dp0} → ${fmt(prf * 2 / k, 0)} mm`, gx + D.Lg * k / 2, cy - cr - 8);
  x += caseL;
  // nozzle
  const tr2 = D.Dt / 2 * k, er = D.De / 2 * k;
  c.fillStyle = '#2b2f35'; c.beginPath(); c.moveTo(x, cy - cr); c.lineTo(x + conv * k, cy - tr2 - 4 * k); c.lineTo(x + (conv + div) * k, cy - er - 3 * k); c.lineTo(x + (conv + div) * k, cy + er + 3 * k); c.lineTo(x + conv * k, cy + tr2 + 4 * k); c.lineTo(x, cy + cr); c.closePath(); c.fill();
  c.fillStyle = '#0b1118'; c.beginPath(); c.moveTo(x, cy - ir); c.lineTo(x + conv * k, cy - tr2); c.lineTo(x + (conv + div) * k, cy - er); c.lineTo(x + (conv + div) * k, cy + er); c.lineTo(x + conv * k, cy + tr2); c.lineTo(x, cy + ir); c.closePath(); c.fill();
  c.fillStyle = '#8193a6'; c.textAlign = 'right'; c.fillText(`throat ${D.Dt} mm · exit ${D.De} mm · ε ${fmt(sim.eps, 2)}`, x + (conv + div) * k, cy + Math.max(cr, er) + 30);
  c.textAlign = 'center'; c.fillText(`case ${D.caseD} × ${D.caseT} mm · ${R2S_MATS[D.caseMat].n}`, x - caseL / 2, cy + cr + 14);
  c.textAlign = 'left'; c.fillStyle = '#5a6b7d'; c.fillText('dashed: port at burnout', X + 12, Y + H - 8);
  c.restore();
}

/* ---------------- cold flow ---------------- */
const R2S_COLD = {
  anim: 0, _k: '', _d: null,
  data() {
    const st = R2S.st, D = st.D, tr = st.truth, k = JSON.stringify([D.mox, D.Vt, D.nInj, D.dInj, D.dpLine, st.Q.Tday, tr]); if (k === this._k) return this._d;
    const rnd = r2sRng(tr.seed + 17), T0 = st.Q.Tday + tr.dT, A = D.nInj * Math.PI * (D.dInj / 2000) ** 2;
    let T = T0 + 273.15, m = D.mox; const t = [], M = [], Pm = [], Pt = [], TT = [];
    for (let i = 0; i <= 450; i++) {
      const tt = i * 0.01, open = tt >= 0.3 && m > 0.15, P = n2oPvap(T), rho = n2oRhoL(T);
      let md = 0, pman = 1.01325e5; if (open) { const dp0 = P - 1.01325e5; md = tr.Cd * A * Math.sqrt(2 * rho * Math.max(0, dp0 - D.dpLine * 1e5)); pman = P - D.dpLine * 1e5; }
      t.push(tt); M.push(m); Pm.push(pman / 1e5); Pt.push(P / 1e5); TT.push(T);
      if (open) { const dm = md * 0.01; m -= dm; T -= dm * n2oRhoV(T) / rho * n2oHv(T) / (Math.max(0.2, m) * N2O_CPL); }
    }
    const table = []; for (let s = 0; s <= 4.0001; s += 0.5) { const i = Math.round(s * 100); table.push([s, M[i] + (rnd() - 0.5) * 0.004, Pm[i] + (rnd() - 0.5) * 0.06]); }
    const flowEnd = t[M.findIndex((v) => v <= 0.16)] || 4.5, ta = 1.0, tb = Math.max(1.5, Math.min(3.0, Math.floor((flowEnd - 0.2) * 2) / 2));
    const Tw = TT.slice(Math.round(ta * 100), Math.round(tb * 100) + 1), Tm = Tw.reduce((a, b) => a + b, 0) / Tw.length;
    this._d = { t, M, Pm, Pt, table, T: Tm - 273.15, rho: n2oRhoL(Tm), A, ta, tb }; this._k = k; return this._d;
  },
  answer(k) {
    const d = this.data(), D = R2S.D, rows = d.table.filter((r) => r[0] >= d.ta - 1e-9 && r[0] <= d.tb + 1e-9), a = rows[0], b = rows[rows.length - 1];
    const md = (a[1] - b[1]) / (b[0] - a[0]); if (k === 'mdot') return md;
    const dP = (rows.reduce((s, r) => s + r[2], 0) / rows.length - 1.01325) * 1e5; return md / (D.nInj * Math.PI * (D.dInj / 2000) ** 2 * Math.sqrt(2 * d.rho * dP));
  },
  draw(c, W, H) {
    const d = this.data(), done = R2S.st.cold.done; const el = done ? (this.anim ? Math.min(4.5, (performance.now() - this.anim) / 1000) : 4.5) : 0;
    const n = Math.max(1, Math.round(el * 100)), cut = (a) => a.slice(0, n);
    const half = (H - 20) / 2;
    r2sPlot(c, 10, 10, W - 20, half - 5, { title: 'Run-tank mass', unit: 'kg (tank load cell)', xmax: 4.5, ymax: r2sNice(R2S.D.mox * 1.1), series: [{ t: cut(d.t), y: cut(d.M), col: '#c7aaff', lab: 'measured' }], band: done ? [{ a: d.ta, b: d.tb }] : [] });
    r2sPlot(c, 10, 15 + half, W - 20, half - 5, { title: 'Pressures', unit: 'bar', xmax: 4.5, ymax: r2sNice(Math.max(...d.Pt) * 1.1), series: [{ t: cut(d.t), y: cut(d.Pt), col: '#8193a6', lab: 'run tank', dash: [4, 3] }, { t: cut(d.t), y: cut(d.Pm), col: '#f0a23b', lab: 'injector manifold' }], band: done ? [{ a: d.ta, b: d.tb }] : [] });
    if (!done) { c.fillStyle = 'rgba(11,17,24,0.6)'; c.fillRect(0, 0, W, H); c.fillStyle = '#d8e1ea'; c.font = '13px "IBM Plex Sans", sans-serif'; c.textAlign = 'center'; c.fillText('Press “Run the cold-flow test” to record data', W / 2, H / 2); }
    return el < 4.5 && done;
  }
};

/* ---------------- stage dispatcher ---------------- */
const R2S_STAGE = {

    if (!this.ro) { this.ro = new ResizeObserver(() => this.draw()); this.ro.observe($('#stage')); }
    cancelAnimationFrame(this.raf);
    if (stage === 'brief') host.innerHTML = top + `<div class="r2sbody">${this.systemSVG()}</div>`;
    else if (stage === 'pid') host.innerHTML = top + `<div class="r2sbody">${this.pidSVG()}</div>`;
    else if (stage === 'safety') host.innerHTML = top + `<div class="r2sbody">${this.gateBoard()}</div>`;
    else if (stage === 'report') { if (soft && $('#r2rep')) { this.report(true); return; } host.innerHTML = top + `<div class="r2sbody r2repwrap"><iframe id="r2rep" title="Report preview"></iframe></div>`; this.report(); return; }
    else { host.innerHTML = top + '<canvas id="r2cv"></canvas>'; this.draw(); }
  },
  draw() {
    if (S.module !== 'r2s') return; const cv = $('#r2cv'); if (!cv) return;

    if (cv.width !== Math.round(W * d) || cv.height !== Math.round(H * d)) { cv.width = Math.round(W * d); cv.height = Math.round(H * d); }
    const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.fillStyle = '#0b1118'; c.fillRect(0, 0, W, H);

    return `<!doctype html><html><head><meta charset="utf-8"><title>Race 2 Space hybrid motor report — ${esc(st.team || 'Team')}</title><style>

      <h1>Hybrid rocket motor — design, safety case and static-fire report</h1><p class="meta">${esc(st.team || 'Team name')} · Race 2 Space pathway (hybrid track) · ${today} · generated with RocketLab 3D</p>

      <h2>Abstract</h2><p>We designed a ${R2S_FUELS[D.fuel].n.toLowerCase()} / nitrous-oxide hybrid motor with a predicted total impulse of ${fmt(s.I, 0)} N·s (class ${r2sClass(s.I)}), ${fmt(s.Favg, 0)} N average thrust and a ${fmt(s.tb, 1)} s burn at a peak chamber pressure of ${fmt(s.PcMax / 1e5, 1)} bar.${A ? ` In static-fire test #${run.n} the motor delivered ${fmt(A.I, 0)} N·s (${pct(A.I, A.pI)} versus prediction) with a measured specific impulse of ${fmt(A.Isp, 0)} s${A.eff ? ` and a c* efficiency of ${fmt(A.eff * 100, 0)} %` : ''}.` : ' The motor has not yet been fired.'}</p>

      <table><tr><th>Predicted performance</th><th>Value</th></tr>${row('Total impulse', `${fmt(s.I, 0)} N·s (${r2sClass(s.I)})`)}${row('Peak / average thrust', `${fmt(s.Fmax, 0)} / ${fmt(s.Favg, 0)} N`)}${row('Burn time', `${fmt(s.tb, 2)} s`)}${row('Peak chamber pressure', `${fmt(s.PcMax / 1e5, 1)} bar`)}${row('Specific impulse', `${fmt(s.Isp, 0)} s`)}${row('Average O/F', fmt(s.OFavg, 2))}${row('Initial G_ox', `${fmt(s.G0, 0)} kg/m²·s`)}${row('Injector stiffness', `${fmt(s.stiff0 * 100, 0)} %`)}</table>
      <p class="meta">Model: quasi-steady 0-D hybrid with saturated N₂O blow-down (ESDU 91022 property fits), single-orifice injector law, r = a·G_ox^n regression, c*(O/F) curve and isentropic nozzle with C_F efficiency 0.95.</p>
      <h2>3. Test stand</h2><p>Fitted: ${R2S_PID.filter((c) => st.pid[c.id]).map((c) => c.n).join('; ')}.</p>${R2S_PID.filter((c) => c.req && !st.pid[c.id]).length ? `<p class="fail">Missing required items: ${R2S_PID.filter((c) => c.req && !st.pid[c.id]).map((c) => c.n).join('; ')}.</p>` : ''}
      <h2>4. Safety case</h2><table><tr><th>Item</th><th>Status</th></tr>${G.items.map((i) => `<tr><td>${i.n}</td><td class="${i.ok ? 'ok' : 'fail'}">${i.v}</td></tr>`).join('')}<tr><td>Firing approval</td><td class="${R2S.approved() ? 'ok' : 'fail'}">${R2S.approved() ? 'GO' : 'not approved for the current design'}</td></tr></table>
      <table><tr><th>Hazard</th><th>Mitigation</th></tr>${R2S_HAZ.map((h) => row(h.h, h.o[0])).join('')}</table>
      <table><tr><th>Compliance check</th><th>Value</th><th>Requirement</th></tr>${C.map((c) => `<tr><td>${esc(c.label)}</td><td class="${c.sev}">${esc(c.val)}</td><td>${esc(c.need)}</td></tr>`).join('')}</table>
      <h2>5. Cold-flow test</h2><p>${st.cold.ans.Cd && st.cold.ans.Cd.ok ? `The injector discharge coefficient was measured as C_d = ${fmt(R2S_COLD.answer('Cd'), 3)} (mass flow ${fmt(R2S_COLD.answer('mdot'), 3)} kg/s), compared with ${fmt(st.cold.used ? st.cold.assumed : D.Cd, 2)} assumed in the initial design.` : 'Not completed.'}</p>
      <h2>6. Static-fire tests</h2>${st.runs.length ? `<table><tr><th>#</th><th>Outcome</th><th>Notes</th></tr>${st.runs.map((r) => `<tr><td>${r.n}</td><td>${esc(r.title)}</td><td>${esc(r.why)}</td></tr>`).join('')}</table>` : '<p>No hot fires yet.</p>'}

        <tr><td>Total impulse (N·s)</td><td>${fmt(A.pI, 0)}</td><td>${fmt(A.I, 0)}</td><td>${pct(A.I, A.pI)}</td></tr><tr><td>Burn time (s)</td><td>${fmt(A.ptb, 2)}</td><td>${fmt(A.tb, 2)}</td><td>${pct(A.tb, A.ptb)}</td></tr>
        <tr><td>Average thrust (N)</td><td>${fmt(A.pFavg, 0)}</td><td>${fmt(A.Favg, 0)}</td><td>${pct(A.Favg, A.pFavg)}</td></tr><tr><td>Peak chamber pressure (bar)</td><td>${fmt(A.pPc, 1)}</td><td>${A.PcMax ? fmt(A.PcMax, 1) : '—'}</td><td>${A.PcMax ? pct(A.PcMax, A.pPc) : '—'}</td></tr>
        <tr><td>Specific impulse (s)</td><td>${fmt(A.pIsp, 0)}</td><td>${fmt(A.Isp, 0)}</td><td>${pct(A.Isp, A.pIsp)}</td></tr><tr><td>c* (m/s)</td><td>—</td><td>${A.cstar ? fmt(A.cstar, 0) : '—'}</td><td>${A.eff ? 'η = ' + fmt(A.eff * 100, 0) + ' %' : '—'}</td></tr></table>
        <p class="meta">Propellant consumed: ${fmt(A.mox, 3)} kg N₂O + ${fmt(A.mf, 3)} kg fuel (O/F ${fmt(A.OF, 2)}).</p>` : ''}
      <h2>8. Lessons learned</h2><p>${esc(st.rep.lessons || '—').replace(/\n/g, '<br>')}</p><h2>9. Next steps</h2><p>${esc(st.rep.next || '—').replace(/\n/g, '<br>')}</p></body></html>`;
  },
  report(soft) { const f = $('#r2rep'); if (!f) return; f.srcdoc = this.reportDoc(); },
  slides() {
    const st = R2S.st, D = st.D, s = R2S.pred(), run = R2S_AN.run(), A = run ? R2S_AN.results(run) : null;
    return `# ${st.team || 'Team'} — Hybrid motor (Race 2 Space)\n\n## 1. Mission & requirements\n- ${R2S_REQ_FIELDS.slice(0, 4).map(([k, l, u]) => `${l}: ${st.Q[k]} ${u}`).join('\n- ')}\n${st.Q.official ? '' : '- (placeholder limits — replace with handbook values)\n'}\n## 2. Concept\n- ${R2S_FUELS[D.fuel].n} grain + self-pressurising N₂O\n- Why a hybrid: separated propellants, throttle/shut-down by valve\n\n## 3. Design\n- ${D.mox} kg N₂O in ${D.Vt} L tank; ${D.nInj} × ${D.dInj} mm injector\n- Grain ${D.Lg} × ${D.Dg} mm, port ${D.Dp0} mm; throat ${D.Dt} mm, ε ${fmt(s.eps, 2)}\n- Predicted ${fmt(s.I, 0)} N·s (${r2sClass(s.I)}), ${fmt(s.Favg, 0)} N avg, ${fmt(s.tb, 1)} s, Pc ${fmt(s.PcMax / 1e5, 1)} bar\n\n## 4. Test stand & P&ID\n- ${R2S_PID.filter((c) => st.pid[c.id]).map((c) => c.n).join('\n- ')}\n\n## 5. Safety case\n- Hazards & mitigations, vessel calcs (burst SF), firing procedure, review board\n\n## 6. Cold flow\n- ${st.cold.ans.Cd && st.cold.ans.Cd.ok ? `Measured C_d ${fmt(R2S_COLD.answer('Cd'), 3)} vs assumed ${fmt(st.cold.used ? st.cold.assumed : D.Cd, 2)}` : 'not completed'}\n\n## 7. Hot fire\n- ${st.runs.map((r) => `#${r.n}: ${r.title}`).join('\n- ') || 'no tests yet'}\n${A ? `- Measured ${fmt(A.I, 0)} N·s, Isp ${fmt(A.Isp, 0)} s${A.eff ? `, c* efficiency ${fmt(A.eff * 100, 0)} %` : ''}\n` : ''}\n## 8. Lessons & next steps\n- ${(st.rep.lessons || '…').split('\n').join('\n- ')}\n- ${(st.rep.next || '…').split('\n').join('\n- ')}\n`;

/* ---------------- data analysis ---------------- */
const R2S_AN = {
  up: null,
  run() { const st = R2S.st, L = st.runs.filter((r) => r.data); if (!L.length) return null; return L.find((r) => r.n === st.an.run) || L[L.length - 1]; },
  _c: new Map(),
  results(run) {
    const ck = R2S.st.truth.seed + ':' + run.n; if (this._c.has(ck)) return this._c.get(ck); const d = R2S_HOT.runData(run), m = d.meta, p = r2sSim(run.D);
    let I = 0, IPc = 0; const F = d.F || [], Pc = d.Pc || [];
    for (let i = 1; i < d.t.length; i++) { const h = d.t[i] - d.t[i - 1]; if (d.F) I += 0.5 * (F[i] + F[i - 1]) * h; if (d.Pc) IPc += 0.5 * (Pc[i] + Pc[i - 1]) * 1e5 * h; }
    const fm = Math.max(0, ...F), on = d.t.filter((_, i) => F[i] >= 0.1 * fm), tb = on.length ? on[on.length - 1] - on[0] : 0;
    const mox = m.moxLoaded - m.moxResidual, mf = m.grainBefore - m.grainAfter, mp = mox + mf, OF = mf > 0 ? mox / mf : 0, cstar = d.Pc && mp > 0 ? m.At * IPc / mp : 0, cth = r2sCstar(run.D.fuel, OF);
    const out = { I, tb, Favg: tb ? I / tb : 0, Fmax: fm, PcMax: d.Pc ? Math.max(...Pc) : 0, mox, mf, mp, OF, Isp: mp ? I / (mp * G0) : 0, cstar, cth, eff: cstar ? cstar / cth : 0, pI: p.I, ptb: p.tb, pFavg: p.Favg, pPc: p.PcMax / 1e5, pIsp: p.Isp, hasF: !!d.F, hasPc: !!d.Pc };
    this._c.set(ck, out); return out;
  },
  Q() { return [
    { k: 'I', l: 'Total impulse I = ∫F dt (trapezium rule over the whole record)', u: 'N·s', tol: 0.03, need: 'hasF' },
    { k: 'tb', l: 'Burn time: from first to last sample above 10 % of peak thrust', u: 's', tol: 0.05, need: 'hasF' },
    { k: 'Favg', l: 'Average thrust over the burn time, I / t_b', u: 'N', tol: 0.05, need: 'hasF' },
    { k: 'Isp', l: 'Specific impulse I_sp = I / (m_prop · g₀) using both propellant masses', u: 's', tol: 0.04, need: 'hasF' },
    { k: 'cstar', l: 'Characteristic velocity c* = A_t · ∫Pc dt / m_prop', u: 'm/s', tol: 0.05, need: 'hasPc' },
    { k: 'eff', l: 'c* efficiency η = c*_measured / c*_theory (theory value at your average O/F is given)', u: '', tol: 0.05, need: 'hasPc' }
  ]; },
  panel() {
    const st = R2S.st, run = this.run(); if (!run) return '<p>No hot-fire data yet.</p>';
    const A = this.results(run), m = R2S_HOT.runData(run).meta, L = st.runs.filter((r) => r.data), ans = (st.an.ans[run.n] = st.an.ans[run.n] || {});
    const Qs = this.Q(), done = Qs.filter((q) => A[q.need]).every((q) => (ans[q.k] || {}).ok);
    return `<div class="eyebrow">Data analysis</div><h2>What did the motor really do?</h2>
      <p class="lede">The DAQ recorded the stand at 100 samples per second. Download the CSV, reduce it in a spreadsheet or your own script, and enter your results. The plots on the right overlay your prediction.</p>
      ${L.length > 1 ? `<div class="field"><label for="r2run">Test</label><span></span><select id="r2run" data-r2run style="grid-column:1/3">${L.map((r) => `<option value="${r.n}" ${r.n === run.n ? 'selected' : ''}>#${r.n} · ${esc(r.title)}</option>`).join('')}</select></div>` : ''}
      <div class="card"><b style="font-size:12px">Test #${run.n} record</b><div class="kv" style="margin-top:4px"><span>Channels</span><span>${['time', d0(A.hasF, 'thrust'), d0(m.hasPt, 'tank P'), d0(A.hasPc, 'chamber P'), d0(m.hasM, 'tank mass')].filter(Boolean).join(', ')}</span>
        <span>N₂O loaded / left</span><span>${fmt(m.moxLoaded, 3)} / ${fmt(m.moxResidual, 3)} kg</span><span>Grain mass before / after</span><span>${fmt(m.grainBefore, 3)} / ${fmt(m.grainAfter, 3)} kg</span><span>Throat area A_t</span><span>${fmt(m.At * 1e6, 1)} mm²</span><span>c*_theory at O/F ${fmt(A.OF, 2)}</span><span>${fmt(A.cth, 0)} m/s</span></div>
        <div class="btnrow"><button class="btn small" data-r2dlcsv>Download CSV</button><label class="btn small" style="cursor:pointer">Upload your own CSV<input type="file" accept=".csv,.txt" data-r2up hidden></label></div>
        ${this.up ? `<p class="muted" style="font-size:11.5px;margin:0">Uploaded: ${esc(this.up.name)} — ${this.up.n} rows, I = ${fmt(this.up.I, 0)} N·s, peak ${fmt(this.up.Fmax, 0)} N, burn ${fmt(this.up.tb, 2)} s (shown in grey).</p>` : ''}</div>
      ${Qs.map((q) => { if (!A[q.need]) return `<div class="card muted" style="font-size:11.8px">${esc(q.l)} — <b>not possible</b>: the ${q.need === 'hasF' ? 'load cell' : 'chamber pressure transducer'} was not fitted.</div>`; const a = ans[q.k] || {};
        return `<div class="card"><p class="bq" style="margin:0 0 6px">${esc(q.l)}</p><div class="r2ans"><input type="number" step="any" data-r2an="${q.k}" value="${a.v ?? ''}" ${a.ok ? 'disabled' : ''}> <span class="muted">${q.u}</span><button class="btn small" data-r2ango="${q.k}" ${a.ok ? 'disabled' : ''}>Check</button></div>${a.ok ? `<div class="note good" style="font-size:11.6px">✓ ${fmt(A[q.k], q.k === 'eff' ? 3 : q.k === 'tb' ? 2 : 0)} ${q.u}</div>` : a.tries ? `<div class="note warn" style="font-size:11.6px">Not within ${q.tol * 100} %.${a.tries >= 3 ? ` <button class="linkbtn" data-r2anshow="${q.k}">Show the answer</button>` : ''}</div>` : ''}</div>`; }).join('')}
      ${done ? this.compare(run, A) : ''}
      ${R2S.next('report', 'Write the report ›')}`;
    function d0(b, s) { return b ? s : ''; }
  },
  compare(run, A) {
    const st = R2S.st, tr = st.truth, pct = (m, p) => (100 * (m - p) / p);
    const e = pct(A.I, A.pI);
    return `<div class="card"><b style="font-size:12px">Prediction versus test</b><table class="r2tbl"><tr><th></th><th>predicted</th><th>measured</th><th>Δ</th></tr>
      <tr><td>Impulse</td><td>${fmt(A.pI, 0)}</td><td>${fmt(A.I, 0)}</td><td>${fmt(e, 1)} %</td></tr><tr><td>Burn time</td><td>${fmt(A.ptb, 2)}</td><td>${fmt(A.tb, 2)}</td><td>${fmt(pct(A.tb, A.ptb), 1)} %</td></tr>
      <tr><td>Peak Pc (bar)</td><td>${fmt(A.pPc, 1)}</td><td>${A.PcMax ? fmt(A.PcMax, 1) : '—'}</td><td>${A.PcMax ? fmt(pct(A.PcMax, A.pPc), 1) + ' %' : '—'}</td></tr><tr><td>Isp</td><td>${fmt(A.pIsp, 0)}</td><td>${fmt(A.Isp, 0)}</td><td>${fmt(pct(A.Isp, A.pIsp), 1)} %</td></tr></table>
      ${st.an.reveal ? `<div class="note" style="font-size:11.8px"><b>The hidden truth of this test</b><br>Injector C<sub>d</sub> ${fmt(tr.Cd, 3)} (design used ${fmt(run.D.Cd, 3)}) · fuel regression ${fmt((tr.aK - 1) * 100, 0)} % versus the literature coefficient · combustion efficiency ×${fmt(tr.etaK, 3)} · tank ${fmt(run.Tfire, 0)} °C on the day (prediction assumed ${run.D.Tt} °C).<br>
        ${Math.abs(tr.Cd - run.D.Cd) / run.D.Cd > 0.04 ? 'The injector flowed ' + (tr.Cd > run.D.Cd ? 'more' : 'less') + ' than assumed — the cold-flow test exists to catch exactly this. ' : 'Your C<sub>d</sub> was close, so the injector was not the main error. '}${Math.abs(tr.aK - 1) > 0.06 ? `The fuel regressed ${tr.aK > 1 ? 'faster' : 'slower'} than the textbook law, shifting O/F ${tr.aK > 1 ? 'fuel-rich' : 'oxidiser-rich'}. Teams fit their own a and n from several firings. ` : ''}${Math.abs(run.Tfire - run.D.Tt) >= 3 ? `The tank was ${run.Tfire > run.D.Tt ? 'warmer' : 'colder'} than in the prediction, so the vapour pressure and flow were ${run.Tfire > run.D.Tt ? 'higher' : 'lower'}.` : ''}</div>` : '<div class="btnrow"><button class="btn small" data-r2reveal>Reveal what really differed</button></div>'}</div>`;
  },
  csv(run) {
    if (!run) return ''; const d = R2S_HOT.runData(run), cols = [['time_s', d.t], ['thrust_N', d.F], ['chamber_bar', d.Pc], ['tank_bar', d.Pt], ['tank_mass_kg', d.M]].filter((c) => c[1]);
    const m = d.meta; let s = `# Race 2 Space hybrid static fire #${run.n} — RocketLab 3D simulated data\n# N2O loaded ${m.moxLoaded.toFixed(3)} kg, residual ${m.moxResidual.toFixed(3)} kg; grain before ${m.grainBefore.toFixed(3)} kg, after ${m.grainAfter.toFixed(3)} kg; throat area ${(m.At * 1e6).toFixed(2)} mm2\n`;

    const body=$("#rkMenuBody");
    if(md==="phone"&&!RS.moved.length){ for(const sel of [".hublink","#pathway","#modeSeg","#lcLang","#hdrTheme","#guideBtn"]){ const el=top.querySelector(sel); if(!el) continue; const m=document.createComment("rk"); el.parentNode.insertBefore(m,el); body.appendChild(el); RS.moved.push([el,m]); } }
    if(md!=="phone"&&RS.moved.length){ for(const [el,m] of RS.moved){ m.parentNode.insertBefore(el,m); m.remove(); } RS.moved=[]; closeMenu(); } }
  function openMenu(){ const s=$("#rkMenu"); s.hidden=false; s.querySelector(".rksheet-card [data-close]").focus(); document.addEventListener("keydown",keyMenu,true); }
  function closeMenu(){ const s=$("#rkMenu"); if(s&&!s.hidden){ s.hidden=true; document.removeEventListener("keydown",keyMenu,true); $("#rkMenuBtn")?.focus(); } }
  function keyMenu(e){ if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); closeMenu(); } }
  /* the step card on the 3D view */
  function card(show){ let c=$("#rkCard"); show=show&&RS.pane==="stage";
    const rail=$("#rail"); const steps=rail&&!rail.hidden?[...rail.querySelectorAll("button[data-step],button[data-r2stage]")].filter(b=>b.offsetParent!==null||true):[];
    if(!show||!steps.length){ if(c) c.hidden=true; return; }
    const i=Math.max(0,steps.findIndex(b=>b.classList.contains("on"))); const cur=steps[i]; const label=(cur.textContent||"").replace(/opt\./,"").replace(/^\s*\d+\s*/,"").replace(/\s+/g," ").trim();
    const mod=$("#moduleTabs .on")?.textContent?.trim()||"";
    const sig=[i,steps.length,label,RS.cardMin,mod].join("|"); if(!c){ c=document.createElement("section"); c.id="rkCard"; c.className="rkcard"; c.setAttribute("aria-live","polite"); document.body.appendChild(c); }
    c.hidden=false; c.classList.toggle("min",RS.cardMin); if(sig===RS.sig) return; RS.sig=sig;
    const prev=steps[i-1], next=steps[i+1];
    c.innerHTML=`<div class="rkc-top"><span class="rkc-k">${esc(mod)} · step ${i+1} of ${steps.length}</span><button type="button" class="rkc-min" aria-expanded="${!RS.cardMin}" aria-label="${RS.cardMin?"Expand":"Collapse"} the step card">${RS.cardMin?"▴":"▾"}</button></div>
      <div class="rkc-bar"><i style="width:${Math.round((i+1)/steps.length*100)}%"></i></div><h3>${esc(label)}</h3>
      <div class="rkc-acts"><button type="button" class="btn small" data-g="-1" ${prev?"":"disabled"}>‹ Back</button><button type="button" class="btn small" data-g="0">Step details</button><button type="button" class="btn small primary" data-g="1" ${next?"":"disabled"}>${next?esc((next.textContent||"").replace(/opt\./,"").replace(/^\s*\d+\s*/,"").trim())+" ›":"Last step"}</button></div>`;
    c.querySelector(".rkc-min").onclick=()=>{ RS.cardMin=!RS.cardMin; RS.sig=""; card(true); };
    c.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ const g=+b.dataset.g; if(g===0) return setPane("panel"); const t=steps[i+g]; if(t){ t.click(); RS.sig=""; setTimeout(()=>card(true),80); } }); }
  /* while a finger is on the 3D view the step card steps aside (same as the bench apps) */
  let bt=null; const busy=on=>{ const c=$("#rkCard"); if(!c) return; clearTimeout(bt); if(on) c.classList.add("busy"); else bt=setTimeout(()=>c.classList.remove("busy"),1400); };
  document.addEventListener("pointerdown",e=>{ if(RS.mode==="phone"&&e.target.closest(".stagewrap canvas")) busy(true); },true);
  for(const ev of ["pointerup","pointercancel"]) document.addEventListener(ev,()=>{ if(RS.mode==="phone") busy(false); },true);
  function init(){ apply(); let rt=null; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ apply(); },120); });
    setInterval(()=>{ if(RS.mode==="phone"){ apply(); } },700);
    document.addEventListener("click",e=>{ if(RS.mode!=="phone") return; if(e.target.closest("#moduleTabs button")) setTimeout(()=>{ RS.sig=""; apply(); },60);
      if(e.target.closest('[data-act="launch"]')) setTimeout(()=>setPane("stage"),200); },true); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",()=>setTimeout(init,50)); else setTimeout(init,50);
})();

</script>
</body>
</html>
