<script>
/* theme: saved choice, else the system setting */
(function(){ var t=null; try{ t=localStorage.getItem("sp-theme"); }catch(e){} if(t!=="light"&&t!=="dark") t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark"; document.documentElement.setAttribute("data-theme",t); })();

<title>RocketLab 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen test-cell console — lifecycle rail on top, step panel left, 3D stage centre, engineering overlay right, data dock under the stage. */
:root{
  --bg:#05030A; --panel:#0d0814; --panel2:#160d22; --raise:#241838; --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.14);
  --fg:#f3f0f7; --muted:#a39cb3; --dim:#726885;
  --accent:#a880ff;      /* SpacePoint heliotrope purple */
  --accent-light:#c7aaff;
  --data:#c7aaff;        /* telemetry lavender */
  --go:#34d399; --caution:#fbbf24; --nogo:#f87171;
  --cg:#f3f0f7; --cp:#f87171;
  --f-display:"Outfit",system-ui,-apple-system,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,sans-serif;
  --f-mono:"Inter",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f8f6fc; --panel:#ffffff; --panel2:#f3effa; --raise:#e9e1f5; --line:rgba(0,0,0,0.08); --line2:rgba(0,0,0,0.14);
  --fg:#190f2b; --muted:#6c637c; --dim:#988fa7;
  --accent:#8b5cf6; --accent-light:#a880ff; --data:#7c3aed;
  --go:#059669; --caution:#d97706; --nogo:#dc2626;
  --cg:#190f2b; --cp:#dc2626;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.45;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;}
/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;font-weight:700}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;border-radius:3px;padding:5px 10px;font-family:var(--f-display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tabs button:hover{color:var(--fg);background:var(--panel2)}
.tabs button.on{color:var(--fg);border-color:var(--line2);background:var(--raise)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 10px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#1b1206;font-weight:600}
select.pathway{width:auto;max-width:180px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:5px 8px;font-size:12px}
/* lifecycle rail */
.rail{display:flex;gap:0;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px 7px;display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap;font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.rail button em{font-style:normal;font-family:var(--f-mono);font-size:10px;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line2);color:var(--dim)}
.rail button.done em{background:var(--go);border-color:var(--go);color:#06140d}
.rail button.on{color:var(--fg);border-bottom-color:var(--accent)}
.rail button.on em{border-color:var(--accent);color:var(--accent)}
.rail button.lock{opacity:.45}
.rail button .opt{font-family:var(--f-mono);font-size:9px;letter-spacing:.04em;color:var(--dim);text-transform:lowercase;margin-left:2px}
.rail button{padding-left:8px;padding-right:8px}
/* workspace */
.work{min-height:0;display:grid;grid-template-columns:minmax(300px,360px) 1fr minmax(260px,300px)}
.panel{min-height:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 16px 40px}
.overlay{min-height:0;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:12px 14px 40px}
.stagewrap{min-width:0;min-height:0;display:grid;grid-template-rows:1fr auto;position:relative}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#1e1330 0%,#05030A 70%)}
.stage canvas.gl{display:block;width:100%;height:100%}
.stage canvas.c2d{position:absolute;inset:0;width:100%;height:100%;display:block}
.dock{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px 10px;max-height:46vh;overflow:auto}
/* typography */
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px;color:var(--fg);display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
h4{margin:10px 0 4px;font-size:12.5px;font-weight:600}
p{margin:0 0 8px;color:#bcc8d4;max-width:65ch}
.lede{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
small{font-size:11px;color:var(--muted)}
/* controls */
.field{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:8px 0}
.field label{font-size:12px;color:#c4cfda}
.field output{font-family:var(--f-mono);font-size:11.5px;color:var(--data);text-align:right}
.field input[type=range]{grid-column:1/3;width:100%;accent-color:var(--accent);height:18px;margin:0}
.field select,.field input[type=number],.field input[type=text]{grid-column:1/3}
select,input[type=number],input[type=text],textarea{background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:5px 7px;width:100%}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn{background:var(--raise);border:1px solid var(--line2);border-radius:3px;padding:7px 12px;font-weight:500;font-size:12.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1206;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid var(--line2);color:var(--muted)}
.chip.go{color:var(--go);border-color:color-mix(in srgb,var(--go) 55%,transparent);background:color-mix(in srgb,var(--go) 10%,transparent)}
.chip.caution{color:var(--caution);border-color:color-mix(in srgb,var(--caution) 55%,transparent);background:color-mix(in srgb,var(--caution) 10%,transparent)}
.chip.nogo{color:var(--nogo);border-color:color-mix(in srgb,var(--nogo) 55%,transparent);background:color-mix(in srgb,var(--nogo) 10%,transparent)}
.chip.data{color:var(--data);border-color:color-mix(in srgb,var(--data) 55%,transparent)}
.note{border-left:2px solid var(--data);background:color-mix(in srgb,var(--data) 7%,transparent);padding:8px 10px;margin:10px 0;font-size:12.3px;color:#c8d6e2}
.note.warn{border-left-color:var(--caution);background:color-mix(in srgb,var(--caution) 7%,transparent)}
.note.bad{border-left-color:var(--nogo);background:color-mix(in srgb,var(--nogo) 8%,transparent)}
.note.good{border-left-color:var(--go);background:color-mix(in srgb,var(--go) 8%,transparent)}
.note b{color:var(--fg)}
.learn-only{}
body.eng .learn-only{display:none!important}
details.acc{border:1px solid var(--line);border-radius:3px;margin:8px 0;background:var(--panel2)}
details.acc>summary{cursor:pointer;padding:7px 10px;font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.acc[open]>summary::after{content:"−"}
details.acc>div{padding:0 10px 10px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th,table.t td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.t td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
/* overlay readout */
.readout{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12px}
.readout dt{color:var(--muted)}
.readout dd{margin:0;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.statbig{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 0 6px}
.statbig .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.statbig .u{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.marginbar{position:relative;height:30px;margin:6px 0 16px;border-radius:2px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--nogo) 40%,transparent) 0 20%,color-mix(in srgb,var(--caution) 35%,transparent) 20% 40%,color-mix(in srgb,var(--go) 35%,transparent) 40% 80%,color-mix(in srgb,var(--caution) 30%,transparent) 80% 100%)}
.marginbar .tick{position:absolute;top:100%;font-family:var(--f-mono);font-size:9.5px;color:var(--muted);transform:translateX(-50%);padding-top:2px}
.marginbar .needle{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--fg);box-shadow:0 0 0 1px #000;transition:left .25s}
.marginbar .needle2{position:absolute;top:6px;bottom:6px;width:2px;background:var(--data);transition:left .25s}
.profile svg{width:100%;height:auto;display:block}
/* HUD */
.hud{position:absolute;pointer-events:none;inset:0;font-family:var(--f-mono);font-size:11px}
.hud .tl{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.hud .tr{position:absolute;right:12px;top:10px;text-align:right;pointer-events:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hud .bl{position:absolute;left:12px;bottom:10px;pointer-events:auto}
.hud .br{position:absolute;right:12px;bottom:10px;pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hudbox{background:color-mix(in srgb,var(--bg) 80%,transparent);border:1px solid var(--line2);border-radius:3px;padding:7px 9px;backdrop-filter:blur(4px)}
.hudgrid{display:grid;grid-template-columns:auto auto;gap:1px 12px}
.hudgrid span:nth-child(odd){color:var(--muted)}
.hudgrid span:nth-child(even){text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.phases{display:flex;gap:2px}
.phases span{padding:3px 6px;border:1px solid var(--line2);color:var(--dim);font-size:10px;letter-spacing:.08em;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.phases span.on{color:#1b1206;background:var(--accent);border-color:var(--accent)}
.phases span.past{color:var(--muted)}
.camsel button,.hudbtn{background:color-mix(in srgb,var(--bg) 80%,transparent);border:1px solid var(--line2);border-radius:3px;padding:4px 8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.camsel button.on,.hudbtn.on{color:var(--fg);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px}
.legend i{display:inline-block;width:12px;height:3px;margin-right:4px;vertical-align:middle}
.banner{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-family:var(--f-display);font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:6px 16px;border:1px solid var(--accent);color:var(--accent);background:color-mix(in srgb,var(--bg) 85%,transparent);white-space:nowrap}
.banner.bad{border-color:var(--nogo);color:var(--nogo)}
/* charts */
.charts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chart{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 8px 4px;min-width:0}
.chart header{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chart header b{color:var(--fg);font-weight:500}
.chart canvas{width:100%;height:110px;display:block;cursor:crosshair;touch-action:none}
.scrub{display:flex;gap:8px;align-items:center;margin-top:8px}
.scrub input{flex:1;accent-color:var(--accent)}
/* cards */
.card{border:1px solid var(--line2);border-radius:3px;background:var(--panel2);padding:10px 12px;margin:8px 0}
.choice{display:grid;gap:5px;margin:6px 0}
.choice label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:12.3px;background:var(--panel)}
.choice label:hover{border-color:var(--line2)}
.choice input{accent-color:var(--accent);margin-top:2px}
.choice label.right{border-color:var(--go);background:color-mix(in srgb,var(--go) 9%,transparent)}
.choice label.wrong{border-color:var(--nogo);background:color-mix(in srgb,var(--nogo) 9%,transparent)}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:3px;margin:5px 0;background:var(--panel2);cursor:pointer}
.comp.sel{border-color:var(--accent)}
.comp .sw{width:10px;height:10px;border-radius:2px}
.comp .nm{font-weight:500}
.comp .ms{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.toggle{position:relative;width:32px;height:17px;border-radius:9px;background:var(--line2);border:0;flex:none}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle.on{background:color-mix(in srgb,var(--go) 60%,transparent)}
.toggle.on::after{left:17px;background:var(--fg)}
/* pre-flight card */
.pfc{border:1px solid var(--accent);border-radius:3px;background:var(--panel2)}
.pfc header{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line2);font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.pfc .body{padding:8px 10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right}
/* avionics graph */
.avgraph svg{width:100%;height:auto;display:block;touch-action:manipulation}
.avnode{cursor:pointer}
/* poster */
.poster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.poster figure{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px}
.poster figure img,.poster figure svg{width:100%;height:auto;display:block;border-radius:2px;background:#0d141c}
.poster figcaption{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.poster .wide{grid-column:1/-1}
/* propulsion */
.syslist{display:grid;gap:4px}
.sysbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-size:12.3px}
.sysbtn.on{border-color:var(--accent)}
.sysbtn.road{opacity:.6}
.sysbtn small{font-family:var(--f-mono)}
.cmpgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.cmpgrid dt{color:var(--muted);font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
.cmpgrid dd{margin:0}
.flowsteps{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 10px}
.flowsteps span{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border:1px solid var(--line2);color:var(--dim);border-radius:2px}
.flowsteps span.on{color:var(--accent);border-color:var(--accent)}
.flowsteps span.done{color:var(--go);border-color:color-mix(in srgb,var(--go) 50%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line2);padding:8px 14px;border-radius:3px;z-index:50;font-size:12.5px}
.schem{position:absolute;inset:0;overflow:auto;background:radial-gradient(120% 90% at 50% 0%,#121c27 0%,#0a0f15 70%);z-index:2;padding:10px 12px 24px}
.schbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:-10px;background:color-mix(in srgb,var(--bg) 88%,transparent);padding:6px 0;z-index:3;backdrop-filter:blur(4px)}
.schbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.schhint{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.schhint b{color:var(--accent);font-family:var(--f-mono);font-weight:500}
.schsvg{width:100%;min-width:760px;height:auto;display:block}
.schsvg .wire:hover path:last-child{stroke-width:3.5}
.schsvg .pin:hover circle:last-of-type{stroke-width:2.5}
.hudbtn:disabled{opacity:.4;cursor:not-allowed}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.72);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modalcard{background:var(--panel);border:1px solid var(--line2);border-radius:4px;width:min(980px,100%);padding:16px 18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modalcard header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dsgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.dsgrid h4{font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin:6px 0}
.pdfnav{display:flex;gap:6px;align-items:center;margin:8px 0}
.pdfwrap{max-height:62vh;overflow:auto;background:#1a1f26;border:1px solid var(--line);border-radius:3px;padding:6px;text-align:center}
.pdfwrap canvas{background:#fff;max-width:none}
#dock select{background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:3px 6px;width:auto;font-size:12px}
@media (max-width:760px){.dsgrid{grid-template-columns:1fr}.schem{position:relative;inset:auto;height:auto;min-height:60vh}}
.guidebtn{display:inline-flex;align-items:center;gap:6px}

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

  const ring = new THREE.Mesh(new THREE.RingGeometry(1, 1.25, 48), new THREE.MeshBasicMaterial({ color: 0xf0a23b, side: THREE.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; scene.add(ring);
  const orbit = new Orbit(camera, document.getElementById('gl'), V3(0, 45, 0), 260, { az: 0.35, el: 0.12, min: 20, max: 900 });
  const view = {
    name: 'lineup', scene, camera, orbit, sel: null, goal: null,
    select(id) {
      this.sel = id; const gq = groups[id]; if (!gq) return;
      const v = gq.userData.v; const r = Math.max(v.D, v.geo.bst ? v.D + 2 * v.geo.bst[2] : v.D) * 0.75 + 2;
      ring.position.x = gq.position.x; ring.scale.setScalar(r);
      this.goal = { x: gq.position.x, y: Math.max(20, v.H * 0.5), d: Math.max(70, v.H * 2.1) };
      Object.values(groups).forEach((q) => { q.userData.lbl.material.opacity = q === gq ? 1 : 0.55; });
    },
    overview() { this.goal = { x: 0, y: 50, d: total * 1.1 }; },
    update(dt) {
      if (this.goal) { const k = 1 - Math.exp(-dt * 3); orbit.t.x += (this.goal.x - orbit.t.x) * k; orbit.t.y += (this.goal.y - orbit.t.y) * k; orbit.d += (this.goal.d - orbit.d) * k; if (Math.abs(this.goal.x - orbit.t.x) < 0.05 && Math.abs(this.goal.d - orbit.d) < 0.1) this.goal = null; }
      orbit.apply();
    }
  };
  return view;
}

/* ---------------- cycle diagrams ---------------- */
function cycleSVG(cyc, fu) {
  const OX = '#c7aaff', FU = (FUELS[fu] || FUELS.rp1).c, HOT = '#ef5b50', EL = '#b08cff', SH = '#56677a';
  const fuelN = { rp1: 'RP-1', lh2: 'LH₂', ch4: 'CH₄', solid: '' }[fu] || 'Fuel';
  const B = {};
  const box = (id, x, y, w, h, t, c = '#2a3a4c') => (B[id] = { x, y, w, h, t, c });
  const E2 = [];
  const edge = (a, b, col, o = {}) => E2.push({ a, b, col, ...o });
  if (cyc === 'solid') {
    box('ig', 115, 6, 70, 20, 'Igniter'); box('gr', 80, 46, 140, 52, 'Propellant grain', '#3a3326'); box('nz', 115, 126, 70, 22, 'Nozzle');
    edge('ig', 'gr', HOT); edge('gr', 'nz', HOT, { w: 3 });
  } else {
    box('ot', 12, 6, 74, 20, 'LOX tank', '#1d3446'); box('ft', 214, 6, 74, 20, `${fuelN} tank`, '#3a2f1f'); box('ch', 113, 150, 74, 22, 'Chamber');
    if (cyc === 'ffsc') {
      box('op', 8, 52, 50, 20, 'Ox pump'); box('tbo', 66, 52, 54, 20, 'Turbine'); box('tbf', 180, 52, 54, 20, 'Turbine'); box('fp', 242, 52, 50, 20, 'Fuel pump');
      box('pbo', 60, 100, 66, 22, 'Ox-rich PB', '#3a2228'); box('pbf', 174, 100, 66, 22, 'Fuel-rich PB', '#3a2228');
      edge('ot', 'op', OX); edge('ft', 'fp', FU); edge('op', 'pbo', OX, { w: 3 }); edge('fp', 'pbf', FU, { w: 3 }); edge('op', 'pbf', OX, { dash: 1 }); edge('fp', 'pbo', FU, { dash: 1 });
      edge('pbo', 'tbo', HOT); edge('pbf', 'tbf', HOT); edge('tbo', 'ch', HOT, { w: 3 }); edge('tbf', 'ch', HOT, { w: 3 }); edge('op', 'tbo', SH, { shaft: 1 }); edge('tbf', 'fp', SH, { shaft: 1 });
    } else {
      box('op', 22, 56, 60, 20, 'Ox pump'); box('fp', 218, 56, 60, 20, 'Fuel pump');
      edge('ot', 'op', OX); edge('ft', 'fp', FU);
      if (cyc === 'elec') {
        box('mo', 118, 56, 64, 20, 'E-motors', '#2c2440'); box('bt', 118, 102, 64, 20, 'Battery', '#2c2440');
        edge('bt', 'mo', EL); edge('mo', 'op', SH, { shaft: 1 }); edge('mo', 'fp', SH, { shaft: 1 }); edge('op', 'ch', OX, { w: 3 }); edge('fp', 'ch', FU, { w: 3 });
      } else {
        box('tb', 120, 56, 60, 20, 'Turbine'); edge('tb', 'op', SH, { shaft: 1 }); edge('tb', 'fp', SH, { shaft: 1 });
        if (cyc === 'gg') { box('gg', 120, 102, 60, 20, 'Gas gen.', '#3a2228'); box('ex', 226, 102, 62, 20, 'Overboard'); edge('op', 'ch', OX, { w: 3 }); edge('fp', 'ch', FU, { w: 3 }); edge('op', 'gg', OX, { dash: 1 }); edge('fp', 'gg', FU, { dash: 1 }); edge('gg', 'tb', HOT); edge('tb', 'ex', HOT, { dash: 1 }); }
        if (cyc === 'sc') { box('pb', 120, 102, 60, 20, 'Fuel-rich PB', '#3a2228'); edge('fp', 'pb', FU, { w: 3 }); edge('op', 'pb', OX, { dash: 1 }); edge('op', 'ch', OX, { w: 3 }); edge('pb', 'tb', HOT); edge('tb', 'ch', HOT, { w: 3, via: 1 }); }
        if (cyc === 'orsc') { box('pb', 120, 102, 60, 20, 'Ox-rich PB', '#3a2228'); edge('op', 'pb', OX, { w: 3 }); edge('fp', 'pb', FU, { dash: 1 }); edge('fp', 'ch', FU, { w: 3 }); edge('pb', 'tb', HOT); edge('tb', 'ch', HOT, { w: 3, via: 1 }); }
        if (cyc === 'exp') { box('jk', 218, 102, 70, 20, 'Cooling jacket', '#3a2f1f'); edge('fp', 'jk', FU, { w: 3 }); edge('jk', 'tb', FU, { w: 2 }); edge('tb', 'ch', FU, { w: 3, via: 1 }); edge('op', 'ch', OX, { w: 3 }); }
      }
    }
  }
  const cen = (b) => [b.x + b.w / 2, b.y + b.h / 2];
  const clip = (b, from, to) => { const [cx, cy] = cen(b); const dx = to[0] - cx, dy = to[1] - cy; const s = Math.min(Math.abs((b.w / 2) / (dx || 1e-9)), Math.abs((b.h / 2) / (dy || 1e-9))); return [cx + dx * s, cy + dy * s]; };
  const paths = E2.map((e) => {
    const A = B[e.a], Bb = B[e.b]; const pa = cen(A), pb = cen(Bb);
    let [x1, y1] = clip(A, pa, pb), [x2, y2] = clip(Bb, pb, pa);
    if (e.via) { [x1, y1] = [cen(A)[0], A.y + A.h]; [x2, y2] = [cen(Bb)[0] + 14, Bb.y]; return `<path d="M${x1} ${y1} C ${x1} ${y1 + 40}, ${x2 + 30} ${y2 - 30}, ${x2} ${y2}" fill="none" stroke="${e.col}" stroke-width="${e.w || 1.6}" ${e.dash ? 'stroke-dasharray="3 3"' : ''} marker-end="url(#cyA${e.col.slice(1)})"/>`; }
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${e.col}" stroke-width="${e.shaft ? 3 : e.w || 1.6}" ${e.dash ? 'stroke-dasharray="3 3"' : ''} ${e.shaft ? 'stroke-linecap="round" opacity=".8"' : `marker-end="url(#cyA${e.col.slice(1)})"`}/>`;
  }).join('');
  const cols = [...new Set(E2.filter((e) => !e.shaft).map((e) => e.col))];
  const defs = cols.map((c) => `<marker id="cyA${c.slice(1)}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8z" fill="${c}"/></marker>`).join('');
  const boxes = Object.values(B).map((b) => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="3" fill="${b.c}" stroke="#46596d"/><text x="${b.x + b.w / 2}" y="${b.y + b.h / 2 + 3.5}" text-anchor="middle">${b.t}</text>`).join('');
  return `<svg class="cycsvg" viewBox="0 0 300 ${cyc === 'solid' ? 156 : 180}" role="img" aria-label="${CYCLES[cyc].n} flow diagram"><defs>${defs}</defs>${paths}${boxes}</svg>
  <div class="legend cyclegend"><span><i style="background:${OX}"></i>Oxidiser</span><span><i style="background:${FU}"></i>Fuel</span><span><i style="background:${HOT}"></i>Hot gas</span>${cyc === 'elec' ? `<span><i style="background:${EL}"></i>Electric</span>` : ''}<span><i style="background:${SH}"></i>Shaft</span></div>`;
}

    const sepRisk = !E.vac && epsS > G.eps * 1.5 && stu.pe < 0.35 * P0;
    F = Math.max(0, F);

    const add = (k) => out.faults.push(k);
    if (seq === 'none') add('noign');
    if (seq === 'late') add('hardstart');
    if (pcR > 1.35) add('hardstart');
    if (ofR > 1.3) add('lean');
    if (mdR > 1.25 && pcR <= 1.35) add('overspeed');
    if (pcR > 1.12 && pcR <= 1.35) add('overpress');
    if (pcR < 0.6) add('lowpc');
    if (sepRisk) add('sep');
    if (ofR < 0.75) add('rich');
    if (epsS < G.eps * 0.6) add('under');
    if (mdR < 0.85 && pcR >= 0.6) add('lowthrust');
    if (Ae / G.Ae > 4 && !out.faults.includes('sep')) add('huge');

    out.kind = ORDER.find((k) => out.faults.includes(k)) || 'nominal';

  {
    id: 'thrust', no: 2, title: 'Where thrust comes from', mins: '20 min', q: 'How does throwing mass backwards push a rocket forwards?',
    leads: ['propulsion', 'Flight Lifecycle › Propulsion'],
    learn: [
      { h: 'Momentum out the back', t: 'Thrust is the rate at which the engine gives momentum to its exhaust: how many kilograms leave each second (mass flow) times how fast they leave (exhaust velocity).', eq: 'T = ṁ · vₑ  (+ (pₑ − pₐ)·Aₑ)', ex: ['A water rocket expels ṁ = 1.8 kg/s of water at vₑ = 28 m/s.', 'T = 1.8 × 28 = 50 N'], eng: 'The pressure term (pₑ − pₐ)·Aₑ matters for gas nozzles: it is why vacuum thrust is higher than sea-level thrust. For water, the jet leaves at ambient pressure, so it is zero.' },
      { h: 'Water rocket nozzle', t: 'For water pushed by compressed air, the jet speed comes from the pressure difference (Bernoulli). The mass flow is the water density times the nozzle area times the jet speed.', eq: 'vₑ = √(2·Δp/ρ)     ṁ = ρ·A·vₑ     T = 2·A·Δp', ex: ['Δp = 4 bar = 400 000 Pa, nozzle 9 mm → A = 6.36 × 10⁻⁵ m²', 'vₑ = √(2 × 400 000 / 1000) = 28.3 m/s', 'T = 2 × 6.36 × 10⁻⁵ × 400 000 = 50.9 N'], eng: 'The real bottle loses pressure as the air expands (pV^γ = const), so thrust decays during the burn. The interactive stand holds the pressure constant to show the basic relationships.' },
      { h: 'Specific impulse', t: 'Specific impulse Isp tells you how efficiently an engine uses propellant: the seconds of 1 N of thrust you get from 1 N weight of propellant. Higher Isp = faster exhaust = more speed for the same propellant.', eq: 'Isp = vₑ / g₀', ex: ['Water rocket at 4 bar: 28.3 / 9.81 = 2.9 s', 'Hobby solid motor: ≈ 80 s', 'Kerosene/oxygen (Merlin): ≈ 300 s; hydrogen/oxygen (RL10): ≈ 465 s'] },
      { h: 'Total impulse', t: 'Total impulse is thrust multiplied by burn time — the total “kick” the motor gives. Hobby motors are classed by it: each letter doubles the impulse.', eq: 'I = T_avg · t_burn  = m_propellant · vₑ', ex: ['Estes C6-5: about 10 N·s total, 6 N average thrust, 5 s ejection delay.', 'Burn time ≈ 10 / 6 = 1.7 s'] }
    ],
    quiz: [
      { q: 'Thrust is the product of…', opts: ['mass flow and exhaust velocity', 'mass and gravity', 'pressure and volume', 'area and speed'], ans: 'mass flow and exhaust velocity', why: 'T = ṁ·vₑ: kilograms per second times metres per second gives newtons.', hint: 'Think momentum per second.' },
      { q: 'Water rocket: you double the air pressure. The jet speed becomes…', opts: ['√2 ≈ 1.41 times faster', '2 times faster', '4 times faster', 'unchanged'], ans: '√2 ≈ 1.41 times faster', why: 'vₑ = √(2Δp/ρ), so doubling Δp multiplies vₑ by √2. Thrust (2·A·Δp) doubles.', hint: 'Look for the square root in the jet-speed formula.' },
      { q: 'Which engine uses its propellant most efficiently?', opts: ['RL10, Isp 465 s', 'Merlin, Isp 311 s', 'Hobby motor, Isp 80 s', 'Water rocket, Isp 3 s'], ans: 'RL10, Isp 465 s', why: 'Highest Isp = fastest exhaust = most impulse per kilogram of propellant.', hint: 'Bigger Isp means more push per kilogram.' },
      { q: 'A motor gives 18 N·s of total impulse. Which class is it?', opts: ['D (10–20 N·s)', 'C (5–10 N·s)', 'E (20–40 N·s)', 'B (2.5–5 N·s)'], ans: 'D (10–20 N·s)', why: 'Each letter doubles the range: C is 5–10, D is 10–20, E is 20–40 N·s.', hint: 'Each letter doubles the range.' },
      { x: true, q: 'A gas nozzle has exit area 0.88 m² and vacuum thrust 914 kN. Roughly what is its sea-level thrust? (p₀ = 101 kPa)', opts: ['≈ 825 kN', '≈ 914 kN', '≈ 1 003 kN', '≈ 450 kN'], ans: '≈ 825 kN', why: 'F_SL = F_vac − p₀·Aₑ = 914 − 101 × 0.88 = 825 kN (Merlin 1D is 845 kN).', hint: 'Ambient pressure acting on the exit area subtracts from thrust.' }
    ],
    predict: { q: 'At the same pressure you double the nozzle diameter. The thrust becomes…', opts: ['Twice as big', 'Four times as big', 'The same'], ans: 1, reveal: 'Thrust = 2·A·Δp and area grows with diameter squared, so doubling the diameter quadruples the thrust. The catch: the water runs out four times faster, so the total impulse stays the same.' },
    brief: { scenario: 'You have a regulated water-rocket test stand: the air pressure is held constant while 1 L of water is expelled. Choose the pressure and nozzle to meet each requirement.', goals: ['Reach 40 N of thrust', 'Get 60 N for at least 0.4 s', 'Deliver 35 N·s of total impulse from 1 L of water'] },
    science: { learn: ['Thrust = 2·A·Δp: it grows with nozzle area and pressure.', 'Burn time falls when the nozzle gets bigger, because the water leaves faster.', 'Total impulse from a fixed mass of water depends only on the jet speed — the nozzle size does not change it.'], eng: ['I = m_water · vₑ = m·√(2Δp/ρ) is independent of the nozzle area.', 'Same thrust for longer means higher pressure with a smaller nozzle: higher vₑ, lower ṁ.', 'This is the same reason rocket engines chase high exhaust velocity (Isp): it is impulse per kilogram.'] },
    analyze: { q: 'In round 3 the nozzle size made no difference to the total impulse. Why?', opts: ['Impulse = water mass × jet speed, and jet speed depends only on pressure', 'The stand was broken', 'Bigger nozzles have more drag'], ans: 'Impulse = water mass × jet speed, and jet speed depends only on pressure', why: 'A bigger nozzle trades higher thrust for a shorter burn; their product stays the same.' },
    think: {

      yellow: { q: 'Best benefit of a smaller nozzle at high pressure?', opts: ['A longer, gentler burn that is easier on the structure and keeps the rocket accelerating longer', 'More total water', 'Less drag'], ans: 0, model: 'Same impulse spread over a longer time means lower peak acceleration and loads, and the rocket spends less time fighting gravity at the start.' }

  /* ------------------------------------------------------------------ 3 */
  {
    id: 'rocketeq', no: 3, title: 'The rocket equation & staging', mins: '25 min', q: 'How much speed can a rocket gain from its propellant, and why do rockets have stages?',
    leads: ['simulate', 'Engines & Vehicles › Launch to orbit'],
    learn: [
      { h: 'Δv — the speed budget', t: 'Δv (delta-v) is the change in speed a rocket can produce. Every mission has a Δv price: about 9.3–9.5 km/s to reach low Earth orbit once gravity and drag losses are paid.', eq: 'Δv_orbit ≈ 7.8 km/s (orbital speed) + 1.5–2 km/s (losses)', ex: ['Orbital speed at 200 km: v = √(μ/r) = 7.79 km/s', 'Typical gravity + drag + steering losses: 1.5–2 km/s'] },
      { h: 'Tsiolkovsky’s rocket equation', t: 'The Δv depends on exhaust speed and on the mass ratio — full mass divided by empty mass. Because of the logarithm, adding propellant gives smaller and smaller returns.', eq: 'Δv = vₑ · ln(m₀ / m_f)', ex: ['vₑ = 3 000 m/s, m₀/m_f = 10', 'Δv = 3 000 × ln 10 = 6 908 m/s — not enough for orbit'], eng: 'Derivation: m·dv = −vₑ·dm (momentum balance with no external force). Integrate from m₀ to m_f: Δv = vₑ·ln(m₀/m_f).' },
      { h: 'Why one stage is not enough', t: 'Tanks, engines and structure cannot be thrown away while the stage burns. With structure at 10 % of the propellant mass, a single stage can never exceed vₑ·ln(11) — about 7.2 km/s for kerosene.', eq: 'Δv_max (1 stage) = vₑ · ln(1 + 1/ε)    ε = structure / propellant', ex: ['ε = 0.1, vₑ = 3 000 m/s → Δv_max = 3 000 × ln 11 = 7.19 km/s'] },
      { h: 'Staging', t: 'Staging drops empty tanks and engines part-way, so the next stage starts with a fresh, high mass ratio. Each stage’s Δv adds up. Upper stages often use hydrogen for its high exhaust speed.', eq: 'Δv_total = Σ vₑᵢ · ln(m₀ᵢ / m_fᵢ)', ex: ['Two kerosene stages can reach 9.4 km/s with 1 t of payload from about 60 t at lift-off.', 'With a hydrogen upper stage the same job needs only about 21 t.'] }
    ],
    quiz: [
      { q: 'What does m₀/m_f mean in the rocket equation?', opts: ['Full mass divided by empty mass', 'Payload divided by propellant', 'Thrust divided by weight', 'Exhaust speed divided by g'], ans: 'Full mass divided by empty mass', why: 'It is the mass ratio: everything at ignition over what is left at burnout.', hint: 'Subscript 0 = start, f = final.' },
      { q: 'vₑ = 2 500 m/s and mass ratio 4. Δv?', opts: ['≈ 3 466 m/s', '≈ 10 000 m/s', '≈ 625 m/s', '≈ 1 505 m/s'], ans: '≈ 3 466 m/s', why: 'Δv = 2 500 × ln 4 = 2 500 × 1.386 = 3 466 m/s.', hint: 'ln 4 ≈ 1.386.' },
      { q: 'Which change gives more Δv?', opts: ['Doubling the exhaust velocity', 'Doubling the mass ratio from 5 to 10', 'They give the same'], ans: 'Doubling the exhaust velocity', why: 'Doubling vₑ doubles Δv; doubling the mass ratio only adds vₑ·ln 2 (×1.43 here).', hint: 'One is multiplied, the other sits inside a logarithm.' },
      { q: 'Why do orbital rockets use stages?', opts: ['To throw away empty tanks and engines so the rest has a higher mass ratio', 'Because engines cannot burn for long', 'To reduce drag'], ans: 'To throw away empty tanks and engines so the rest has a higher mass ratio', why: 'Dead mass carried to burnout ruins the mass ratio; dropping it resets it.', hint: 'What limits a single stage’s mass ratio?' },
      { x: true, q: 'A stage has structure equal to 8 % of its propellant and vₑ = 4 400 m/s (no payload). Maximum Δv?', opts: ['≈ 11.5 km/s', '≈ 4.4 km/s', '≈ 9.4 km/s', '≈ 20 km/s'], ans: '≈ 11.5 km/s', why: 'Δv_max = 4 400 × ln(1 + 1/0.08) = 4 400 × ln 13.5 = 11.45 km/s — with no payload at all. Real hydrogen stages have bulky tanks, so their structure fraction is higher than 8 %.', hint: 'Mass ratio = (propellant + structure)/structure = 1 + 1/ε.' }
    ],
    predict: { q: 'A single kerosene stage carries 1 t of payload. You can make it as big as you like (structure = 10 % of propellant). Can it reach 9.4 km/s?', opts: ['Yes, if it is big enough', 'No, never', 'Only with a lighter payload'], ans: 1, reveal: 'No. Even with infinite propellant the mass ratio approaches 11, so Δv stops at 3 000 × ln 11 = 7.19 km/s. That ceiling is why every orbital rocket has at least two stages.' },
    brief: { scenario: 'You are the stage designer. Payload: 1 t. Each stage’s structure is 10 % of its propellant. Pick propellant loads (and the upper-stage fuel) to meet each Δv requirement with the least lift-off mass you can.', goals: ['Reach 6.5 km/s with one stage', 'Reach 9.4 km/s with two kerosene stages, lift-off under 80 t', 'Reach 9.4 km/s with a hydrogen upper stage, lift-off under 30 t'] },
    science: { learn: ['A single stage hits a hard ceiling set by its structure: Δv_max = vₑ·ln(1 + 1/ε).', 'Staging resets the mass ratio, and each stage’s Δv adds up.', 'A higher exhaust velocity (hydrogen) in the upper stage shrinks the whole rocket.'], eng: ['Each kilogram on the upper stage costs several kilograms at lift-off (the “growth factor”).', 'For equal vₑ and ε, the optimum splits Δv roughly equally between stages.', 'Hydrogen’s low density means bigger, heavier tanks per kilogram of propellant — real ε is higher than for kerosene.'] },
    analyze: { q: 'Swapping the upper stage to hydrogen cut lift-off mass by about two thirds. Main reason?', opts: ['Higher exhaust velocity on the stage that carries the payload multiplies through the whole stack', 'Hydrogen is lighter so tanks weigh nothing', 'The first stage got more efficient'], ans: 'Higher exhaust velocity on the stage that carries the payload multiplies through the whole stack', why: 'Every kilogram saved on the upper stage is a kilogram the first stage does not have to lift.' },
    think: {
      black: { q: 'Biggest risk of adding more stages?', opts: ['More separation events and engine ignitions that can fail', 'Too much Δv', 'Stages are heavier than one big tank'], ans: 0, model: 'Every separation and every engine start is a failure point; extra stages also add interstages, avionics and cost. Most launchers settle on two or three stages.' },
      yellow: { q: 'Best benefit of a reusable first stage (keeping propellant to land)?', opts: ['The most expensive hardware is flown again, cutting cost per launch', 'More payload', 'Higher Δv'], ans: 0, model: 'Reuse costs payload (Falcon 9: 22.8 t expendable vs ~17.5 t reusable) but saves building a new booster every flight. Try it in Engines & Vehicles › Launch to orbit.' }
    },
    create: { prompt: 'Design a two-stage launcher for a 2 t satellite: choose each stage’s propellant mass and fuel, and estimate the lift-off mass. Then fly a real vehicle in Launch to orbit and compare.', starter: 'Stage 1: … t of kerosene; stage 2: … t of …; Δv = …', build: { title: 'Two-stage balloon rocket', need: '2 long balloons, a paper cup ring, string, 2 straws, tape', steps: ['Thread the straws on a string across the room.', 'Inflate balloon 1, squeeze its neck through the cup ring; inflate balloon 2 inside the ring so it clamps balloon 1.', 'Tape both to the straws and release: balloon 2 pushes, then releases balloon 1.', 'Compare the distance with a single balloon.'] } }

  /* ------------------------------------------------------------------ 4 */
  {
    id: 'phases', no: 4, title: 'Flight phases & kinematics', mins: '20 min', q: 'What happens from ignition to landing, and how high will it go?',
    leads: ['predict', 'Flight Lifecycle › Simulate & Predict'],
    learn: [
      { h: 'The flight sequence', t: 'Every rocket flight follows the same phases: ignition and lift-off, powered ascent, burnout, unpowered coast, apogee (the highest point, where vertical speed is zero), recovery deployment, descent and landing.', eq: 'lift-off → burn → burnout → coast → apogee → deploy → descent → landing', ex: ['Model rocket C6-5: 1.7 s burn, ~5 s coast, ejection at apogee, ~10–20 s under parachute.'] },
      { h: 'Powered ascent', t: 'While the motor burns, the rocket accelerates. Ignoring drag and mass change, the speed and height at burnout follow from the constant-acceleration equations.', eq: 'a = T/m − g     v_bo = a·t_b     h_bo = ½·a·t_b²', ex: ['a = 40 m/s² for t_b = 1.5 s', 'v_bo = 60 m/s, h_bo = 45 m'] },
      { h: 'Coast to apogee', t: 'After burnout the rocket keeps climbing, slowing at g (plus drag), until its vertical speed reaches zero. The coast usually adds more height than the burn itself.', eq: 'h_apo = h_bo + v_bo²/(2g)     t_coast = v_bo / g', ex: ['v_bo = 60 m/s → coast adds 60²/(2 × 9.81) = 183 m in 6.1 s', 'Apogee ≈ 45 + 183 = 228 m (without drag)'], eng: 'Drag adds deceleration D/m to g, typically cutting a model rocket’s apogee by 20–50 %. The Simulate step in the Flight Lifecycle integrates the full equations with drag and changing mass.' },
      { h: 'Timing the recovery', t: 'The parachute must open near apogee, when the rocket is slowest. Open too early and it is torn at high speed; too late and the rocket is already falling fast. Hobby motors have a fixed ejection delay; flight computers detect apogee.', eq: 'ideal delay ≈ t_coast = v_bo / g', ex: ['C6-5: the “5” is a 5 s delay after burnout — matched to a ~50 m/s burnout speed.'] }
    ],
    quiz: [
      { q: 'At apogee, what is the rocket’s vertical speed?', opts: ['Zero', 'Maximum', 'Equal to burnout speed', 'Equal to g'], ans: 'Zero', why: 'Apogee is where climbing stops and falling begins.', hint: 'It is the top of the arc.' },
      { q: 'Burnout at 50 m/s. About how long until apogee (no drag)?', opts: ['5.1 s', '2.5 s', '10 s', '0.5 s'], ans: '5.1 s', why: 't = v/g = 50/9.81 = 5.1 s.', hint: 'Gravity removes 9.81 m/s every second.' },
      { q: 'Which phase usually adds the most altitude for a model rocket?', opts: ['The coast after burnout', 'The powered burn', 'Descent'], ans: 'The coast after burnout', why: 'A short, hard burn builds speed; the climb happens mostly while coasting.', hint: 'Compare ½·a·t_b² with v²/(2g) in the worked example.' },
      { q: 'Correct order?', opts: ['Burnout → coast → apogee → deployment', 'Coast → burnout → deployment → apogee', 'Apogee → burnout → coast → deployment'], ans: 'Burnout → coast → apogee → deployment', why: 'The motor stops, the rocket coasts up, stops at apogee, then recovery deploys.', hint: 'Recovery comes after the highest point.' },
      { x: true, q: 'v_bo = 80 m/s at h_bo = 70 m. Apogee without drag?', opts: ['≈ 396 m', '≈ 326 m', '≈ 150 m', '≈ 640 m'], ans: '≈ 396 m', why: 'h = 70 + 80²/(2 × 9.81) = 70 + 326 = 396 m.', hint: 'Add the coast height to the burnout height.' }
    ],
    predict: { q: 'Same thrust and mass, but the motor burns twice as long. The apogee (no drag) becomes…', opts: ['Twice as high', 'Four times as high', 'The same'], ans: 1, reveal: 'Both v_bo and h_bo scale with burn time, and the coast height grows with v_bo² — so apogee scales with t_b²: four times higher. Real drag reduces this.' },
    brief: { scenario: 'The flight model below plots altitude against time and marks each phase. Choose the motor thrust, burn time and ejection delay to meet the flight requirements.', goals: ['Reach an apogee of 150 m (±10 %)', 'Set the ejection delay to open within 1 s of apogee', 'With air drag on, reach 100 m (±10 %)'] },
    science: { learn: ['Apogee = burn height + coast height; the coast height grows with the square of burnout speed.', 'The best ejection delay equals the coast time, v_bo/g (shorter with drag).', 'Drag takes a big bite out of apogee, so real designs need more motor than the no-drag estimate.'], eng: ['No drag: h_apo = ½·a·t_b²·(1 + a/g) where a = T/m − g.', 'Apogee ∝ t_b² at fixed a, so impulse delivered over a longer burn helps.', 'With drag, deceleration in the coast is g + D/m, so coast time and height both shrink.'] },
    analyze: { q: 'With drag switched on, the ejection delay that worked before opened the parachute late. Why?', opts: ['Drag slows the coast, so apogee comes sooner than v_bo/g', 'Drag makes the motor burn longer', 'The parachute is heavier with drag'], ans: 'Drag slows the coast, so apogee comes sooner than v_bo/g', why: 'Deceleration in the coast is g + D/m, so the rocket stops climbing earlier.' },
    think: {
      black: { q: 'Biggest risk of an ejection delay that is too long?', opts: ['Deployment during a fast descent — the parachute shreds or the rocket lands hard', 'The rocket goes too high', 'The motor re-ignites'], ans: 0, model: 'Late deployment happens on the way down at high speed; shock loads can strip the parachute or the shock cord. Choose the delay from the simulated coast time with drag, not the no-drag estimate.' },
      yellow: { q: 'Benefit of an electronic apogee detector over a fixed delay?', opts: ['It deploys at the true apogee whatever the motor, mass or weather', 'It is always lighter', 'It needs no battery'], ans: 0, model: 'A barometric or accelerometer flight computer measures apogee directly, so deployment is right even if the motor underperforms or the rocket weathercocks. That is part of the Avionics step.' }
    },
    create: { prompt: 'Plan a flight to 120 m: choose a motor (impulse, burn time), estimate apogee with and without drag, and choose the ejection delay. Then check it in the Simulate step.', starter: 'Motor …, burn … s, v_bo ≈ … m/s, apogee ≈ … m, delay … s', build: { title: 'Measure apogee by triangulation', need: 'a protractor with a plumb line (clinometer), tape measure, two observers', steps: ['Stand 50 m from the pad.', 'Track the rocket and read the angle at its highest point.', 'Apogee ≈ 50 m × tan(angle) + eye height.', 'Compare with your prediction and log it in the Analyse step.'] } }

  {
    id: 'stability', no: 5, title: 'Stability: CG and CP', mins: '25 min', q: 'What keeps a rocket flying nose-first instead of tumbling?',
    leads: ['configure', 'Flight Lifecycle › Configure'],
    learn: [
      { h: 'Centre of gravity (CG)', t: 'The CG is the balance point: the average position of all the rocket’s mass. Adding mass near the nose moves the CG forward.', eq: 'x_CG = Σ(mᵢ·xᵢ) / Σmᵢ', ex: ['Body 300 g at 30 cm and nose clay 50 g at 5 cm', 'x_CG = (300×30 + 50×5)/350 = 26.4 cm from the nose tip'] },
      { h: 'Centre of pressure (CP)', t: 'The CP is where the air forces on the rocket effectively act. Big fins at the back pull the CP rearwards, like the feathers on an arrow.', eq: 'x_CP = Σ(C_Nαᵢ·xᵢ) / ΣC_Nαᵢ   (Barrowman)', ex: ['Nose cone: C_Nα = 2 acting at 0.47 × nose length', 'Three fins: often C_Nα ≈ 6–15, acting near the fin root mid-chord'], eng: 'Barrowman’s method sums the normal-force slope C_Nα of the nose (2 for any shape), the body transitions and the fins; for fins C_Nα = (1 + R/(s+R))·4N(s/d)² / (1 + √(1 + (2l_m/(c_r+c_t))²)).' },
      { h: 'Static margin', t: 'A rocket is stable when the CG is ahead of the CP. If it turns sideways, the air pushes on the tail behind the CG and swings the nose back into the wind. We measure the gap in body diameters (“calibers”).', eq: 'SM = (x_CP − x_CG) / d      aim for 1–2 calibers', ex: ['CG 40 cm, CP 48 cm from the nose, d = 6 cm', 'SM = 8 / 6 = 1.33 cal → stable'] },
      { h: 'Too little or too much', t: 'Below about 1 calibre the rocket may wobble or tumble. Above about 2–3 it is over-stable: it turns strongly into any crosswind (weathercocking) and flies off at an angle.', eq: 'SM < 0 unstable · 0–1 marginal · 1–2 good · > 2.5 over-stable', ex: ['Fix low SM: add nose weight or bigger/more rearward fins.', 'Fix high SM: smaller fins or less nose weight.'], eng: 'As propellant burns the CG usually moves forward (motor or water at the back), so SM grows during flight. The worst moment is just as the rocket leaves the rail: check the margin there, not at burnout. On a water rocket the bottle’s tapered shoulder at the back also pulls the CP forward.' }
    ],
    quiz: [
      { q: 'For a stable rocket, where must the CG be?', opts: ['Ahead of (closer to the nose than) the CP', 'Behind the CP', 'Exactly on the CP'], ans: 'Ahead of (closer to the nose than) the CP', why: 'Then the aerodynamic restoring moment turns the nose back into the airflow.', hint: 'Think of an arrow: weight at the front, feathers at the back.' },
      { q: 'CG at 35 cm, CP at 44 cm, diameter 6 cm. Static margin?', opts: ['1.5 cal', '9 cal', '0.67 cal', '−1.5 cal'], ans: '1.5 cal', why: 'SM = (44 − 35)/6 = 1.5 calibers.', hint: 'Divide the CG–CP gap by the diameter.' },
      { q: 'You add clay to the nose. What happens?', opts: ['CG moves forward, margin increases', 'CP moves forward, margin decreases', 'Nothing changes'], ans: 'CG moves forward, margin increases', why: 'Mass changes the CG only; the CP depends on shape.', hint: 'Mass moves which point?' },
      { q: 'A rocket with SM = 4 cal flies on a windy day. Likely behaviour?', opts: ['It weathercocks — turns into the wind and flies off at an angle', 'It tumbles', 'It flies perfectly straight up'], ans: 'It weathercocks — turns into the wind and flies off at an angle', why: 'Over-stable rockets align strongly with the relative wind, which tilts when there is a crosswind.', hint: 'Too much stability means it follows the wind.' },
      { x: true, q: 'Fins add C_Nα = 12 at 50 cm; the nose adds 2 at 6 cm. Where is the CP?', opts: ['≈ 43.7 cm', '≈ 28 cm', '≈ 50 cm', '≈ 6 cm'], ans: '≈ 43.7 cm', why: 'x_CP = (12×50 + 2×6)/(12 + 2) = 612/14 = 43.7 cm.', hint: 'Weighted average of positions, using C_Nα as the weights.' }
    ],
    predict: { q: 'You make the fins twice as tall (span). The static margin…', opts: ['Increases', 'Decreases', 'Stays the same'], ans: 0, reveal: 'Fin C_Nα grows roughly with span squared, so the CP moves strongly aft while the CG barely moves: the margin increases — often more than you expect.' },

/* =====================================================================
   Rocketry Basics — interactive models used in the Apply step
   Each model: params (sliders), compute(p) → results, draw(ctx, W, H, p, r, anim),
   readout(r) → HTML, rounds (three graded targets with locked inputs).
   ===================================================================== */
const BSIM_COL = { bg: '#0b1118', grid: '#1a2633', ink: '#d8e1ea', mute: '#8193a6', acc: '#f0a23b', data: '#c7aaff', go: '#46c08a', bad: '#ef5b50', vio: '#b08cff' };
function bArrow(c, x, y, dx, dy, col, label) {
  const L = Math.hypot(dx, dy); if (L < 2) return; c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3; c.beginPath(); c.moveTo(x, y); c.lineTo(x + dx, y + dy); c.stroke();
  const ux = dx / L, uy = dy / L; c.beginPath(); c.moveTo(x + dx, y + dy); c.lineTo(x + dx - ux * 10 - uy * 6, y + dy - uy * 10 + ux * 6); c.lineTo(x + dx - ux * 10 + uy * 6, y + dy - uy * 10 - ux * 6); c.closePath(); c.fill();
  if (label) { c.font = '600 12px "IBM Plex Mono", monospace'; c.textAlign = 'left'; c.fillText(label, x + dx + (Math.abs(dx) > 1 ? ux * 8 : 10), y + dy + (Math.abs(dy) > 1 ? uy * 14 : 0) + 4); }
}
function bText(c, s, x, y, o = {}) { c.font = o.f || '500 12px "IBM Plex Mono", monospace'; c.fillStyle = o.c || BSIM_COL.ink; c.textAlign = o.a || 'left'; c.textBaseline = o.b || 'alphabetic'; c.fillText(s, x, y); }
function bRocket(c, x, yBase, h, w, o = {}) {
  // simple rocket pointing up, base at yBase
  c.save(); c.translate(x, yBase); if (o.rot) c.rotate(o.rot);
  const nose = h * 0.22, fin = w * 0.9;
  c.fillStyle = o.body || '#e9ecef'; c.beginPath(); c.moveTo(-w / 2, 0); c.lineTo(-w / 2, -(h - nose)); c.quadraticCurveTo(-w / 2, -h, 0, -h); c.quadraticCurveTo(w / 2, -h, w / 2, -(h - nose)); c.lineTo(w / 2, 0); c.closePath(); c.fill();
  c.fillStyle = o.fin || '#f0a23b'; c.beginPath(); c.moveTo(-w / 2, -h * 0.18); c.lineTo(-w / 2 - fin, 0); c.lineTo(-w / 2, 0); c.fill(); c.beginPath(); c.moveTo(w / 2, -h * 0.18); c.lineTo(w / 2 + fin, 0); c.lineTo(w / 2, 0); c.fill();
  c.fillStyle = '#3a4048'; c.fillRect(-w * 0.28, 0, w * 0.56, h * 0.04);
  if (o.flame) { const g = c.createLinearGradient(0, 0, 0, o.flame); g.addColorStop(0, 'rgba(255,220,140,0.95)'); g.addColorStop(1, 'rgba(255,120,40,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(-w * 0.28, h * 0.04); c.lineTo(0, o.flame); c.lineTo(w * 0.28, h * 0.04); c.fill(); }
  c.restore();
}
function bBar(c, x, y, w, h, frac, col, label, val) { c.fillStyle = BSIM_COL.grid; c.fillRect(x, y, w, h); c.fillStyle = col; c.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h); if (label) bText(c, label, x, y - 5, { c: BSIM_COL.mute, f: '500 11px "IBM Plex Mono", monospace' }); if (val) bText(c, val, x + w, y - 5, { a: 'right', f: '600 11px "IBM Plex Mono", monospace' }); }
const RHO0 = 1.225;

const BAS_SIMS = {
  /* ---------- 1 · forces ---------- */
  forces: {
    params: [{ id: 'm', l: 'Rocket mass', min: 0.3, max: 3, step: 0.05, v: 0.8, u: ' kg', d: 2 }, { id: 'T', l: 'Thrust', min: 0, max: 200, step: 1, v: 20, u: ' N', d: 0 }],
    compute(p) { const W = p.m * g0, a = (p.T - W) / p.m, L = 2; return { W, a, TW: p.T / W, net: p.T - W, vr: a > 0 ? Math.sqrt(2 * a * L) : 0, L }; },
    readout: (r, p) => `<dl class="readout"><dt>Weight W = m·g</dt><dd>${fmt(r.W, 2)} N</dd><dt>Net force T − W</dt><dd>${fmt(r.net, 1)} N</dd><dt>Acceleration a</dt><dd>${fmt(r.a, 1)} m/s² · ${fmt(r.a / g0, 2)} g</dd><dt>T/W</dt><dd>${fmt(r.TW, 2)}</dd><dt>Speed leaving the 2 m rail</dt><dd>${r.a > 0 ? fmt(r.vr, 1) + ' m/s' : '—'}</dd></dl>`,
    rounds: [
      { t: 'Make the 0.8 kg rocket leave the pad.', lock: { m: 0.8 }, ok: (r) => r.a > 0, tip: 'Thrust must exceed the weight, m·g.' },

      { t: 'Mass is 1.5 kg. Leave the 2 m rail at 15 m/s or more, with T/W below 10.', lock: { m: 1.5 }, ok: (r) => r.vr >= 15 && r.TW < 10, tip: 'v² = 2·a·L → a = 15²/(2·2) = 56 m/s². Then T = m·(a + g).' }
    ],
    draw(c, W, H, p, r, an) {
      c.fillStyle = BSIM_COL.bg; c.fillRect(0, 0, W, H);
      const gy = H - 40, rx = W * 0.42, scale = Math.min(1, (H - 120) / 300); const rh = 150 * scale + 40, rw = 26;
      c.fillStyle = '#1d2732'; c.fillRect(0, gy, W, 40); c.fillStyle = '#2b3846'; c.fillRect(rx - 60, gy - 6, 120, 6);
      // launch rail

      bArrow(c, rx + 50, cy, 0, -Math.min(gy * 0.5, p.T * k), BSIM_COL.acc, `T = ${fmt(p.T, 0)} N`);
      bArrow(c, rx + 50, cy + 4, 0, Math.min(gy * 0.4, r.W * k), '#e9edf2', `W = ${fmt(r.W, 1)} N`);
      bArrow(c, rx - 70, cy, 0, -Math.max(-gy * 0.3, Math.min(gy * 0.5, r.net * k)), r.net > 0 ? BSIM_COL.data : BSIM_COL.bad, `net ${fmt(r.net, 1)} N`);
      bText(c, `a = ${fmt(r.a, 1)} m/s²  (${fmt(r.a / g0, 2)} g)`, 16, 26, { c: r.a > 0 ? BSIM_COL.go : BSIM_COL.bad, f: '600 14px "IBM Plex Mono", monospace' });
      bText(c, `T/W = ${fmt(r.TW, 2)}`, 16, 46);
      if (an && an.t != null && r.a > 0 && 0.5 * r.a * an.t * an.t >= r.L) bText(c, `left the rail at ${fmt(r.vr, 1)} m/s`, 16, 66, { c: BSIM_COL.acc });
      if (an && an.t != null && r.a <= 0) bText(c, 'it stays on the pad', 16, 66, { c: BSIM_COL.bad });
    },
    animDur: 1.6
  },
  /* ---------- 2 · thrust ---------- */
  thrust: {
    params: [{ id: 'P', l: 'Air pressure (held constant)', min: 1, max: 7, step: 0.1, v: 3, u: ' bar', d: 1 }, { id: 'dn', l: 'Nozzle diameter', min: 5, max: 22, step: 0.5, v: 9, u: ' mm', d: 1 }],
    compute(p) { const A = Math.PI * (p.dn / 2000) ** 2, dp = p.P * 1e5, ve = Math.sqrt(2 * dp / 1000), md = 1000 * A * ve, T = md * ve, tb = 1 / md; return { A, ve, md, T, tb, I: T * tb, Isp: ve / g0 }; },
    readout: (r) => `<dl class="readout"><dt>Jet speed vₑ = √(2Δp/ρ)</dt><dd>${fmt(r.ve, 1)} m/s</dd><dt>Mass flow ṁ = ρ·A·vₑ</dt><dd>${fmt(r.md, 2)} kg/s</dd><dt>Thrust T = ṁ·vₑ</dt><dd>${fmt(r.T, 1)} N</dd><dt>Burn time (1 L)</dt><dd>${fmt(r.tb, 2)} s</dd><dt>Total impulse I = T·t</dt><dd>${fmt(r.I, 1)} N·s</dd><dt>Isp = vₑ/g₀</dt><dd>${fmt(r.Isp, 1)} s</dd></dl>`,
    rounds: [
      { t: 'Produce at least 40 N of thrust.', lock: {}, ok: (r) => r.T >= 40, tip: 'T = 2·A·Δp: raise the pressure or open the nozzle.' },
      { t: 'Produce 55–65 N for at least 0.40 s (1 L of water).', lock: {}, ok: (r) => r.T >= 55 && r.T <= 65 && r.tb >= 0.4, tip: 'For the same thrust, higher pressure with a smaller nozzle burns longer.' },
      { t: 'Deliver at least 35 N·s of total impulse from 1 L of water.', lock: {}, ok: (r) => r.I >= 35, tip: 'Total impulse = water mass × jet speed. Which input changes the jet speed?' }
    ],
    draw(c, W, H, p, r, an) {
      c.fillStyle = BSIM_COL.bg; c.fillRect(0, 0, W, H);
      const cx = W * 0.4, top = 50, bh = Math.min(240, H * 0.5), bw = 90;
      // stand
      c.fillStyle = '#2b3846'; c.fillRect(cx - 80, top - 18, 160, 12); c.fillRect(cx - 74, top - 18, 8, bh + 40); c.fillRect(cx + 66, top - 18, 8, bh + 40);
      // bottle (nozzle down)
      c.fillStyle = 'rgba(160,200,230,0.18)'; c.strokeStyle = '#9fc6e6'; c.lineWidth = 2; c.beginPath(); c.roundRect ? c.roundRect(cx - bw / 2, top, bw, bh, 24) : c.rect(cx - bw / 2, top, bw, bh); c.fill(); c.stroke();
      const fill = an && an.t != null ? Math.max(0, 1 - an.t / Math.max(0.05, r.tb)) : 1; c.fillStyle = 'rgba(80,150,230,0.55)'; c.fillRect(cx - bw / 2 + 3, top + bh - bh * 0.55 * fill, bw - 6, bh * 0.55 * fill);
      const nw = Math.max(4, p.dn * 1.4); c.fillStyle = '#9aa3ab'; c.fillRect(cx - nw / 2 - 4, top + bh, nw + 8, 14);
      // jet

      bText(c, `${fmt(p.P, 1)} bar`, cx, top + 30, { a: 'center', f: '600 13px "IBM Plex Mono", monospace' });
      bArrow(c, cx + 110, top + bh * 0.5, 0, -Math.min(bh * 0.6, r.T * 1.6), BSIM_COL.acc, `T = ${fmt(r.T, 1)} N`);
      const bx = W * 0.66, bw2 = Math.min(220, W * 0.3);
      bBar(c, bx, 60, bw2, 12, r.T / 150, BSIM_COL.acc, 'thrust', `${fmt(r.T, 1)} N`);
      bBar(c, bx, 110, bw2, 12, r.tb / 2, BSIM_COL.data, 'burn time (1 L)', `${fmt(r.tb, 2)} s`);
      bBar(c, bx, 160, bw2, 12, r.I / 40, BSIM_COL.go, 'total impulse', `${fmt(r.I, 1)} N·s`);
      bBar(c, bx, 210, bw2, 12, r.ve / 40, BSIM_COL.vio, 'jet speed', `${fmt(r.ve, 1)} m/s`);
    },
    animDur: 2.2
  },
  /* ---------- 3 · rocket equation ---------- */
  rocketeq: {
    params: [{ id: 'ns', l: 'Number of stages', min: 1, max: 2, step: 1, v: 1, u: '', d: 0 }, { id: 'p1', l: 'Stage 1 propellant (kerosene)', min: 1, max: 300, step: 1, v: 20, u: ' t', d: 0 }, { id: 'p2', l: 'Stage 2 propellant', min: 0.5, max: 60, step: 0.5, v: 5, u: ' t', d: 1 }, { id: 'f2', l: 'Stage 2 fuel', min: 0, max: 1, step: 1, v: 0, u: '', d: 0, opts: ['Kerosene (vₑ 3.0 km/s)', 'Hydrogen (vₑ 4.4 km/s)'] }],
    compute(p) {

      let m = pay + st.reduce((a, s) => a + 1.1 * s.p, 0); const m0 = m; const dvs = [];
      st.forEach((s) => { const mf = m - s.p; dvs.push(s.ve * Math.log(m / mf)); m = mf - 0.1 * s.p; });

    readout: (r) => `<dl class="readout">${r.dvs.map((d, i) => `<dt>Stage ${i + 1} Δv</dt><dd>${fmt(d / 1000, 2)} km/s</dd>`).join('')}<dt>Total Δv</dt><dd>${fmt(r.dv / 1000, 2)} km/s</dd><dt>Lift-off mass</dt><dd>${fmt(r.m0, 1)} t</dd><dt>Needed for orbit</dt><dd>≈ 9.4 km/s</dd></dl>`,
    rounds: [
      { t: 'One kerosene stage, 1 t payload: reach 6.5 km/s.', lock: { ns: 1 }, ok: (r) => r.dv >= 6500, tip: 'Δv = vₑ·ln(m₀/m_f). Keep adding propellant — and watch the returns shrink.' },
      { t: 'Two kerosene stages: reach 9.4 km/s with lift-off mass under 80 t.', lock: { ns: 2, f2: 0 }, ok: (r) => r.dv >= 9400 && r.m0 <= 80, tip: 'Try a first stage around 40–55 t and a second around 5–8 t.' },
      { t: 'Hydrogen upper stage: reach 9.4 km/s with lift-off mass under 30 t.', lock: { ns: 2, f2: 1 }, ok: (r) => r.dv >= 9400 && r.m0 <= 30, tip: 'A small hydrogen stage does a lot: try roughly equal propellant in both stages.' }
    ],
    draw(c, W, H, p, r) {
      c.fillStyle = BSIM_COL.bg; c.fillRect(0, 0, W, H);
      // stacked rocket drawn with mass-proportional stage heights

/* =====================================================================
   Race 2 Space pathway — hybrid rocket motor model
   Nitrous oxide (N₂O) self-pressurising run tank → injector → single-port
   solid fuel grain (paraffin or HTPB) → convergent–divergent nozzle.
   Teaching-grade, quasi-steady, 0-D model. Property fits for N₂O from
   ESDU 91022 (saturated liquid density and vapour pressure).
   ===================================================================== */
const N2O = { Tc: 309.57, Pc: 72.51e5, rhoc: 452, M: 0.044013 };
function n2oPvap(T) { const th = 1 - T / N2O.Tc; if (th <= 0) return N2O.Pc; const b = [-6.71893, 1.35966, -1.3779, -4.051]; return N2O.Pc * Math.exp((N2O.Tc / T) * (b[0] * th + b[1] * th ** 1.5 + b[2] * th ** 2.5 + b[3] * th ** 5)); }
function n2oRhoL(T) { const th = Math.max(1e-4, 1 - T / N2O.Tc), b = [1.72328, -0.8395, 0.5106, -0.10412]; return N2O.rhoc * Math.exp(b[0] * th ** (1 / 3) + b[1] * th ** (2 / 3) + b[2] * th + b[3] * th ** (4 / 3)); }
function n2oRhoV(T) { const P = n2oPvap(T), Z = 1 - 0.62 * (P / N2O.Pc); return P * N2O.M / (Math.max(0.3, Z) * 8.314 * T); }
function n2oHv(T) { const th = Math.max(0, 1 - T / N2O.Tc); return 376e3 * th ** 0.31; }   // latent heat, J/kg (fit)
const N2O_CPL = 2400;                                                                        // liquid cp, J/kg·K (rises near Tc)

const R2S_FUELS = {
  paraffin: { n: 'Paraffin wax', rho: 900, a: 0.155, nexp: 0.5, cs: 1600, ofo: 7.5, note: 'Liquefying fuel: a melt layer sheds droplets, so it regresses 3–4× faster than HTPB — a short, fat grain works.' },
  htpb: { n: 'HTPB rubber', rho: 930, a: 0.198, nexp: 0.325, cs: 1550, ofo: 7.0, note: 'Classic polymer fuel: tough and easy to cast, but slow-burning — needs a long grain or several ports.' }
};
/* regression r [mm/s] = a · G_ox^n with G_ox in kg/m²·s (literature values for N₂O, single port) */
function r2sCstar(f, of) { const F = R2S_FUELS[f]; const x = Math.log(Math.max(0.3, of) / F.ofo); return F.cs * Math.max(0.55, 1 - 0.33 * x * x); }

/* default design — a ~1.3 kN paraffin/N₂O motor, typical of student hybrids */
function r2sDefault() {
  return {
    fuel: 'paraffin', mox: 5.0, Vt: 8.0, Tt: 20, tankD: 120, tankT: 4.0, tankMEOP: 70, tankMat: 'al6061',
    nInj: 10, dInj: 1.5, Cd: 0.65, dpLine: 2,
    Lg: 300, Dp0: 40, Dg: 100, prepost: true,
    Dt: 24, De: 46, chMEOP: 40, caseD: 110, caseT: 3.0, caseMat: 'al6061',
    seq: 'ign', relief: true
  };
}
const R2S_MATS = { al6061: { n: 'Aluminium 6061-T6', sy: 276e6, su: 310e6 }, ss316: { n: 'Stainless 316', sy: 205e6, su: 515e6 }, cfrp: { n: 'Carbon-fibre wrap (hoop)', sy: 600e6, su: 800e6 } };

/* placeholder competition requirements (editable by instructors until the official handbook values are entered) */
function r2sReqDefault() {
  return {
    official: false,
    Fmax: 5000, tbMax: 10, moxMax: 10, pcMax: 40, sfBurst: 2.0, sfProof: 1.5, stiff: 15, gMax: 600, Tday: 25, standoff: 50,
    note: 'Assumed values for teaching — replace with the Race 2 Space handbook.'
  };
}

/* ---------------- quasi-steady burn simulation ---------------- */
function r2sSim(D, opts = {}) {
  const F = R2S_FUELS[D.fuel], pa = 101325, dt = 0.01;
  const At = Math.PI * (D.Dt / 2000) ** 2, Ae = Math.PI * (D.De / 2000) ** 2, eps = Ae / At;
  const Ainj = D.nInj * Math.PI * (D.dInj / 2000) ** 2, Lg = D.Lg / 1000, Dg = D.Dg / 1000;
  const eta = (D.prepost ? 0.92 : 0.84) * (opts.etaK ?? 1), etaF = 0.95, aK = opts.aK ?? 1;
  let T = 273.15 + (opts.Tday ?? D.Tt), mL = D.mox, Dp = D.Dp0 / 1000, t = 0, mf = 0, mo = 0;
  const rhoL0 = n2oRhoL(T), Vliq0 = mL / rhoL0, ull = 1 - Vliq0 / (D.Vt / 1000);
  const out = { t: [], F: [], Pc: [], Pt: [], mo: [], mf: [], OF: [], G: [], Dp: [], T: [], ev: [], fault: null, notes: [] };
  if (ull < 0.05) out.notes.push('overfill');
  const solve = (Pt, rhoL) => {
    // find Pc with Pc = (ṁ_ox + ṁ_f)·c*·η / A_t, ṁ_ox from the injector ΔP
    let lo = pa, hi = Math.max(pa * 1.01, Pt - D.dpLine * 1e5), res = null;
    const f = (Pc) => { const dP = Math.max(0, Pt - D.dpLine * 1e5 - Pc); const mox = D.Cd * Ainj * Math.sqrt(2 * rhoL * dP); const Ap = Math.PI * Dp * Dp / 4, G = mox / Ap; const r = aK * F.a * Math.pow(Math.max(G, 1e-6), F.nexp) / 1000; const mfu = F.rho * r * Math.PI * Dp * Lg; const of = mfu > 0 ? mox / mfu : 99; const cs = r2sCstar(D.fuel, of) * eta; res = { mox, mfu, of, G, r, cs, dP }; return Pc - (mox + mfu) * cs / At; };
    for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (f(mid) > 0) hi = mid; else lo = mid; }
    f((lo + hi) / 2); res.Pc = (lo + hi) / 2; return res;
  };
  let burnout = null, peakPc = 0, peakF = 0;
  for (let i = 0; i < 4000; i++) {
    const Pt = n2oPvap(T), rhoL = n2oRhoL(T);
    let s; if (mL > 0) s = solve(Pt, rhoL); else s = null;
    if (!s) { // liquid gone: short gas-phase tail
      if (burnout == null) { burnout = t; out._b = { Pc: out.Pc[out.Pc.length - 1], F: out.F[out.F.length - 1], Pt: out.Pt[out.Pt.length - 1] }; }
      const k = Math.exp(-(t - burnout) / 0.25), b0 = out._b;            // vapour-phase tail: decays from the values at liquid depletion
      const Pc = pa + (b0.Pc - pa) * k, Fz = b0.F * k; out.t.push(t); out.F.push(Fz); out.Pc.push(Pc); out.Pt.push(b0.Pt * (0.35 + 0.65 * k)); out.mo.push(0); out.mf.push(0); out.OF.push(out.OF[out.OF.length - 1]); out.G.push(0); out.Dp.push(Dp * 1000); out.T.push(T - 273.15);
      t += dt; if (k < 0.02) break; continue;
    }
    const pr = thrustCoef(Math.max(1.05, eps), s.Pc, pa, 1.24); let Fn = Math.max(0, pr.CF * s.Pc * At * etaF);
    if (i === 0) { out.G0 = s.G; out.stiff0 = s.dP / s.Pc; out.pe0 = pr.pe; }
    peakPc = Math.max(peakPc, s.Pc); peakF = Math.max(peakF, Fn);
    out.t.push(t); out.F.push(Fn); out.Pc.push(s.Pc); out.Pt.push(Pt); out.mo.push(s.mox); out.mf.push(s.mfu); out.OF.push(s.of); out.G.push(s.G); out.Dp.push(Dp * 1000); out.T.push(T - 273.15);
    // update states
    const dmo = s.mox * dt; mL -= dmo; mo += dmo; mf += s.mfu * dt; Dp += 2 * s.r * dt;
    const mEv = dmo * n2oRhoV(T) / rhoL; if (mL > 0) T -= mEv * n2oHv(T) / (Math.max(0.2, mL) * N2O_CPL);
    if (Dp >= Dg - 0.002 && !out.fault) { out.fault = { kind: 'burnthrough', t }; out.notes.push('web'); break; }
    t += dt;
  }
  // integrate
  let I = 0; for (let k = 1; k < out.t.length; k++) I += 0.5 * (out.F[k] + out.F[k - 1]) * (out.t[k] - out.t[k - 1]);
  const fMax = Math.max(...out.F), th = 0.1 * fMax; const on = out.t.filter((_, k) => out.F[k] >= th); const tb = on.length ? on[on.length - 1] - on[0] : 0;
  const prop = mo + mf;
  Object.assign(out, { I, tb, Fmax: peakF, Favg: tb > 0 ? I / tb : 0, PcMax: peakPc, prop, Isp: prop > 0 ? I / (prop * G0) : 0, moxUsed: mo, mfUsed: mf, eps, At, Ae, ull, OFavg: mf > 0 ? mo / mf : 0, webLeft: (Dg - Dp) * 500, Pt0: n2oPvap(273.15 + (opts.Tday ?? D.Tt)) });
  return out;
}

/* ---------------- structural checks (thin-wall hoop stress) ---------------- */
function r2sVessel(Dmm, tmm, mat) { const M = R2S_MATS[mat]; const r = Dmm / 2000, t = tmm / 1000; return { burst: M.su * t / r, yieldP: M.sy * t / r, M }; }

/* ---------------- all checks → the go / no-go list ---------------- */
function r2sChecks(D, Q, sim, pid) {
  const C = []; const add = (id, group, label, ok, val, need, sev = 'fail', why = '') => C.push({ id, group, label, ok, val, need, sev: ok ? 'ok' : sev, why });
  const Tmax = Q.Tday + 5, PtMax = n2oPvap(273.15 + Tmax);
  const tank = r2sVessel(D.tankD, D.tankT, D.tankMat), ch = r2sVessel(D.caseD, D.caseT, D.caseMat);
  add('tankMEOP', 'Pressure vessels', 'Run-tank MEOP covers the hottest expected day (+5 °C)', D.tankMEOP * 1e5 >= PtMax, `${fmt(D.tankMEOP, 0)} bar`, `≥ ${fmt(PtMax / 1e5, 1)} bar (N₂O at ${Tmax} °C)`, 'fail', 'N₂O vapour pressure rises steeply with temperature; at 36.4 °C it is supercritical.');
  add('tankBurst', 'Pressure vessels', `Run-tank burst pressure ≥ ${Q.sfBurst} × MEOP`, tank.burst >= Q.sfBurst * D.tankMEOP * 1e5, `${fmt(tank.burst / 1e5, 0)} bar`, `≥ ${fmt(Q.sfBurst * D.tankMEOP, 0)} bar`, 'fail', 'Thin-wall hoop stress: P_burst = σ_UTS · t / r.');
  add('tankProof', 'Pressure vessels', `Run tank does not yield at proof (${Q.sfProof} × MEOP)`, tank.yieldP >= Q.sfProof * D.tankMEOP * 1e5, `${fmt(tank.yieldP / 1e5, 0)} bar`, `≥ ${fmt(Q.sfProof * D.tankMEOP, 0)} bar`);
  add('chMEOP', 'Pressure vessels', 'Chamber MEOP above the peak chamber pressure', D.chMEOP * 1e5 >= sim.PcMax * 1.1, `${fmt(D.chMEOP, 0)} bar`, `≥ ${fmt(sim.PcMax * 1.1 / 1e5, 1)} bar (peak + 10 %)`);
  add('chBurst', 'Pressure vessels', `Motor case burst ≥ ${Q.sfBurst} × chamber MEOP`, ch.burst >= Q.sfBurst * D.chMEOP * 1e5, `${fmt(ch.burst / 1e5, 0)} bar`, `≥ ${fmt(Q.sfBurst * D.chMEOP, 0)} bar`);
  add('ullage', 'Oxidiser', 'Run tank has ≥ 10 % ullage at fill temperature', sim.ull >= 0.1, `${fmt(sim.ull * 100, 0)} %`, '≥ 10 %', 'fail', 'Liquid N₂O expands as it warms; a full tank can go hydraulically solid and burst.');
  add('moxMax', 'Oxidiser', 'N₂O load within the competition limit', D.mox <= Q.moxMax, `${fmt(D.mox, 1)} kg`, `≤ ${Q.moxMax} kg`);
  add('stiff', 'Combustion', `Injector pressure drop ≥ ${Q.stiff} % of chamber pressure`, sim.stiff0 * 100 >= Q.stiff, `${fmt(sim.stiff0 * 100, 0)} %`, `≥ ${Q.stiff} %`, sim.stiff0 * 100 >= 8 ? 'warn' : 'fail', 'A “stiff” injector decouples the feed system from chamber pressure oscillations (chugging).');
  add('gox', 'Combustion', 'Initial oxidiser flux G_ox within the flame-holding limit', sim.G0 <= Q.gMax, `${fmt(sim.G0, 0)} kg/m²·s`, `≤ ${Q.gMax} kg/m²·s`, sim.G0 <= Q.gMax * 1.2 ? 'warn' : 'fail', 'Too much oxidiser flow through a small port blows the diffusion flame off the fuel surface (flooding).');
  add('web', 'Combustion', 'Fuel web remains when the oxidiser runs out', !sim.fault || sim.fault.kind !== 'burnthrough', sim.fault && sim.fault.kind === 'burnthrough' ? 'burns through' : `${fmt(sim.webLeft, 1)} mm left`, '> 2 mm', 'fail', 'If the port reaches the case wall the flame touches the casing: case burn-through.');
  add('fit', 'Geometry', 'Fuel grain (plus 2 mm liner) fits inside the motor case', D.Dg + 4 <= D.caseD - 2 * D.caseT + 1e-9, `${fmt(D.Dg + 4, 0)} mm`, `≤ ${fmt(D.caseD - 2 * D.caseT, 0)} mm case ID`);
  add('noz', 'Geometry', 'Nozzle exit wider than the throat', D.De > D.Dt * 1.05, `ε = ${fmt(sim.eps, 2)}`, 'ε > 1.1');
  add('pc', 'Performance', 'Peak chamber pressure within the competition limit', sim.PcMax <= Q.pcMax * 1e5, `${fmt(sim.PcMax / 1e5, 1)} bar`, `≤ ${Q.pcMax} bar`);
  add('fmax', 'Performance', 'Peak thrust within the competition class', sim.Fmax <= Q.Fmax, `${fmt(sim.Fmax, 0)} N`, `≤ ${Q.Fmax} N`);
  add('tb', 'Performance', 'Burn time within the limit', sim.tb <= Q.tbMax, `${fmt(sim.tb, 1)} s`, `≤ ${Q.tbMax} s`);
  add('sep', 'Performance', 'Nozzle not grossly over-expanded at sea level', sim.pe0 >= 0.35 * 101325, `${fmt(sim.pe0 / 1e3, 0)} kPa exit`, '≥ 35 kPa', 'warn', 'Flow separation (Summerfield): pₑ below ~0.35 p₀ causes side loads.');
  if (pid) {
    const req = R2S_PID.filter((c) => c.req);
    req.forEach((c) => add('pid_' + c.id, 'Test stand (P&ID)', c.n, !!pid[c.id], pid[c.id] ? 'fitted' : 'missing', 'required', 'fail', c.why));
  }
  add('seq', 'Procedure', 'Ignition sequence: igniter lit and confirmed before the main oxidiser valve opens', D.seq === 'ign', D.seq === 'ign' ? 'agreed' : D.seq === 'late' ? 'valve first' : 'not yet agreed', 'igniter → confirm → main valve');
  return C;
}
